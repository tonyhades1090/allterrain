<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>All Terrain | Map View</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #020617; position: fixed; width: 100%; }
        
        /* Simulación de Mapa */
        #map-bg { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('https://user-images.githubusercontent.com/10001/fake-map.jpg'); 
            background-size: cover; background-position: center; 
        }

        /* Contenedor de Botones Flotantes (Derecha Inferior) */
        .map-controls {
            position: fixed; bottom: 30px; right: 20px;
            display: flex; flex-direction: column; gap: 15px; z-index: 90;
        }

        .control-btn {
            width: 55px; height: 55px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
            transition: 0.2s;
        }
        
        /* Botón de Ubicación (Gris como Google Maps) */
        .btn-location { background: #f8fafc; color: #475569; }
        /* Botón de la Gota (Azul) */
        .btn-drop { background: #2563eb; color: white; }

        .control-btn:active { transform: scale(0.9); }

        /* Panel de Análisis */
        #side-panel { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(25px); 
            border-radius: 2rem 2rem 0 0; z-index: 1000; 
            padding: 20px; padding-bottom: 40px;
            transform: translateY(100%); transition: transform 0.4s ease;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
        }
        #side-panel.open { transform: translateY(0); }

        /* Botón Cerrar X */
        .close-x {
            position: absolute; top: -15px; right: 20px;
            width: 40px; height: 40px; background: #1e293b;
            border-radius: 50%; color: white; display: flex;
            align-items: center; justify-content: center; border: 2px solid #334155;
        }

        input, textarea { background: #0f172a !important; border: 1px solid #334155 !important; color: white !important; outline: none; text-align: center; }
    </style>
</head>
<body>

    <div id="map-bg"></div>

    <div class="fixed top-6 inset-x-4 z-[50]">
        <div class="flex gap-2">
            <div class="relative flex-1">
                <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                <input id="searchInput" type="text" placeholder="Search address..." class="w-full bg-slate-900/90 text-white p-3.5 pl-11 rounded-2xl border border-white/10 shadow-xl text-sm">
            </div>
            <button class="bg-blue-600 text-white px-4 rounded-2xl active:scale-95"><i class="fa-solid fa-arrow-right"></i></button>
        </div>
    </div>

    <div class="map-controls">
        <button class="control-btn btn-drop" onclick="abrirPanel()">
            <i class="fa-solid fa-droplet text-xl"></i>
        </button>
        <button class="control-btn btn-location" onclick="alert('Centrando ubicación...')">
            <i class="fa-solid fa-location-crosshairs text-xl"></i>
        </button>
    </div>

    <div id="side-panel">
        <button onclick="cerrarPanel()" class="close-x"><i class="fa-solid fa-xmark"></i></button>
        
        <h2 class="text-blue-400 font-bold uppercase tracking-widest text-[10px] text-center mb-5">Field Analysis</h2>

        <div class="grid grid-cols-2 gap-3 mb-4">
            <div>
                <label class="text-[9px] text-slate-500 font-bold block mb-1">TDS (PPM)</label>
                <input id="tds" type="number" placeholder="000" class="w-full p-3 rounded-xl text-lg font-bold">
            </div>
            <div>
                <label class="text-[9px] text-slate-500 font-bold block mb-1">CHLORINE</label>
                <input id="cloro" type="number" step="0.1" placeholder="0.0" class="w-full p-3 rounded-xl text-lg font-bold">
            </div>
        </div>

        <div class="grid grid-cols-4 gap-2 mb-4">
            <button onclick="setStatus('💧', this)" class="bg-slate-800 p-3 rounded-xl text-xl active:bg-blue-900 border-2 border-transparent">💧</button>
            <button onclick="setStatus('✅', this)" class="bg-slate-800 p-3 rounded-xl text-xl border-2 border-transparent">✅</button>
            <button onclick="setStatus('❌', this)" class="bg-slate-800 p-3 rounded-xl text-xl border-2 border-transparent">❌</button>
            <button onclick="setStatus('⚠️', this)" class="bg-slate-800 p-3 rounded-xl text-xl border-2 border-transparent">⚠️</button>
        </div>

        <textarea id="notas" class="w-full p-3 rounded-xl text-sm h-20 mb-4" placeholder="Notes..."></textarea>
        <button onclick="saveData()" id="save-btn" class="w-full bg-blue-600 py-4 rounded-xl font-bold text-white uppercase tracking-widest text-xs">Save Inspection</button>
    </div>

    <script>
        // FIREBASE (Tu configuración actual)
        const firebaseConfig = {
          apiKey: "AIzaSyCcX7KNM-w1A-3sgNoFwKxMVO7M7_e1Ab4",
          authDomain: "all-terrain-8755d.firebaseapp.com",
          projectId: "all-terrain-8755d",
          appId: "1:409885375480:web:bb2fc6df313721e195340d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const panel = document.getElementById('side-panel');
        function abrirPanel() { panel.classList.add('open'); }
        function cerrarPanel() { panel.classList.remove('open'); }

        async function saveData() {
            const data = {
                tds: document.getElementById('tds').value,
                cloro: document.getElementById('cloro').value,
                notas: document.getElementById('notas').value,
                fecha: firebase.firestore.FieldValue.serverTimestamp()
            };
            if(!data.tds || !data.cloro) return alert("Faltan datos");
            try {
                await db.collection("analisis").add(data);
                alert("✅ Guardado");
                cerrarPanel();
            } catch (e) { alert("Error"); }
        }
    </script>
</body>
</html>
