<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>All Terrain Fix</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #0f172a; padding: 30px; border-radius: 20px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #1e293b; }
        input { width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 10px; background: #1e293b; border: 1px solid #334155; color: white; font-size: 16px; }
        button { width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; text-transform: uppercase; cursor: pointer; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="text-2xl font-bold mb-6 text-blue-500">ALL TERRAIN PRO</h1>
        <input id="email" type="email" placeholder="Email">
        <input id="pass" type="password" placeholder="Contraseña">
        
        <button onclick="login()" style="background: #2563eb; color: white;">INICIAR SESIÓN</button>
        
        <p class="text-xs text-slate-500 my-2">O SI ES TU PRIMERA VEZ:</p>
        
        <button onclick="registrar()" style="background: #1e293b; color: #60a5fa; border: 1px solid #3b82f6;">CREAR CUENTA NUEVA</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCcX7KNM-w1A-3sgNoFwKxMVO7M7_e1Ab4",
            authDomain: "all-terrain-8755d.firebaseapp.com",
            projectId: "all-terrain-8755d",
            appId: "1:409885375480:web:bb2fc6df313721e195340d"
        };
        firebase.initializeApp(firebaseConfig);

        async function login() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            try {
                await firebase.auth().signInWithEmailAndPassword(e, p);
                alert("¡LOGRADO! Entraste.");
                location.href = "https://www.google.com"; // Prueba para ver si redirige
            } catch(err) { alert("Error al entrar: " + err.message); }
        }

        async function registrar() {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            try {
                await firebase.auth().createUserWithEmailAndPassword(e, p);
                alert("¡CUENTA CREADA! Ahora dale a Iniciar Sesión.");
            } catch(err) { alert("Error al registrar: " + err.message); }
        }
    </script>
</body>
</html>
