<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>All Terrain | Field Analysis</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); }
        body { background-color: #020617; color: white; font-family: sans-serif; }
        input, select { background: #1e293b !important; border: 1px solid #334155 !important; color: white !important; }
    </style>
</head>
<body>

    <div id="app-ui" class="p-4">
        <div class="flex justify-between items-center mb-6 pt-4">
            <h1 class="text-xl font-black italic text-blue-500">ALL TERRAIN</h1>
            <select id="lang" class="p-2 rounded-lg text-xs">
                <option value="es">Español</option>
                <option value="en">English</option>
                <option value="fr">Français</option>
            </select>
        </div>

        <div class="space-y-6">
            <div class="bg-slate-900/50 p-6 rounded-[2.5rem] border border-white/5 shadow-xl">
                <h2 id="house-id" class="text-center text-blue-400 font-bold mb-4 tracking-widest">NUEVA INSPECCIÓN</h2>
                
                <div class="grid grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="text-[10px] uppercase text-slate-400 ml-2">TDS (ppm)</label>
                        <input id="tds" type="number" placeholder="000" class="w-full p-4 rounded-2xl text-center text-xl font-bold">
                    </div>
                    <div>
                        <label class="text-[10px] uppercase text-slate-400 ml-2">Cloro (mg/L)</label>
                        <input id="cloro" type="number" step="0.1" placeholder="0.0" class="w-full p-4 rounded-2xl text-center text-xl font-bold">
                    </div>
                </div>

                <label class="text-[10px] uppercase text-slate-400 ml-2">Notas de Campo</label>
                <textarea id="notas" class="w-full p-4 rounded-2xl h-24 mb-4 text-sm" placeholder="Estado de los filtros, presión, etc..."></textarea>

                <button onclick="enviarDatos()" id="btn-save" class="w-full bg-blue-600 hover:bg-blue-500 py-5 rounded-2xl font-black text-white shadow-lg transition-all active:scale-95">
                    GUARDAR INSPECCIÓN
                </button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCcX7KNM-w1A-3sgNoFwKxMVO7M7_e1Ab4",
          authDomain: "all-terrain-8755d.firebaseapp.com",
          projectId: "all-terrain-8755d",
          storageBucket: "all-terrain-8755d.firebasestorage.app",
          messagingSenderId: "409885375480",
          appId: "1:409885375480:web:bb2fc6df313721e195340d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        async function enviarDatos() {
            const btn = document.getElementById('btn-save');
            const tds = document.getElementById('tds').value;
            const cloro = document.getElementById('cloro').value;
            const notas = document.getElementById('notas').value;
            const idioma = document.getElementById('lang').value;

            if(!tds || !cloro) return alert("Por favor, llena TDS y Cloro");

            btn.innerText = "ENVIANDO...";
            btn.disabled = true;

            try {
                await db.collection("analisis").add({
                    tds: tds,
                    cloro: cloro,
                    notas: notas,
                    idioma: idioma,
                    fecha: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("✅ ÉXITO: Los datos ya están en la nube.");
                document.getElementById('tds').value = "";
                document.getElementById('cloro').value = "";
                document.getElementById('notas').value = "";
            } catch (e) {
                alert("Error: " + e.message);
            } finally {
                btn.innerText = "GUARDAR INSPECCIÓN";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
