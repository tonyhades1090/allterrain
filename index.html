<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>One Drop</title>

    <link rel="icon" type="image/png" href="https://i.ibb.co/S76pM5N8/one-drop-icon.png">
    <link rel="apple-touch-icon" href="https://i.ibb.co/S76pM5N8/one-drop-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.min.js"></script>

    <style>
        :root { --blue: #007aff; --green: #34c759; --orange: #ff9500; --red: #ff3b30; --bg: #f2f2f7; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        
        .lang-switcher { position: absolute; top: 15px; left: 15px; display: flex; gap: 5px; z-index: 1000; }
        .lang-btn { background: white; border: 1px solid #ddd; border-radius: 5px; padding: 3px 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .lang-btn.active { background: var(--blue); color: white; border-color: var(--blue); }

        #auth-screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: 90vh; }
        #app-screen { display: none; max-width: 450px; margin: auto; padding-bottom: 40px; }

        .auth-card { background: white; padding: 30px; border-radius: 25px; width: 100%; max-width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; }
        
        .header-bar { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 15px; gap: 15px; }
        .logout-btn { color: var(--red); font-weight: 700; font-size: 13px; cursor: pointer; border: 1px solid var(--red); padding: 5px 12px; border-radius: 8px; }

        h1.main-title { color: var(--blue); font-weight: 800; margin: 0; letter-spacing: -1px; text-align: center; flex-grow: 1; }
        h2 { font-size: 14px; color: #333; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 15px; text-transform: uppercase; }
        
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 11px; color: #666; text-transform: uppercase; }
        input, textarea { width: 100%; height: 48px; padding: 12px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #d1d1d6; font-size: 16px; background: #fff; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-weight: 700; font-size: 16px; cursor: pointer; display: block; text-align: center; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-gps { background: #5856d6; color: white; margin-top: 5px; }
        .btn-sms { background: var(--green); color: white; margin-top: 15px; }
        .btn-link { background: none; color: var(--blue); font-size: 13px; padding: 5px; }
        
        .status-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .status-btn { height: 45px; border-radius: 10px; border: 1px solid #ddd; background: #f9f9f9; font-size: 9px; font-weight: 800; }
        .active-ins { background: var(--green) !important; color: white; }
        .active-pen { background: var(--orange) !important; color: white; }
        .active-no { background: var(--red) !important; color: white; }

        .savings-box { background: #e7f3ff; padding: 15px; border-radius: 15px; text-align: center; margin: 15px 0; }
        .chart-wrap { position: relative; height: 250px; width: 100%; }

        #history-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f2f2f7; z-index: 5000; overflow-y: auto; }
        .hist-card { background: white; margin: 10px; padding: 15px; border-radius: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .hist-details { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ccc; font-size: 14px; line-height: 1.6; color: #333; }
        .hist-tag { font-weight: bold; color: #666; font-size: 11px; text-transform: uppercase; }
        
        .edit-btn { background: var(--orange); color: white; border: none; padding: 5px 10px; border-radius: 5px; font-size: 11px; font-weight: bold; cursor: pointer; margin-right: 10px; }
    </style>
</head>
<body>

<div class="lang-switcher">
    <button class="lang-btn active" id="btn-en" onclick="setLanguage('en')">EN</button>
    <button class="lang-btn" id="btn-es" onclick="setLanguage('es')">ES</button>
</div>

<div id="auth-screen">
    <div class="auth-card">
        <h1>ONE DROP</h1>
        <input type="email" id="auth-email" placeholder="Email" autocomplete="off">
        <input type="password" id="auth-pass" placeholder="Password" autocomplete="off">
        <button class="btn btn-blue" id="btn-action" onclick="handleAuth()">SIGN IN</button>
        <div id="auth-options">
            <button class="btn btn-link" onclick="toggleAuth(true)">Sign Up</button>
        </div>
        <div id="signup-options" style="display:none;">
            <button class="btn btn-link" onclick="toggleAuth(false)">Sign In</button>
        </div>
    </div>
</div>

<div id="app-screen">
    <div class="header-bar">
        <h1 class="main-title">ONE DROP</h1>
        <div class="logout-btn" onclick="logout()" data-t="logout">LOGOUT</div>
    </div>

    <div class="card">
        <h2 data-t="clientInfo">👤 Client Info</h2>
        <div class="grid-2">
            <div><label data-t="fName">First Name</label><input type="text" id="c-name" autocomplete="off"></div>
            <div><label data-t="lName">Last Name</label><input type="text" id="c-lastname" autocomplete="off"></div>
        </div>
        <div class="grid-2">
            <div><label data-t="bday">Birthday</label><input type="date" id="c-birthday"></div>
            <div><label data-t="people">People</label><input type="number" id="c-people"></div>
        </div>
        <label data-t="phone">Phone</label><input type="tel" id="c-phone">
        <label data-t="address">Address</label><textarea id="c-address" style="width:100%; height:60px;"></textarea>
        <button class="btn btn-gps" onclick="goMaps()" data-t="viewMaps">🗺️ VIEW ON MAPS</button>
    </div>

    <div class="card">
        <h2 data-t="savingsTitle">💰 Yearly Savings</h2>
        <div class="grid-2">
            <div><label data-t="waterCost">Water Cost</label><input type="number" id="cost-water" oninput="calculate()"></div>
            <div><label data-t="soapCost">Soap Cost</label><input type="number" id="cost-soap" oninput="calculate()"></div>
        </div>
        <label data-t="monthlyFee">Monthly Fee ($)</label><input type="number" id="one-fee" value="180" oninput="calculate()">
        <div class="savings-box">
            <span style="font-size:26px; font-weight:800; color:var(--green);" id="net-savings">$0.00</span><br>
            <small data-t="netSavings">Net Annual Savings</small>
        </div>
        <div class="chart-wrap">
            <canvas id="savingsChart"></canvas>
        </div>
    </div>

    <div class="card">
        <h2 data-t="techReport">🧪 Tech Report</h2>
        <div class="grid-2">
            <div><label data-t="date">Date</label><input type="date" id="test-date"></div>
            <div><label>TDS (PPM)</label><input type="number" id="tds-val"></div>
        </div>
        <label data-t="chlorine">Chlorine Presence</label><input type="text" id="cloro-val">
        <div class="status-group">
            <button class="status-btn" id="st-ins" onclick="setStatus('INSTALLED')" data-t="stInstalled">INSTALLED</button>
            <button class="status-btn" id="st-pen" onclick="setStatus('PENDING')" data-t="stPending">PENDING</button>
            <button class="status-btn" id="st-no" onclick="setStatus('REJECTED')" data-t="stRejected">REJECTED</button>
        </div>
        <div class="grid-2" style="margin-top:25px;">
            <button class="btn btn-blue" onclick="saveData()" data-t="saveData">SAVE DATA</button>
            <button class="btn" style="background:#8e8e93; color:white;" onclick="abrirHistorial()" data-t="history">HISTORY</button>
        </div>
        <button class="btn btn-sms" id="sms-btn" style="display:none;" onclick="sendSMS()" data-t="sendSms">📲 SEND SMS</button>
    </div>
</div>

<div id="history-modal">
    <div style="padding:20px; background:white; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #ddd; position:sticky; top:0; z-index:100;">
        <h2 style="margin:0; border:none;" data-t="clientHistory">Client History</h2>
        <button onclick="cerrarHistorial()" style="background:var(--blue); color:white; border:none; padding:8px 15px; border-radius:8px; font-weight:bold;" data-t="done">DONE</button>
    </div>
    <div id="history-list" style="padding:10px;"></div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAK9cldIvt1JZJ-fB-1J7Z51FLxxzT3oPg", projectId: "landmaster-aquafill" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    
    db.settings({ cacheSizeBytes: firebase.firestore.CACHE_SIZE_UNLIMITED });
    db.enablePersistence().catch(function(err) { console.log("Persistence error", err); });

    let chart, currentStatus = "", isSignUp = false, currentLang = 'en';
    let temporalData = []; // Para guardar los datos del historial localmente

    const translations = {
        en: { edit: "EDIT", signIn: "SIGN IN", signUp: "SIGN UP", noAccount: "Sign Up", haveAccount: "Sign In", logout: "LOGOUT", clientInfo: "👤 Client Info", fName: "First Name", lName: "Last Name", bday: "Birthday", people: "People", phone: "Phone", address: "Address", viewMaps: "🗺️ VIEW ON MAPS", savingsTitle: "💰 Yearly Savings", waterCost: "Water Cost", soapCost: "Soap Cost", monthlyFee: "Monthly Fee ($)", netSavings: "Net Annual Savings", techReport: "🧪 Tech Report", date: "Date", chlorine: "Chlorine Presence", stInstalled: "INSTALLED", stPending: "PENDING", stRejected: "REJECTED", saveData: "SAVE DATA", history: "HISTORY", sendSms: "📲 SEND SMS", clientHistory: "Client History", done: "DONE", deleteConfirm: "Delete?", logoutConfirm: "Logout?" },
        es: { edit: "EDITAR", signIn: "ENTRAR", signUp: "REGISTRO", noAccount: "Regístrate", haveAccount: "Entrar", logout: "SALIR", clientInfo: "👤 Datos Cliente", fName: "Nombre", lName: "Apellido", bday: "Nacimiento", people: "Personas", phone: "Teléfono", address: "Dirección", viewMaps: "🗺️ VER MAPS", savingsTitle: "💰 Ahorro Anual", waterCost: "Costo Agua", soapCost: "Costo Jabón", monthlyFee: "Cuota Mensual ($)", netSavings: "Ahorro Neto Anual", techReport: "🧪 Reporte Técnico", date: "Fecha", chlorine: "Cloro", stInstalled: "INSTALADO", stPending: "PENDIENTE", stRejected: "RECHAZADO", saveData: "GUARDAR", history: "HISTORIAL", sendSms: "📲 ENVIAR SMS", clientHistory: "Historial", done: "LISTO", deleteConfirm: "¿Borrar?", logoutConfirm: "¿Salir?" }
    };

    function clearAllInputs() {
        var inputs = document.querySelectorAll('#app-screen input, #app-screen textarea');
        for(var i=0; i<inputs.length; i++) {
            if(inputs[i].id !== 'one-fee') inputs[i].value = "";
        }
        document.getElementById('net-savings').innerText = '$0.00';
        document.getElementById('sms-btn').style.display = 'none';
        setStatus('');
        if(chart) { chart.destroy(); chart = null; }
        document.getElementById('test-date').valueAsDate = new Date();
    }

    auth.onAuthStateChanged(function(user) {
        if (user) {
            clearAllInputs();
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
            setTimeout(function(){ calculate(); }, 500);
        } else {
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('app-screen').style.display = 'none';
        }
    });

    async function abrirHistorial() {
        document.getElementById('history-modal').style.display = "block";
        var list = document.getElementById('history-list');
        list.innerHTML = "<p style='text-align:center;'>Loading...</p>";
        temporalData = [];
        
        try {
            var snap = await db.collection("reportes").orderBy("timestamp", "desc").get();
            list.innerHTML = "";
            
            if(snap.empty) {
                list.innerHTML = "<p style='text-align:center;'>No records found.</p>";
                return;
            }

            snap.forEach(function(doc){
                var d = doc.data();
                d.id = doc.id;
                temporalData.push(d);
                
                var html = '<div class="hist-card" id="card-'+doc.id+'">';
                html += '<div style="display:flex; justify-content:space-between; align-items:center;">';
                html += '<div onclick="toggleDetalle(\''+doc.id+'\')" style="flex-grow:1; cursor:pointer;">';
                html += '<b style="color:var(--blue); font-size:16px;">'+(d.nombre || '')+' '+(d.apellido || '')+'</b><br>';
                html += '<small>'+(d.fecha || '')+' | <b>'+(d.estado || '')+'</b> ▼</small></div>';
                html += '<div style="display:flex; align-items:center;">';
                html += '<button class="edit-btn" onclick="editarRegistro(\''+doc.id+'\')">'+translations[currentLang].edit+'</button>';
                html += '<button style="border:none; color:red; background:none; font-size:22px;" onclick="borrarRegistro(\''+doc.id+'\')">✕</button></div></div>';
                html += '<div class="hist-details" id="det-'+doc.id+'">';
                html += '<div class="hist-tag">Phone:</div> '+(d.tel || 'N/A')+'<br>';
                html += '<div class="hist-tag">Address:</div> '+(d.dir || 'N/A')+'<br>';
                html += '<div class="hist-tag">Birthday:</div> '+(d.bday || 'N/A')+'<br>';
                html += '<div class="hist-tag">People:</div> '+(d.people || '0')+'<br>';
                html += '<div class="hist-tag">TDS:</div> '+(d.tds || '0')+' PPM<br>';
                html += '<div class="hist-tag">Yearly Savings:</div> <b style="color:var(--green)">'+(d.ahorro || '$0')+'</b>';
                html += '</div></div>';
                list.innerHTML += html;
            });
        } catch(e) {
            list.innerHTML = "<p style='color:red;'>Error loading history: " + e.message + "</p>";
        }
    }

    function editarRegistro(id) {
        const item = temporalData.find(d => d.id === id);
        if(!item) return;

        // Rellenar campos
        document.getElementById('c-name').value = item.nombre || "";
        document.getElementById('c-lastname').value = item.apellido || "";
        document.getElementById('c-phone').value = item.tel || "";
        document.getElementById('c-address').value = item.dir || "";
        document.getElementById('c-birthday').value = item.bday || "";
        document.getElementById('c-people').value = item.people || "";
        document.getElementById('tds-val').value = item.tds || "";
        document.getElementById('test-date').value = item.fecha || "";
        document.getElementById('cloro-val').value = item.cloro || "";
        document.getElementById('cost-water').value = item.costoAgua || "";
        document.getElementById('cost-soap').value = item.costoJabon || "";
        
        setStatus(item.estado || "");
        calculate();
        cerrarHistorial();
        
        // Scroll al inicio para ver los datos cargados
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function calculate() {
        var w = (parseFloat(document.getElementById('cost-water').value) || 0) * 12;
        var s = (parseFloat(document.getElementById('cost-soap').value) || 0) * 12;
        var f = (parseFloat(document.getElementById('one-fee').value) || 0) * 12;
        var net = (w + s) - f;
        document.getElementById('net-savings').innerText = '$' + net.toLocaleString();
        var ctx = document.getElementById('savingsChart').getContext('2d');
        if(chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: currentLang === 'es' ? ['Costo Actual', 'One Drop'] : ['Current Cost', 'One Drop'],
                datasets: [{ data: [w + s, f], backgroundColor: ['#ff3b30', '#007aff'] }]
            },
            options: { responsive: true, maintainAspectRatio: false, legend: { display: false }, scales: { yAxes: [{ ticks: { beginAtZero: true } }] } }
        });
    }

    function setStatus(v) {
        currentStatus = v;
        document.querySelectorAll('.status-btn').forEach(function(b){ b.classList.remove('active-ins', 'active-pen', 'active-no'); });
        if(v === 'INSTALLED') document.getElementById('st-ins').classList.add('active-ins');
        if(v === 'PENDING') document.getElementById('st-pen').classList.add('active-pen');
        if(v === 'REJECTED') document.getElementById('st-no').classList.add('active-no');
    }

    function toggleAuth(signup) {
        isSignUp = signup;
        document.getElementById('btn-action').innerText = signup ? "SIGN UP" : "SIGN IN";
        document.getElementById('auth-options').style.display = signup ? "none" : "block";
        document.getElementById('signup-options').style.display = signup ? "block" : "none";
    }

    function handleAuth() {
        var email = document.getElementById('auth-email').value;
        var pass = document.getElementById('auth-pass').value;
        if(isSignUp) auth.createUserWithEmailAndPassword(email, pass).catch(function(e){ alert(e.message); });
        else auth.signInWithEmailAndPassword(email, pass).catch(function(e){ alert(e.message); });
    }

    function logout() { if(confirm(translations[currentLang].logoutConfirm)) { auth.signOut(); clearAllInputs(); } }

    async function saveData() {
        if(!currentStatus) return alert("Select status");
        await db.collection("reportes").add({
            nombre: document.getElementById('c-name').value, 
            apellido: document.getElementById('c-lastname').value,
            tel: document.getElementById('c-phone').value, 
            dir: document.getElementById('c-address').value,
            bday: document.getElementById('c-birthday').value,
            people: document.getElementById('c-people').value,
            tds: document.getElementById('tds-val').value,
            cloro: document.getElementById('cloro-val').value,
            costoAgua: document.getElementById('cost-water').value,
            costoJabon: document.getElementById('cost-soap').value,
            ahorro: document.getElementById('net-savings').innerText,
            estado: currentStatus, 
            fecha: document.getElementById('test-date').value,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert("Saved!");
        document.getElementById('sms-btn').style.display = "block";
    }

    function toggleDetalle(id) { 
        var el = document.getElementById('det-' + id); 
        el.style.display = (el.style.display === 'block') ? 'none' : 'block'; 
    }
    
    async function borrarRegistro(id) { 
        if(confirm(translations[currentLang].deleteConfirm)) { 
            await db.collection("reportes").doc(id).delete(); 
            var el = document.getElementById('card-'+id);
            if(el) el.remove(); 
        } 
    }
    
    function cerrarHistorial() { document.getElementById('history-modal').style.display = "none"; }
    function goMaps() { var addr = document.getElementById('c-address').value; if(addr) window.open('https://maps.google.com/?q=' + encodeURIComponent(addr)); }
    function sendSMS() { var p = document.getElementById('c-phone').value; var m = "ONE DROP: Savings " + document.getElementById('net-savings').innerText; window.location.href = 'sms:' + p + '&body=' + encodeURIComponent(m); }
    function setLanguage(l) { 
        currentLang = l; 
        document.getElementById('btn-en').classList.toggle('active', l==='en');
        document.getElementById('btn-es').classList.toggle('active', l==='es');
        document.querySelectorAll('[data-t]').forEach(el => {
            const key = el.getAttribute('data-t');
            if(translations[l][key]) el.innerText = translations[l][key];
        });
    }
</script>
</body>
</html>
