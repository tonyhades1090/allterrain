<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqua Fill Pro: SMS Sender</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --blue: #007aff; --green: #34c759; --orange: #ff9500; --bg: #f2f2f7; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; padding-bottom: 50px; }
        .container { max-width: 480px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1 { color: var(--blue); text-align: center; font-size: 24px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 13px; color: #48484a; }
        input, select, textarea { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #d1d1d6; font-size: 16px; box-sizing: border-box; }
        
        .btn { width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: 700; font-size: 16px; cursor: pointer; margin-bottom: 10px; }
        .btn-sms { background: var(--green); color: white; }
        .btn-main { background: var(--blue); color: white; }
        .btn-form { background: var(--orange); color: white; text-decoration: none; display: block; text-align: center; }
        
        #photo-preview { width: 100%; border-radius: 12px; display: none; margin: 15px 0; border: 3px solid var(--blue); }
        .savings-box { background: #e7f3ff; padding: 15px; border-radius: 15px; text-align: center; margin: 15px 0; }
        .val-highlight { font-size: 26px; font-weight: 800; color: var(--green); display: block; }
    </style>
</head>
<body>

<div class="container">
    <h1>AQUA FILL PRO</h1>

    <a href="https://www.cognitoforms.com/AquafeelSolutions/" target="_blank" class="btn btn-form">📝 ABRIR FORMULARIO AQUAFILL</a>

    <div class="card">
        <h2>Ahorro Estimado</h2>
        <label>Gasto Agua ($)</label>
        <input type="number" id="cost-water" placeholder="Ej: 80" oninput="calculate()">
        <label>Gasto Jabón ($)</label>
        <input type="number" id="cost-soap" placeholder="Ej: 40" oninput="calculate()">
        <label>Cuota Aqua Fill ($)</label>
        <input type="number" id="aqua-fee" value="180" oninput="calculate()">
        
        <div class="savings-box">
            <span style="font-size: 12px;">AHORRO NETO ANUAL:</span>
            <span class="val-highlight" id="net-savings">$0.00</span>
        </div>
        <canvas id="savingsChart"></canvas>
    </div>

    <div class="card">
        <h2>Reporte Técnico</h2>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <input type="number" id="tds-val" placeholder="TDS">
            <input type="number" id="chlorine-val" placeholder="Cloro">
        </div>
        
        <button class="btn" style="background:#555; color:white;" onclick="document.getElementById('camera-input').click()">📷 TOMAR FOTO DEL TEST</button>
        <input type="file" id="camera-input" accept="image/*" capture="camera" style="display:none" onchange="previewPhoto(this)">
        <img id="photo-preview" src="">

        <label>Número de Teléfono del Cliente</label>
        <input type="tel" id="c-phone" placeholder="Ej: 8041234567">
        
        <button class="btn btn-sms" onclick="sendSMS()">📲 ENVIAR REPORTE AL CELULAR</button>
    </div>

    <div class="card">
        <input type="text" id="c-name" placeholder="Nombre del Cliente">
        <textarea id="c-address" placeholder="Dirección"></textarea>
        <button class="btn btn-main" onclick="saveToCloud()">💾 GUARDAR EXPEDIENTE</button>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAK9cldIvt1JZJ-fB-1J7Z51FLxxzT3oPg", projectId: "landmaster-aquafill" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let chart;

    function calculate() {
        const water = parseFloat(document.getElementById('cost-water').value) || 0;
        const soap = parseFloat(document.getElementById('cost-soap').value) || 0;
        const fee = parseFloat(document.getElementById('aqua-fee').value) || 0;
        const net = ((water + soap) * 12) - (fee * 12);
        document.getElementById('net-savings').innerText = `$${net.toLocaleString()}`;
        updateChart((water+soap)*12, fee*12);
    }

    function updateChart(curr, aqua) {
        const ctx = document.getElementById('savingsChart').getContext('2d');
        if(chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'bar',
            data: { labels: ['Gasto Actual', 'Aqua Fill'], datasets: [{ data: [curr, aqua], backgroundColor: ['#ff3b30', '#007aff'] }] },
            options: { plugins: { legend: { display: false } } }
        });
    }

    function previewPhoto(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => { document.getElementById('photo-preview').src = e.target.result; document.getElementById('photo-preview').style.display = 'block'; };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function sendSMS() {
        const phone = document.getElementById('c-phone').value;
        const tds = document.getElementById('tds-val').value;
        const savings = document.getElementById('net-savings').innerText;
        
        if(!phone) { alert("Ponga el número del cliente"); return; }

        // Texto del mensaje
        const message = `AQUA FILL REPORT: TDS: ${tds} PPM. Ahorro estimado: ${savings} anuales. ¡Gracias por recibirnos!`;
        
        // Protocolo SMS: Esto abre la app de mensajes de texto del celular
        window.location.href = `sms:${phone}?body=${encodeURIComponent(message)}`;
    }

    async function saveToCloud() {
        const data = {
            nombre: document.getElementById('c-name').value,
            tel: document.getElementById('c-phone').value,
            ahorro: document.getElementById('net-savings').innerText,
            fecha: new Date().toISOString()
        };
        await db.collection("ventas_sms").add(data);
        alert("✅ Guardado");
        location.reload();
    }
</script>
</body>
</html>
