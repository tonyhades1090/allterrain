<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>One Drop Pro</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/S76pM5N8/one-drop-icon.png">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.min.js"></script>

    <style>
        :root { --blue: #007aff; --green: #34c759; --orange: #ff9500; --red: #ff3b30; --bg: #f2f2f7; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; }
        #app-screen { display: none; max-width: 450px; margin: auto; padding-bottom: 40px; }
        .auth-card { background: white; padding: 30px; border-radius: 25px; width: 100%; max-width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; }
        input { width: 100%; height: 48px; padding: 12px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #d1d1d6; font-size: 16px; }
        .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-weight: 700; font-size: 16px; cursor: pointer; display: block; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-link { background: none; color: var(--blue); font-size: 13px; margin-top: 15px; }
        .photo-item { position: relative; width: 70px; height: 70px; display: inline-block; margin: 5px; }
        .preview-img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
        .del-photo { position: absolute; top: -5px; right: -5px; background: var(--red); color: white; border-radius: 50%; width: 20px; height: 20px; border: none; font-size: 12px; cursor: pointer; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .status-btn { height: 45px; border-radius: 10px; border: 1px solid #ddd; font-size: 10px; font-weight: bold; }
        .active-ins { background: var(--green) !important; color: white; }
        .active-pen { background: var(--orange) !important; color: white; }
        .active-no { background: var(--red) !important; color: white; }
        #history-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f2f2f7; z-index: 5000; overflow-y: auto; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-card">
        <h1 style="color:var(--blue)">ONE DROP</h1>
        <p id="auth-instruction">Sign in to your account</p>
        <input type="email" id="auth-email" placeholder="Email">
        <input type="password" id="auth-pass" placeholder="Password (min. 6 chars)">
        <button class="btn btn-blue" id="btn-auth-action" onclick="handleAuth()">SIGN IN</button>
        <button class="btn btn-link" id="btn-toggle-mode" onclick="toggleAuthMode()">No account? Sign Up</button>
    </div>
</div>

<div id="app-screen">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="margin:0; color:var(--blue)">ONE DROP PRO</h2>
        <button onclick="logout()" style="color:red; background:none; border:none; font-weight:bold;">LOGOUT</button>
    </div>

    <div class="card">
        <h3>Client Info</h3>
        <input type="text" id="c-name" placeholder="First Name">
        <input type="text" id="c-lastname" placeholder="Last Name">
        <input type="tel" id="c-phone" placeholder="Phone">
        <input type="text" id="c-address" placeholder="Address">
        <div class="grid-2">
            <input type="text" id="c-city" placeholder="City">
            <input type="text" id="c-state" placeholder="ST">
        </div>
        <button class="btn btn-blue" onclick="document.getElementById('photo-input').click()">📸 ADD PHOTOS</button>
        <input type="file" id="photo-input" accept="image/*" multiple style="display:none" onchange="handlePhotos(this)">
        <div id="photo-preview" style="margin-top:10px;"></div>
    </div>

    <div class="card">
        <h3>Tech Report & Status</h3>
        <div class="grid-2">
            <input type="number" id="tds-val" placeholder="TDS">
            <input type="text" id="cloro-val" placeholder="Chlorine">
        </div>
        <div class="grid-2">
            <button class="status-btn" id="st-ins" onclick="setStatus('INSTALLED')">INSTALLED</button>
            <button class="status-btn" id="st-pen" onclick="setStatus('PENDING')">PENDING</button>
            <button class="status-btn" id="st-no" onclick="setStatus('REJECTED')">REJECTED</button>
        </div>
        <button class="btn btn-blue" style="margin-top:20px;" onclick="saveData()">SAVE REPORT</button>
        <button class="btn" style="background:#8e8e93; color:white; margin-top:10px;" onclick="abrirHistorial()">VIEW HISTORY</button>
    </div>
</div>

<div id="history-modal">
    <div style="padding:20px; background:white; display:flex; justify-content:space-between; border-bottom:1px solid #ddd;">
        <h2 style="margin:0;">History</h2>
        <button onclick="cerrarHistorial()" style="background:var(--blue); color:white; border:none; padding:10px; border-radius:8px;">DONE</button>
    </div>
    <div id="history-list" style="padding:10px;"></div>
</div>

<script>
    // CONFIGURACIÓN FIREBASE
    const firebaseConfig = { apiKey: "AIzaSyAK9cldIvt1JZJ-fB-1J7Z51FLxxzT3oPg", projectId: "landmaster-aquafill" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let isSignUp = false;
    let currentStatus = "";
    let savedPhotos = [];

    // --- LÓGICA DE LOGIN / REGISTRO CORREGIDA ---
    function toggleAuthMode() {
        isSignUp = !isSignUp;
        const btnMain = document.getElementById('btn-auth-action');
        const btnToggle = document.getElementById('btn-toggle-mode');
        const instruction = document.getElementById('auth-instruction');

        if (isSignUp) {
            btnMain.innerText = "SIGN UP";
            btnToggle.innerText = "Have an account? Sign In";
            instruction.innerText = "Create your new account";
        } else {
            btnMain.innerText = "SIGN IN";
            btnToggle.innerText = "No account? Sign Up";
            instruction.innerText = "Sign in to your account";
        }
    }

    function handleAuth() {
        const email = document.getElementById('auth-email').value;
        const pass = document.getElementById('auth-pass').value;

        if (!email || !pass) {
            alert("Please enter email and password");
            return;
        }

        if (isSignUp) {
            // Acción de Registrarse
            auth.createUserWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    alert("Account created successfully!");
                })
                .catch((error) => {
                    alert("Error: " + error.message);
                });
        } else {
            // Acción de Entrar
            auth.signInWithEmailAndPassword(email, pass)
                .catch((error) => {
                    alert("Error: " + error.message);
                });
        }
    }

    // --- CONTROL DE SESIÓN ---
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
        } else {
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('app-screen').style.display = 'none';
        }
    });

    function logout() {
        if(confirm("Logout?")) auth.signOut();
    }

    // --- MANEJO DE FOTOS ---
    function handlePhotos(input) {
        Array.from(input.files).forEach(file => {
            const reader = new FileReader();
            reader.onload = e => {
                savedPhotos.push(e.target.result);
                renderPhotos();
            };
            reader.readAsDataURL(file);
        });
    }

    function renderPhotos() {
        const preview = document.getElementById('photo-preview');
        preview.innerHTML = "";
        savedPhotos.forEach((src, idx) => {
            preview.innerHTML += `
                <div class="photo-item">
                    <img src="${src}" class="preview-img">
                    <button class="del-photo" onclick="removePhoto(${idx})">✕</button>
                </div>`;
        });
    }

    function removePhoto(idx) {
        savedPhotos.splice(idx, 1);
        renderPhotos();
    }

    // --- GUARDAR Y ESTADOS ---
    function setStatus(s) {
        currentStatus = s;
        document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active-ins', 'active-pen', 'active-no'));
        if(s==='INSTALLED') document.getElementById('st-ins').classList.add('active-ins');
        if(s==='PENDING') document.getElementById('st-pen').classList.add('active-pen');
        if(s==='REJECTED') document.getElementById('st-no').classList.add('active-no');
    }

    async function saveData() {
        if(!currentStatus) return alert("Select a status");
        const data = {
            nombre: document.getElementById('c-name').value,
            apellido: document.getElementById('c-lastname').value,
            tel: document.getElementById('c-phone').value,
            dir: document.getElementById('c-address').value,
            fotos: savedPhotos,
            estado: currentStatus,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };
        await db.collection("reportes").add(data);
        alert("Report Saved!");
        location.reload(); 
    }

    // --- HISTORIAL ---
    async function abrirHistorial() {
        document.getElementById('history-modal').style.display = 'block';
        const list = document.getElementById('history-list');
        list.innerHTML = "Loading...";
        const snap = await db.collection("reportes").orderBy("timestamp", "desc").get();
        list.innerHTML = "";
        snap.forEach(doc => {
            const d = doc.data();
            list.innerHTML += `
                <div class="card">
                    <b>${d.nombre} ${d.apellido}</b> - ${d.estado}<br>
                    <small>${d.dir}</small>
                </div>`;
        });
    }

    function cerrarHistorial() {
        document.getElementById('history-modal').style.display = 'none';
    }
</script>

</body>
</html>
