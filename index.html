<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>One Drop Pro</title>

    <link rel="icon" type="image/png" href="https://i.ibb.co/S76pM5N8/one-drop-icon.png">
    <link rel="apple-touch-icon" href="https://i.ibb.co/S76pM5N8/one-drop-icon.png">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.min.js"></script>

    <style>
        :root { --blue: #007aff; --green: #34c759; --orange: #ff9500; --red: #ff3b30; --bg: #f2f2f7; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        
        .lang-switcher { position: absolute; top: 15px; left: 15px; display: flex; gap: 5px; z-index: 1000; }
        .lang-btn { background: white; border: 1px solid #ddd; border-radius: 5px; padding: 3px 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .lang-btn.active { background: var(--blue); color: white; border-color: var(--blue); }

        #auth-screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: 90vh; }
        #app-screen { display: none; max-width: 450px; margin: auto; padding-bottom: 40px; }

        .auth-card { background: white; padding: 30px; border-radius: 25px; width: 100%; max-width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; }
        
        .header-bar { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 15px; gap: 15px; }
        .logout-btn { color: var(--red); font-weight: 700; font-size: 13px; cursor: pointer; border: 1px solid var(--red); padding: 5px 12px; border-radius: 8px; }

        h1.main-title { color: var(--blue); font-weight: 800; margin: 0; letter-spacing: -1px; text-align: center; flex-grow: 1; }
        h2 { font-size: 14px; color: #333; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 15px; text-transform: uppercase; }
        
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 11px; color: #666; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #d1d1d6; font-size: 16px; background: #fff; font-family: inherit; }
        input, select { height: 48px; }
        textarea { height: 80px; resize: none; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid-3 { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 10px; }
        .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-weight: 700; font-size: 16px; cursor: pointer; display: block; text-align: center; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-gps { background: #5856d6; color: white; margin-top: 5px; }
        .btn-gallery { background: #64d2ff; color: #000; margin-top: 10px; font-size: 14px; padding: 10px; }
        .btn-link { background: none; color: var(--blue); font-size: 13px; margin-top: 10px; }
        
        #photo-preview { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .photo-item { position: relative; width: 70px; height: 70px; }
        .preview-img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
        .del-photo { position: absolute; top: -5px; right: -5px; background: var(--red); color: white; border-radius: 50%; width: 20px; height: 20px; border: none; font-size: 12px; font-weight: bold; cursor: pointer; }

        .status-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .status-btn { height: 45px; border-radius: 10px; border: 1px solid #ddd; background: #f9f9f9; font-size: 9px; font-weight: 800; }
        .active-ins { background: var(--green) !important; color: white; }
        .active-pen { background: var(--orange) !important; color: white; }
        .active-no { background: var(--red) !important; color: white; }

        .savings-box { background: #e7f3ff; padding: 15px; border-radius: 15px; text-align: center; margin: 15px 0; }
        .chart-wrap { position: relative; height: 250px; width: 100%; }

        #history-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f2f2f7; z-index: 5000; overflow-y: auto; }
        .filter-bar { display: flex; gap: 5px; padding: 10px; background: white; position: sticky; top: 70px; z-index: 99; border-bottom: 1px solid #eee; overflow-x: auto; }
        .filter-chip { padding: 6px 12px; border-radius: 20px; border: 1px solid #ddd; background: #f9f9f9; font-size: 10px; font-weight: 800; white-space: nowrap; }
        .filter-chip.active { background: var(--blue); color: white; border-color: var(--blue); }

        .hist-card { background: white; margin: 10px; padding: 15px; border-radius: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .hist-details { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ccc; font-size: 14px; line-height: 1.6; color: #333; }
        .edit-btn { background: var(--orange); color: white; border: none; padding: 5px 10px; border-radius: 5px; font-size: 11px; font-weight: bold; cursor: pointer; margin-right: 10px; }
    </style>
</head>
<body>

<div class="lang-switcher">
    <button class="lang-btn active" id="btn-en" onclick="setLanguage('en')">EN</button>
    <button class="lang-btn" id="btn-es" onclick="setLanguage('es')">ES</button>
</div>

<div id="auth-screen">
    <div class="auth-card">
        <h1>ONE DROP</h1>
        <p id="auth-msg" style="font-size: 12px; color: #666; margin-bottom: 10px;">Please Sign In</p>
        <input type="email" id="auth-email" placeholder="Email">
        <input type="password" id="auth-pass" placeholder="Password">
        <button class="btn btn-blue" id="btn-main-auth" onclick="handleAuth()" data-t="loginBtn">SIGN IN</button>
        <button class="btn btn-link" onclick="toggleAuthMode()" id="toggle-auth-btn" data-t="noAccount">No account? Sign Up</button>
        <button class="btn btn-link" onclick="forgotPassword()" data-t="forgotPass" style="font-size:11px; opacity:0.7;">Forgot Password?</button>
    </div>
</div>

<div id="app-screen">
    <div class="header-bar">
        <h1 class="main-title">ONE DROP</h1>
        <div class="logout-btn" onclick="logout()" data-t="logout">LOGOUT</div>
    </div>

    <div class="card">
        <h2 data-t="clientInfo">👤 Client Info</h2>
        <div class="grid-2">
            <div><label data-t="fName">First Name</label><input type="text" id="c-name"></div>
            <div><label data-t="lName">Last Name</label><input type="text" id="c-lastname"></div>
        </div>
        <div class="grid-2">
            <div><label data-t="bday">Birthday</label><input type="date" id="c-birthday"></div>
            <div><label data-t="people">People</label><input type="number" id="c-people"></div>
        </div>
        <label data-t="phone">Phone</label><input type="tel" id="c-phone">
        <label data-t="address">Address</label><input type="text" id="c-address" placeholder="123 Street Name">
        <div class="grid-3">
            <div><label data-t="city">City/County</label><input type="text" id="c-city"></div>
            <div><label data-t="state">State</label><input type="text" id="c-state" maxlength="2"></div>
            <div><label data-t="zip">Zip</label><input type="number" id="c-zip"></div>
        </div>
        
        <label data-t="notes">📝 Notes</label>
        <textarea id="c-notes" placeholder="Additional details..."></textarea>

        <button class="btn btn-gps" onclick="goMaps()" data-t="viewMaps">🗺️ VIEW ON MAPS</button>
        <label style="margin-top:15px;" data-t="photos">📸 Photos</label>
        <input type="file" id="photo-input" accept="image/*" multiple style="display:none;" onchange="handlePhotos(this)">
        <button class="btn btn-gallery" onclick="document.getElementById('photo-input').click()" data-t="galleryBtn">📁 OPEN GALLERY</button>
        <div id="photo-preview"></div>
    </div>

    <div class="card">
        <h2 data-t="savingsTitle">📊 Savings Analysis</h2>
        <div class="grid-2">
            <div><label data-t="waterCost">Water/Mo</label><input type="number" id="cost-water" oninput="calculate()"></div>
            <div><label data-t="soapCost">Soap/Mo</label><input type="number" id="cost-soap" oninput="calculate()"></div>
        </div>
        <div class="grid-2">
            <div><label data-t="monthlyFee">Fee ($)</label><input type="number" id="one-fee" value="180" oninput="calculate()"></div>
            <div>
                <label data-t="projection">Years</label>
                <select id="proj-years" onchange="calculate()">
                    <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                    <option value="4">4</option><option value="5" selected>5</option><option value="6">6</option>
                    <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                    <option value="10">10</option>
                </select>
            </div>
        </div>
        <div class="savings-box">
            <span style="font-size:26px; font-weight:800; color:var(--green);" id="net-savings">$0.00</span><br>
            <small id="savings-label" data-t="netSavings">Net Savings</small>
        </div>
        <div class="chart-wrap"><canvas id="savingsChart"></canvas></div>
    </div>

    <div class="card">
        <h2 data-t="techReport">🧪 Tech Report</h2>
        <div class="grid-2">
            <div><label data-t="date">Date</label><input type="date" id="test-date"></div>
            <div><label>TDS (PPM)</label><input type="number" id="tds-val"></div>
        </div>
        <label data-t="chlorine">Chlorine</label><input type="text" id="cloro-val">
        <div class="status-group">
            <button class="status-btn" id="st-ins" onclick="setStatus('INSTALLED')" data-t="stInstalled">INSTALLED</button>
            <button class="status-btn" id="st-pen" onclick="setStatus('PENDING')" data-t="stPending">PENDING</button>
            <button class="status-btn" id="st-no" onclick="setStatus('REJECTED')" data-t="stRejected">REJECTED</button>
        </div>
        <div class="grid-2" style="margin-top:25px;">
            <button class="btn btn-blue" onclick="saveData()" data-t="saveData">SAVE DATA</button>
            <button class="btn" style="background:#8e8e93; color:white;" onclick="abrirHistorial()" data-t="history">HISTORY</button>
        </div>
        <button class="btn btn-sms" id="sms-btn" style="display:none;" onclick="sendSMS()" data-t="sendSms">📲 ENVIAR SMS</button>
    </div>
</div>

<div id="history-modal">
    <div style="padding:20px; background:white; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #ddd; position:sticky; top:0; z-index:100;">
        <h2 style="margin:0; border:none;" data-t="clientHistory">History</h2>
        <button onclick="cerrarHistorial()" style="background:var(--blue); color:white; border:none; padding:8px 15px; border-radius:8px; font-weight:bold;" data-t="done">DONE</button>
    </div>
    <div class="filter-bar">
        <button class="filter-chip active" id="fh-all" onclick="filtrarHistorial('ALL')">ALL</button>
        <button class="filter-chip" id="fh-ins" onclick="filtrarHistorial('INSTALLED')">INSTALLED</button>
        <button class="filter-chip" id="fh-pen" onclick="filtrarHistorial('PENDING')">PENDING</button>
        <button class="filter-chip" id="fh-rej" onclick="filtrarHistorial('REJECTED')">REJECTED</button>
    </div>
    <div id="history-list" style="padding:10px;"></div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAK9cldIvt1JZJ-fB-1J7Z51FLxxzT3oPg", projectId: "landmaster-aquafill" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    
    let chart, currentStatus = "", currentLang = 'en', isSignUp = false, savedPhotos = [];
    let temporalData = []; 

    const translations = {
        en: { loginBtn: "SIGN IN", signUpBtn: "SIGN UP", noAccount: "No account? Sign Up", hasAccount: "Have account? Sign In", forgotPass: "Forgot Password?", resetSent: "Email sent!", edit: "EDIT", logout: "LOGOUT", clientInfo: "Client Info", fName: "First Name", lName: "Last Name", bday: "Birthday", people: "People", phone: "Phone", address: "Address", city: "City/County", state: "ST", zip: "Zip", viewMaps: "🗺️ VIEW ON MAPS", photos: "Photos", galleryBtn: "📁 OPEN GALLERY", savingsTitle: "Savings Analysis", waterCost: "Water/Mo", soapCost: "Soap/Mo", monthlyFee: "Fee ($)", projection: "Years", netSavings: "Net Savings", techReport: "Tech Report", date: "Date", chlorine: "Chlorine", stInstalled: "INSTALLED", stPending: "PENDING", stRejected: "REJECTED", saveData: "SAVE DATA", history: "HISTORY", sendSms: "📲 SEND SMS", clientHistory: "History", done: "DONE", logoutConfirm: "Logout?", notes: "Notes" },
        es: { loginBtn: "INGRESAR", signUpBtn: "REGISTRARSE", noAccount: "¿No tienes cuenta? Regístrate", hasAccount: "¿Ya tienes cuenta? Ingresa", forgotPass: "¿Olvidaste la clave?", resetSent: "¡Correo enviado!", edit: "EDITAR", logout: "SALIR", clientInfo: "Datos Cliente", fName: "Nombre", lName: "Apellido", bday: "Nacimiento", people: "Personas", phone: "Teléfono", address: "Dirección", city: "Ciudad/Condado", state: "Est.", zip: "Zip", viewMaps: "🗺️ VER MAPS", photos: "Fotos", galleryBtn: "📁 ABRIR GALERÍA", savingsTitle: "Análisis Ahorro", waterCost: "Agua/Mes", soapCost: "Jabón/Mes", monthlyFee: "Cuota ($)", projection: "Años", netSavings: "Ahorro Neto", techReport: "Reporte Técnico", date: "Fecha", chlorine: "Cloro", stInstalled: "INSTALADO", stPending: "PENDIENTE", stRejected: "RECHAZADO", saveData: "GUARDAR", history: "HISTORIAL", sendSms: "📲 ENVIAR SMS", clientHistory: "Historial", done: "LISTO", logoutConfirm: "¿Salir?", notes: "Notas" }
    };

    function setLanguage(l) { 
        currentLang = l;
        document.getElementById('btn-en').classList.toggle('active', l==='en');
        document.getElementById('btn-es').classList.toggle('active', l==='es');
        document.querySelectorAll('[data-t]').forEach(el => {
            const k = el.getAttribute('data-t');
            if(translations[l][k]) el.innerText = translations[l][k];
        });
        updateAuthLabels(); calculate();
    }

    function toggleAuthMode() { 
        isSignUp = !isSignUp; 
        updateAuthLabels(); 
        document.getElementById('auth-msg').innerText = isSignUp ? (currentLang === 'es' ? "Crea tu cuenta" : "Create Account") : (currentLang === 'es' ? "Ingresa" : "Sign In");
    }

    function updateAuthLabels() {
        const btn = document.getElementById('btn-main-auth');
        const toggle = document.getElementById('toggle-auth-btn');
        btn.innerText = isSignUp ? translations[currentLang].signUpBtn : translations[currentLang].loginBtn;
        toggle.innerText = isSignUp ? translations[currentLang].hasAccount : translations[currentLang].noAccount;
    }

    function handleAuth() {
        const email = document.getElementById('auth-email').value;
        const pass = document.getElementById('auth-pass').value;
        if(!email || !pass) return alert("Fill all fields");
        if(isSignUp) {
            auth.createUserWithEmailAndPassword(email, pass).catch(e => alert("Error: " + e.message));
        } else {
            auth.signInWithEmailAndPassword(email, pass).catch(e => alert("Error: " + e.message));
        }
    }

    function forgotPassword() {
        const email = document.getElementById('auth-email').value;
        if(!email) return alert("Enter email");
        auth.sendPasswordResetEmail(email).then(() => alert(translations[currentLang].resetSent));
    }

    function handlePhotos(input) {
        Array.from(input.files).forEach(file => {
            const reader = new FileReader();
            reader.onload = e => {
                savedPhotos.push(e.target.result);
                renderPhotoPreview();
            };
            reader.readAsDataURL(file);
        });
        input.value = "";
    }

    function renderPhotoPreview() {
        const preview = document.getElementById('photo-preview');
        preview.innerHTML = "";
        savedPhotos.forEach((src, index) => {
            const div = document.createElement('div');
            div.className = 'photo-item';
            div.innerHTML = `<img src="${src}" class="preview-img"><button class="del-photo" onclick="removePhoto(${index})">✕</button>`;
            preview.appendChild(div);
        });
    }

    function removePhoto(index) {
        savedPhotos.splice(index, 1);
        renderPhotoPreview();
    }

    function calculate() {
        const years = parseInt(document.getElementById('proj-years').value) || 1;
        const totalMonths = years * 12;
        const w = (parseFloat(document.getElementById('cost-water').value) || 0) * totalMonths;
        const s = (parseFloat(document.getElementById('cost-soap').value) || 0) * totalMonths;
        const f = (parseFloat(document.getElementById('one-fee').value) || 0) * totalMonths;
        const net = (w + s) - f;
        document.getElementById('net-savings').innerText = '$' + net.toLocaleString(undefined, {minimumFractionDigits: 2});
        var ctx = document.getElementById('savingsChart').getContext('2d');
        if(chart) chart.destroy();
        chart = new Chart(ctx, { type: 'bar', data: { labels: currentLang === 'es' ? ['Actual', 'One Drop'] : ['Current', 'One Drop'], datasets: [{ data: [w + s, f], backgroundColor: ['#ff3b30', '#007aff'] }] }, options: { responsive: true, maintainAspectRatio: false, legend: { display: false } } });
    }

    auth.onAuthStateChanged(user => {
        if (user) { 
            document.getElementById('auth-screen').style.display = 'none'; 
            document.getElementById('app-screen').style.display = 'block';
            document.getElementById('test-date').valueAsDate = new Date();
        } else { 
            document.getElementById('auth-screen').style.display = 'flex'; 
            document.getElementById('app-screen').style.display = 'none'; 
        }
    });

    async function saveData() {
        if(!currentStatus) return alert(currentLang === 'es' ? "Selecciona un estado" : "Select status");
        
        const btnSave = document.querySelector('[data-t="saveData"]');
        const originalText = btnSave.innerText;
        btnSave.innerText = "...";
        btnSave.disabled = true;

        try {
            await db.collection("reportes").add({
                nombre: document.getElementById('c-name').value, 
                apellido: document.getElementById('c-lastname').value,
                tel: document.getElementById('c-phone').value, 
                dir: document.getElementById('c-address').value,
                city: document.getElementById('c-city').value, 
                state: document.getElementById('c-state').value,
                zip: document.getElementById('c-zip').value, 
                bday: document.getElementById('c-birthday').value,
                people: document.getElementById('c-people').value, 
                notas: document.getElementById('c-notes').value,
                costoAgua: document.getElementById('cost-water').value,
                costoJabon: document.getElementById('cost-soap').value, 
                ahorro: document.getElementById('net-savings').innerText,
                fotos: savedPhotos, 
                estado: currentStatus, 
                fecha: document.getElementById('test-date').value,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            alert(currentLang === 'es' ? "¡Datos guardados con éxito!" : "Saved successfully!");
            
            // Limpiar formulario y resetear estado
            document.querySelectorAll('#app-screen input').forEach(i => i.value = "");
            document.getElementById('c-notes').value = "";
            savedPhotos = [];
            renderPhotoPreview();
            setStatus("");
            document.getElementById('test-date').valueAsDate = new Date();
            document.getElementById('sms-btn').style.display = "block";
            
        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            btnSave.innerText = originalText;
            btnSave.disabled = false;
        }
    }

    async function filtrarHistorial(filtro) {
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        const chipId = 'fh-' + filtro.toLowerCase().substring(0,3);
        if(document.getElementById(chipId)) document.getElementById(chipId).classList.add('active');
        
        var list = document.getElementById('history-list'); 
        list.innerHTML = "<p style='text-align:center;'>Loading...</p>"; 
        temporalData = [];

        try {
            let q = db.collection("reportes").orderBy("timestamp", "desc");
            if(filtro !== 'ALL') q = q.where("estado", "==", filtro);
            
            const snap = await q.get();
            list.innerHTML = "";
            
            if (snap.empty) {
                list.innerHTML = "<p style='text-align:center; padding:20px;'>No records found.</p>";
                return;
            }

            snap.forEach(doc => {
                var d = doc.data(); d.id = doc.id; temporalData.push(d);
                let imgs = ""; 
                if(d.fotos) d.fotos.forEach(f => imgs += `<img src="${f}" style="width:50px;height:50px;object-fit:cover;margin:2px;border-radius:5px;">`);

                list.innerHTML += `
                    <div class="hist-card">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div onclick="toggleDetalle('${d.id}')" style="flex-grow:1;">
                                <b>${d.nombre} ${d.apellido}</b><br>
                                <small>${d.fecha || 'No date'} | ${d.estado}</small>
                            </div>
                            <div style="display:flex; align-items:center;">
                                <button class="edit-btn" onclick="editarRegistro('${d.id}')">${translations[currentLang].edit}</button>
                                <button style="color:red; border:none; background:none; font-size:22px;" onclick="borrarRegistro('${d.id}')">✕</button>
                            </div>
                        </div>
                        <div class="hist-details" id="det-${d.id}">
                            <p style="margin:5px 0;">📍 ${d.dir}, ${d.city}</p>
                            <p style="margin:5px 0;">📝 <b>Notes:</b> ${d.notas || ""}</p>
                            <p style="margin:5px 0; color:var(--green); font-weight:bold;">💰 Savings: ${d.ahorro}</p>
                            <div style="margin-top:10px; display:flex; flex-wrap:wrap;">${imgs}</div>
                        </div>
                    </div>`;
            });
        } catch(e) { 
            list.innerHTML = "<p style='color:red; text-align:center;'>Error loading history</p>";
        }
    }

    function editarRegistro(id) {
        const item = temporalData.find(d => d.id === id);
        if(!item) return;
        document.getElementById('c-name').value = item.nombre || "";
        document.getElementById('c-lastname').value = item.apellido || "";
        document.getElementById('c-phone').value = item.tel || "";
        document.getElementById('c-address').value = item.dir || "";
        document.getElementById('c-city').value = item.city || "";
        document.getElementById('c-state').value = item.state || "";
        document.getElementById('c-zip').value = item.zip || "";
        document.getElementById('c-birthday').value = item.bday || "";
        document.getElementById('c-people').value = item.people || "";
        document.getElementById('c-notes').value = item.notas || "";
        document.getElementById('cost-water').value = item.costoAgua || "";
        document.getElementById('cost-soap').value = item.costoJabon || "";
        document.getElementById('test-date').value = item.fecha || "";
        savedPhotos = item.fotos || []; 
        renderPhotoPreview();
        setStatus(item.estado); calculate(); cerrarHistorial();
    }

    function toggleDetalle(id) { var e = document.getElementById('det-'+id); e.style.display = e.style.display==='block'?'none':'block'; }
    function abrirHistorial() { document.getElementById('history-modal').style.display = "block"; filtrarHistorial('ALL'); }
    function cerrarHistorial() { document.getElementById('history-modal').style.display = "none"; }
    function logout() { if(confirm(translations[currentLang].logoutConfirm)) auth.signOut(); }
    async function borrarRegistro(id) { if(confirm("Delete?")) { await db.collection("reportes").doc(id).delete(); filtrarHistorial('ALL'); } }
    function goMaps() { var full = `${document.getElementById('c-address').value} ${document.getElementById('c-city').value}`; window.open('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(full)); }
    function sendSMS() { window.location.href = 'sms:' + document.getElementById('c-phone').value + '&body=One Drop Savings: ' + document.getElementById('net-savings').innerText; }
    
    function setStatus(v) {
        currentStatus = v;
        document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active-ins', 'active-pen', 'active-no'));
        if(v === 'INSTALLED') document.getElementById('st-ins').classList.add('active-ins');
        if(v === 'PENDING') document.getElementById('st-pen').classList.add('active-pen');
        if(v === 'REJECTED') document.getElementById('st-no').classList.add('active-no');
    }
</script>
</body>
</html>
