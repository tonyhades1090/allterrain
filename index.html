<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Allterrain LandMaster Pro</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css' rel='stylesheet' />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica; background: #e5e5e7; overflow: hidden; }
        #map { height: 100vh; width: 100vw; position: absolute; }
        
        /* ESTILO LANDGLIDE: BUSCADOR FLOTANTE */
        .search-box { position: absolute; top: 15px; left: 15px; right: 15px; z-index: 1000; background: white; border-radius: 8px; display: flex; align-items: center; padding: 5px 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.2); }
        #search-input { flex: 1; border: none; padding: 12px; font-size: 16px; outline: none; }
        .btn-search { background: none; border: none; font-size: 20px; cursor: pointer; color: #555; }

        /* PANEL DE INFORMACIÓN INFERIOR (Como en tu foto) */
        #info-panel { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(30, 60, 114, 0.95); color: white; padding: 20px; z-index: 3000; display: none; border-radius: 20px 20px 0 0; box-shadow: 0 -5px 15px rgba(0,0,0,0.3); animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .owner-title { font-size: 18px; font-weight: 800; text-transform: uppercase; margin-bottom: 5px; color: #fff; }
        .address-sub { font-size: 14px; color: #cbd5e0; margin-bottom: 15px; }

        /* BOTONES LATERALES */
        .side-btns { position: absolute; bottom: 120px; right: 15px; z-index: 1000; display: flex; flex-direction: column; gap: 10px; }
        .circle-btn { width: 50px; height: 50px; background: white; border-radius: 50%; border: none; box-shadow: 0 2px 5px rgba(0,0,0,0.2); font-size: 20px; display: flex; align-items: center; justify-content: center; }

        #login-screen { position: fixed; inset: 0; background: white; z-index: 5000; display: flex; align-items: center; justify-content: center; padding: 30px; }
        .login-box { width: 100%; max-width: 320px; text-align: center; }
        .login-input { width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; }
        .btn-login { width: 100%; padding: 15px; background: #1e3c72; color: white; border: none; border-radius: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-screen">
        <form class="login-box" onsubmit="event.preventDefault(); handleAuth();">
            <h2 style="color:#1e3c72; margin-bottom:30px;">ALLTERRAIN PRO</h2>
            <input type="email" id="email" class="login-input" placeholder="Email" required>
            <input type="password" id="password" class="login-input" placeholder="Contraseña" required>
            <button type="submit" class="btn-login">ENTRAR</button>
        </form>
    </div>

    <div id="app-ui" style="display:none;">
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Owner, address, or parcel ID">
            <button class="btn-search" onclick="searchAddress()">🔍</button>
        </div>

        <div class="side-btns">
            <button class="circle-btn" onclick="goToMe()">🎯</button>
            <button class="circle-btn" onclick="logout()">🚪</button>
        </div>

        <div id="info-panel">
            <div class="owner-title" id="m-owner">Cargando...</div>
            <div class="address-sub" id="m-address">Dirección</div>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <select id="f-icon" style="flex:1; padding:10px; border-radius:8px;">
                    <option value="💧">💧 Interesado</option>
                    <option value="✅">✅ Vendido</option>
                    <option value="❌">❌ No</option>
                </select>
                <button onclick="saveData()" style="flex:1; background:#fff; color:#1e3c72; border:none; border-radius:8px; font-weight:bold;">GUARDAR</button>
            </div>
            <button onclick="closePanel()" style="width:100%; background:none; border:none; color:#cbd5e0; margin-top:15px; font-size:12px;">CERRAR</button>
        </div>
    </div>

    <div id="map"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAK9cldIvt1JZJ-fB-1J7Z51FLxxzT3oPg",
        authDomain: "landmaster-aquafill.firebaseapp.com",
        projectId: "landmaster-aquafill",
        storageBucket: "landmaster-aquafill.firebasestorage.app",
        messagingSenderId: "917998011849",
        appId: "1:917998011849:web:3e6eca20719d342fac1418"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    let map, currentCoords, currentId;

    async function handleAuth() {
        try {
            await auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value);
        } catch(e) { alert("Error"); }
    }

    auth.onAuthStateChanged(user => {
        if(user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-ui').style.display = 'block';
            initMap();
        }
    });

    function initMap() {
        map = new maplibregl.Map({
            container: 'map',
            style: { 
                "version": 8, 
                "sources": { 
                    "osm": { "type": "raster", "tiles": ["https://mt1.google.com/vt/lyrs=y,h&x={x}&y={y}&z={z}"], "tileSize": 256 }
                }, 
                "layers": [{"id":"osm","type":"raster","source":"osm"}] 
            },
            center: [-77.4687, 37.4085],
            zoom: 17
        });

        map.on('click', async e => {
            currentCoords = e.lngLat;
            currentId = `${e.lngLat.lng.toFixed(6)}|${e.lngLat.lat.toFixed(6)}`;
            document.getElementById('info-panel').style.display = 'block';
            document.getElementById('m-owner').innerText = "Buscando...";
            
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${e.lngLat.lat}&lon=${e.lngLat.lng}`);
            const data = await res.json();
            const road = (data.address.road || "").replace("Road", "RD").replace("Avenue", "AVE").toUpperCase();
            const fullAddr = ((data.address.house_number || "") + " " + road).trim();
            document.getElementById('m-address').innerText = fullAddr;
            
            const doc = await db.collection("propiedades").doc(fullAddr).get();
            document.getElementById('m-owner').innerText = doc.exists ? doc.data().propietario : "DUEÑO PRIVADO";
        });
    }

    async function searchAddress() {
        const q = document.getElementById('search-input').value;
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q + ", Chesterfield, VA")}&limit=1`);
        const data = await res.json();
        if(data[0]) map.flyTo({center: [parseFloat(data[0].lon), parseFloat(data[0].lat)], zoom: 18});
    }

    function saveData() {
        db.collection("marcadores").doc(currentId).set({ 
            lng: currentCoords.lng, lat: currentCoords.lat, 
            icon: document.getElementById('f-icon').value,
            address: document.getElementById('m-address').innerText
        });
        closePanel();
    }
    function closePanel() { document.getElementById('info-panel').style.display = 'none'; }
    function logout() { auth.signOut(); location.reload(); }
    function goToMe() { navigator.geolocation.getCurrentPosition(p => map.flyTo({center: [p.coords.longitude, p.coords.latitude], zoom: 19})); }
</script>
</body>
</html>
