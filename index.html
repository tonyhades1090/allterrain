<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AquaFeel Pro | Landglide Edition</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f8fafc; font-family: 'Segoe UI', Roboto, sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; display: none; }
        
        /* Auth Screen */
        #auth-container { position: fixed; inset: 0; z-index: 5000; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: white; width: 100%; max-width: 380px; padding: 40px; border-radius: 2.5rem; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .auth-input { background: #f1f5f9; border: 2px solid transparent; color: #1e293b; width: 100%; padding: 16px; border-radius: 1rem; margin-bottom: 12px; outline: none; transition: 0.3s; }
        .auth-input:focus { border-color: #3b82f6; background: white; }

        /* Bottom Panel Estilo Moderno */
        .bottom-panel { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-radius: 2.5rem 2.5rem 0 0; z-index: 2000; padding: 25px; transform: translateY(100%); transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.1); box-shadow: 0 -15px 35px rgba(0,0,0,0.15); }
        .bottom-panel.open { transform: translateY(0); }
        
        .status-btn { background: #f1f5f9; border: 2px solid #e2e8f0; border-radius: 1.2rem; padding: 12px; font-size: 1.6rem; transition: 0.3s; }
        .status-btn.active { border-color: #3b82f6; background: #eff6ff; transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.3); }

        .pin-circle { width: 42px; height: 42px; border-radius: 50%; border: 3px solid white; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        
        .search-bar { position: fixed; top: 20px; left: 15px; right: 15px; z-index: 1000; display: flex; gap: 10px; }
        .search-input { flex: 1; background: white; padding: 18px 20px 18px 50px; border-radius: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: none; outline: none; font-weight: 600; font-size: 15px; }
    </style>
</head>
<body>

    <div id="auth-container">
        <div class="auth-card">
            <div class="w-20 h-20 bg-blue-600 rounded-3xl mx-auto mb-6 flex items-center justify-center shadow-lg shadow-blue-500/50">
                <i class="fa-solid fa-droplet text-white text-4xl"></i>
            </div>
            <h1 id="auth-title" class="text-slate-900 text-2xl font-black mb-2 italic">AQUAFEEL PRO</h1>
            <p class="text-slate-400 text-sm mb-8 font-medium">Analista de Agua v2.0</p>
            
            <input id="email" type="email" placeholder="Email institucional" class="auth-input">
            <input id="pass" type="password" placeholder="Contraseña" class="auth-input">
            
            <button onclick="handleAuth()" id="btn-main" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold uppercase tracking-widest shadow-lg active:scale-95 transition-all mb-4">Entrar</button>
            <button onclick="toggleAuth()" id="btn-switch" class="text-blue-600 text-xs font-bold uppercase tracking-wider">¿Nuevo analista? Registro</button>
        </div>
    </div>

    <div id="map"></div>

    <div id="ui-controls" style="display:none;">
        <div class="search-bar">
            <div class="relative flex-1">
                <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input id="search-input" type="text" placeholder="Calle, ciudad o código postal..." class="search-input">
            </div>
            <button onclick="buscarDireccion()" class="bg-blue-600 text-white w-14 h-[58px] rounded-2xl shadow-xl flex items-center justify-center active:scale-90 transition-all"><i class="fa-solid fa-arrow-right"></i></button>
        </div>

        <div class="fixed bottom-10 right-6 flex flex-col gap-4 z-[1000]">
            <button id="admin-btn" class="w-14 h-14 bg-red-600 text-white rounded-full shadow-2xl hidden flex items-center justify-center transition-all" onclick="verTodo()"><i class="fa-solid fa-eye"></i></button>
            <button class="w-14 h-14 bg-white text-slate-900 rounded-full shadow-2xl flex items-center justify-center active:rotate-45 transition-all" onclick="map.locate({setView:true, maxZoom:19})"><i class="fa-solid fa-location-crosshairs text-xl"></i></button>
        </div>

        <div id="info-panel" class="bottom-panel">
            <div class="w-16 h-1 bg-slate-200 rounded-full mx-auto mb-6"></div>
            
            <div class="flex justify-between items-start mb-6">
                <div class="flex-1">
                    <h2 id="display-addr" class="font-black text-xl text-slate-900 leading-tight">Dirección de Propiedad</h2>
                    <p class="text-blue-500 font-bold text-xs uppercase mt-1 tracking-widest">Ficha Técnica de Agua</p>
                </div>
                <button onclick="cerrarPanel()" class="w-10 h-10 bg-slate-100 rounded-full text-slate-500 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <input id="prop-owner" type="text" placeholder="Nombre del Dueño" class="!bg-slate-50 !text-slate-800 !p-4 !mb-0 !border-slate-200 !rounded-xl text-sm font-bold">
                <input id="prop-phone" type="tel" placeholder="Teléfono" class="!bg-slate-50 !text-slate-800 !p-4 !mb-0 !border-slate-200 !rounded-xl text-sm font-bold">
            </div>

            <div class="grid grid-cols-4 gap-3 mb-6">
                <button onclick="setEmoji('✅','#22c55e',this)" class="status-btn active">✅</button>
                <button onclick="setEmoji('❌','#ef4444',this)" class="status-btn">❌</button>
                <button onclick="setEmoji('⚠️','#f59e0b',this)" class="status-btn">⚠️</button>
                <button onclick="setEmoji('⏳','#64748b',this)" class="status-btn">⏳</button>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                    <span class="text-[10px] font-black text-blue-400 uppercase block mb-1">TDS Actual</span>
                    <input id="tds" type="number" placeholder="000" class="!bg-transparent !mb-0 !p-0 !text-blue-900 text-2xl font-black !border-none outline-none">
                </div>
                <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                    <span class="text-[10px] font-black text-blue-400 uppercase block mb-1">Cloro (DPD)</span>
                    <input id="cloro" type="number" step="0.1" placeholder="0.0" class="!bg-transparent !mb-0 !p-0 !text-blue-900 text-2xl font-black !border-none outline-none">
                </div>
            </div>

            <textarea id="notas" placeholder="Escribe notas de la visita aquí..." class="w-full bg-slate-50 p-4 rounded-2xl border border-slate-200 text-sm font-medium mb-6 outline-none h-24"></textarea>

            <button onclick="guardar()" class="w-full bg-blue-600 py-5 rounded-2xl font-black text-white uppercase tracking-widest shadow-xl shadow-blue-200 active:scale-95 transition-all">Registrar Propiedad</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCcX7KNM-w1A-3sgNoFwKxMVO7M7_e1Ab4", authDomain: "all-terrain-8755d.firebaseapp.com", projectId: "all-terrain-8755d", appId: "1:409885375480:web:bb2fc6df313721e195340d" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();

        let isLogin = true, map, marker, activeEmoji = '✅', activeColor = '#22c55e';

        function toggleAuth() { isLogin = !isLogin; document.getElementById('auth-title').innerText = isLogin ? "AQUAFEEL PRO" : "NUEVO ANALISTA"; document.getElementById('btn-main').innerText = isLogin ? "Entrar" : "Crear Perfil"; }
        async function handleAuth() {
            const e = document.getElementById('email').value, p = document.getElementById('pass').value;
            try { isLogin ? await auth.signInWithEmailAndPassword(e,p) : await auth.createUserWithEmailAndPassword(e,p); } catch(err){ alert("Error: " + err.message); }
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                document.getElementById('auth-container').style.display='none';
                document.getElementById('map').style.display='block';
                document.getElementById('ui-controls').style.display='block';
                if(user.email === "tonyhades@gmail.com") document.getElementById('admin-btn').classList.remove('hidden');
                initMap();
            }
        });

        function initMap() {
            if(map) return;
            map = L.map('map', { zoomControl: false }).setView([25.7617, -80.1918], 14);
            // Capa más detallada para ver números y parcelas
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_labels_under/{z}/{x}/{y}{r}.png', {
                maxZoom: 20
            }).addTo(map);

            map.on('click', e => colocarPin(e.latlng.lat, e.latlng.lng));
        }

        async function buscarDireccion() {
            const query = document.getElementById('search-input').value;
            if(!query) return;
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}&addressdetails=1`);
            const data = await res.json();
            if(data.length > 0) {
                const { lat, lon } = data[0];
                map.setView([lat, lon], 19);
                colocarPin(lat, lon);
            } else { alert("No se encontró la dirección exacta."); }
        }

        async function colocarPin(lat, lng) {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&addressdetails=1`);
            const data = await res.json();
            const addr = data.address;
            const calle = (addr.house_number || "") + " " + (addr.road || "Calle desconocida");
            
            if(marker) map.removeLayer(marker);
            marker = L.marker([lat, lng]).addTo(map);
            updateIcon();
            
            document.getElementById('display-addr').innerText = calle;
            document.getElementById('info-panel').classList.add('open');
            // Limpiar campos para nueva entrada
            document.getElementById('prop-owner').value = "";
            document.getElementById('prop-phone').value = "";
            document.getElementById('tds').value = "";
            document.getElementById('cloro').value = "";
            document.getElementById('notas').value = "";
        }

        function setEmoji(e, c, btn) {
            activeEmoji = e; activeColor = c;
            document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateIcon();
        }

        function updateIcon() {
            if(!marker) return;
            marker.setIcon(L.divIcon({ className:'', html:`<div class="pin-circle" style="background:${activeColor}">${activeEmoji}</div>`, iconSize:[42,42], iconAnchor:[21,21] }));
        }

        function cerrarPanel() { document.getElementById('info-panel').classList.remove('open'); if(marker) map.removeLayer(marker); }

        async function guardar() {
            const data = {
                lat: marker.getLatLng().lat,
                lng: marker.getLatLng().lng,
                direccion: document.getElementById('display-addr').innerText,
                dueño: document.getElementById('prop-owner').value,
                tel: document.getElementById('prop-phone').value,
                tds: document.getElementById('tds').value,
                cloro: document.getElementById('cloro').value,
                notas: document.getElementById('notas').value,
                estado: activeEmoji,
                color: activeColor,
                analista: auth.currentUser.email,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            };
            await db.collection("propiedades").add(data);
            alert("Propiedad registrada en el sistema AquaFeel.");
            cerrarPanel();
        }

        async function verTodo() {
            const snap = await db.collection("propiedades").get();
            snap.forEach(doc => {
                const d = doc.data();
                L.marker([d.lat, d.lng]).addTo(map).setIcon(L.divIcon({ 
                    className:'', 
                    html:`<div class="pin-circle" style="background:${d.color}; opacity:0.9; transform:scale(0.85)">${d.estado}</div>`, 
                    iconSize:[42,42], iconAnchor:[21,21] 
                })).on('click', () => {
                    document.getElementById('display-addr').innerText = d.direccion;
                    document.getElementById('prop-owner').value = d.dueño || "";
                    document.getElementById('prop-phone').value = d.tel || "";
                    document.getElementById('tds').value = d.tds || "";
                    document.getElementById('cloro').value = d.cloro || "";
                    document.getElementById('notas').value = d.notas || "";
                    document.getElementById('info-panel').classList.add('open');
                });
            });
            alert("Historial de analistas cargado en el mapa.");
        }
    </script>
</body>
</html>
