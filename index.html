<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>All Terrain | Field Analysis</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .glass { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px); }
        body { background-color: #020617; }
        /* Estilo para que parezca App nativa en iPhone */
        #map-sim { height: 100vh; width: 100%; background: radial-gradient(circle, #1e293b 0%, #020617 100%); cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-ui" class="fixed inset-0 z-[5000] bg-slate-950 flex flex-col items-center justify-center p-8">
        <div class="w-28 h-28 bg-blue-600 rounded-[2rem] mb-6 flex items-center justify-center shadow-2xl border border-white/20">
            <div class="relative">
                <i class="fa-solid fa-droplet text-5xl text-white"></i>
                <i class="fa-solid fa-house-chimney text-2xl text-slate-950 absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></i>
            </div>
        </div>
        <h1 class="text-3xl font-black text-white italic tracking-tighter mb-8">ALL TERRAIN</h1>
        <div class="w-full max-w-xs space-y-4">
            <input id="email" type="email" placeholder="Email" class="w-full p-4 bg-slate-900 rounded-2xl text-white border border-slate-800 outline-none focus:border-blue-500">
            <input id="pass" type="password" placeholder="Password" class="w-full p-4 bg-slate-900 rounded-2xl text-white border border-slate-800 outline-none focus:border-blue-500">
            <button onclick="handleLogin()" class="w-full bg-blue-600 py-4 rounded-2xl font-bold text-white shadow-lg">ENTRAR</button>
        </div>
    </div>

    <div id="app-ui" class="hidden">
        <div id="map-sim" class="flex items-center justify-center text-slate-500 italic px-10 text-center">
            Toque cualquier punto del mapa para iniciar análisis
        </div>

        <div class="fixed right-4 bottom-28 flex flex-col gap-4 z-10">
            <button class="w-12 h-12 glass border border-slate-700 rounded-full text-orange-400 shadow-xl"><i class="fa-solid fa-clock"></i></button>
            <button class="w-12 h-12 bg-white text-slate-900 rounded-full shadow-2xl"><i class="fa-solid fa-location-crosshairs"></i></button>
        </div>

        <div id="panel" class="fixed bottom-0 inset-x-0 glass border-t border-blue-500/30 rounded-t-[40px] p-8 z-20 transform translate-y-full transition-all duration-500">
            <div class="flex justify-between items-center mb-6">
                <h3 id="house-title" class="text-2xl font-bold text-white italic">CASA #---</h3>
                <span class="text-3xl">💧</span>
            </div>
            <textarea id="note-text" maxlength="160" class="w-full bg-slate-800 rounded-2xl p-4 text-white text-sm h-24 outline-none border border-slate-700 mb-4" placeholder="Notas (Máx 160 caracteres)..."></textarea>
            <button onclick="saveAnalysis()" class="w-full bg-blue-600 py-4 rounded-2xl font-black text-white tracking-widest">GUARDAR</button>
            <button onclick="closePanel()" class="w-full text-slate-500 mt-4 text-sm">Cerrar</button>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN REAL DE FIREBASE ANTONIO
        const firebaseConfig = {
          apiKey: "AIzaSyCcX7KNM-w1A-3sgNoFwKxMVO7M7_e1Ab4",
          authDomain: "all-terrain-8755d.firebaseapp.com",
          projectId: "all-terrain-8755d",
          storageBucket: "all-terrain-8755d.firebasestorage.app",
          messagingSenderId: "409885375480",
          appId: "1:409885375480:web:bb2fc6df313721e195340d"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function handleLogin() {
            document.getElementById('login-ui').style.display = 'none';
            document.getElementById('app-ui').classList.remove('hidden');
        }

        document.getElementById('map-sim').onclick = () => {
            document.getElementById('panel').classList.remove('translate-y-full');
            document.getElementById('house-title').innerText = "CASA #" + Math.floor(Math.random()*5000);
        }

        function closePanel() {
            document.getElementById('panel').classList.add('translate-y-full');
        }

        async function saveAnalysis() {
            const note = document.getElementById('note-text').value;
            const house = document.getElementById('house-title').innerText;
            try {
                await db.collection("analisis").add({ 
                    casa: house, 
                    nota: note, 
                    fecha: firebase.firestore.FieldValue.serverTimestamp() 
                });
                alert("✅ Datos guardados en All Terrain");
                document.getElementById('note-text').value = "";
                closePanel();
            } catch (e) { 
                alert("Error al conectar: " + e.message); 
            }
        }
    </script>
</body>
</html>
