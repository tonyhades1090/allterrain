<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>All Terrain | Professional</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #020617; position: fixed; width: 100%; }
        #map-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://user-images.githubusercontent.com/10001/fake-map.jpg'); background-size: cover; background-position: center; }
        
        /* Botón Gota */
        #fab { position: fixed; bottom: 30px; right: 20px; width: 65px; height: 65px; background: #2563eb; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 90; }

        /* Panel Desplegable */
        #side-panel { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(25px); 
            border-radius: 2.5rem 2.5rem 0 0; 
            z-index: 1000; padding: 20px; border-top: 1px solid rgba(255,255,255,0.1);
            transform: translateY(100%); /* Escondido por defecto */
            transition: transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
            will-change: transform;
        }
        #side-panel.open { transform: translateY(0); }

        .handle-area { width: 100%; height: 40px; display: flex; align-items: center; justify-content: center; margin-top: -10px; }
        .handle-bar { width: 40px; height: 5px; background: #475569; border-radius: 10px; }
        
        .status-btn { background: #1e293b; border-radius: 1rem; padding: 15px; border: 2px solid transparent; font-size: 1.5rem; }
        .status-btn.active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.2); }
        input { background: #0f172a !important; border: 1px solid #334155 !important; color: white !important; text-align: center; }
    </style>
</head>
<body>

    <div id="map-bg"></div>

    <div class="fixed top-6 inset-x-4 z-[50]">
        <div class="flex gap-2">
            <div class="relative flex-1">
                <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                <input id="searchInput" type="text" placeholder="Search address..." class="w-full bg-slate-900/95 text-white p-4 pl-12 rounded-2xl border border-white/10 shadow-2xl text-sm outline-none">
            </div>
            <button class="bg-blue-600 text-white px-5 rounded-2xl shadow-lg active:scale-90"><i class="fa-solid fa-arrow-right"></i></button>
            <select id="lang" onchange="cambiarIdioma()" class="bg-slate-800 text-white px-3 rounded-2xl text-[10px] font-bold border border-white/10 outline-none">
                <option value="en">EN</option>
                <option value="es">ES</option>
            </select>
        </div>
    </div>

    <div id="fab" onclick="abrirPanel()"><i class="fa-solid fa-droplet text-white text-2xl"></i></div>

    <div id="side-panel">
        <div class="handle-area" id="drag-zone">
            <div class="handle-bar"></div>
        </div>
        
        <div class="flex justify-between items-center mb-6">
            <h2 id="txt-title" class="text-blue-400 font-black uppercase tracking-widest text-[10px] text-center flex-1">Field Analysis</h2>
            <button onclick="cerrarPanel()" class="text-slate-500 p-2"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6 text-center">
            <div>
                <label id="txt-tds" class="text-[9px] text-slate-500 font-bold uppercase block mb-1">TDS (PPM)</label>
                <input id="tds" type="number" placeholder="000" class="w-full p-4 rounded-2xl text-xl font-bold outline-none">
            </div>
            <div>
                <label id="txt-cloro" class="text-[9px] text-slate-500 font-bold uppercase block mb-1">Chlorine</label>
                <input id="cloro" type="number" step="0.1" placeholder="0.0" class="w-full p-4 rounded-2xl text-xl font-bold outline-none">
            </div>
        </div>

        <div class="grid grid-cols-4 gap-3 mb-6">
            <button onclick="setStatus('💧', this)" class="status-btn active">💧</button>
            <button onclick="setStatus('✅', this)" class="status-btn">✅</button>
            <button onclick="setStatus('❌', this)" class="status-btn">❌</button>
            <button onclick="setStatus('⚠️', this)" class="status-btn">⚠️</button>
        </div>

        <textarea id="notas" class="w-full bg-slate-900 border border-slate-700 p-4 rounded-2xl text-white text-sm h-20 mb-6 outline-none" placeholder="Notes..."></textarea>

        <button onclick="saveData()" id="save-btn" class="w-full bg-blue-600 py-5 rounded-2xl font-black text-white uppercase tracking-widest shadow-xl active:scale-95 transition-all">
            Save Inspection
        </button>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCcX7KNM-w1A-3sgNoFwKxMVO7M7_e1Ab4",
          authDomain: "all-terrain-8755d.firebaseapp.com",
          projectId: "all-terrain-8755d",
          storageBucket: "all-terrain-8755d.firebasestorage.app",
          messagingSenderId: "409885375480",
          appId: "1:409885375480:web:bb2fc6df313721e195340d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentEmoji = "💧";
        const panel = document.getElementById('side-panel');
        const dragZone = document.getElementById('drag-zone');

        function abrirPanel() { panel.classList.add('open'); }
        function cerrarPanel() { panel.classList.remove('open'); }

        // --- GESTO DE DESLIZAMIENTO AVANZADO ---
        let startY = 0;
        let currentY = 0;

        dragZone.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            panel.style.transition = 'none'; // Quitar transición para que siga al dedo
        });

        dragZone.addEventListener('touchmove', (e) => {
            currentY = e.touches[0].clientY;
            let diff = currentY - startY;
            if (diff > 0) { // Solo si desliza hacia abajo
                panel.style.transform = `translateY(${diff}px)`;
            }
        });

        dragZone.addEventListener('touchend', (e) => {
            panel.style.transition = 'transform 0.3s ease';
            let diff = currentY - startY;
            if (diff > 100) { // Si bajó más de 100px, cerrar
                cerrarPanel();
            } else { // Si no, regresar a su sitio
                panel.style.transform = `translateY(0)`;
            }
        });

        function setStatus(emoji, btn) {
            currentEmoji = emoji;
            document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function cambiarIdioma() {
            const l = document.getElementById('lang').value;
            const t = {
                es: { title: "Análisis de Campo", tds: "TDS (PPM)", cloro: "Cloro (MG/L)", save: "Guardar Reporte", search: "Buscar...", notes: "Notas..." },
                en: { title: "Field Analysis", tds: "TDS (PPM)", cloro: "Chlorine", save: "Save Inspection", search: "Search address...", notes: "Notes..." }
            };
            document.getElementById('txt-title').innerText = t[l].title;
            document.getElementById('txt-tds').innerText = t[l].tds;
            document.getElementById('txt-cloro').innerText = t[l].cloro;
            document.getElementById('save-btn').innerText = t[l].save;
            document.getElementById('searchInput').placeholder = t[l].search;
            document.getElementById('notas').placeholder = t[l].notes;
        }

        async function saveData() {
            const data = {
                tds: document.getElementById('tds').value,
                cloro: document.getElementById('cloro').value,
                notas: document.getElementById('notas').value,
                estado: currentEmoji,
                fecha: firebase.firestore.FieldValue.serverTimestamp()
            };
            if(!data.tds || !data.cloro) return alert("Missing data");
            try {
                await db.collection("analisis").add(data);
                alert("✅ Saved!");
                cerrarPanel();
            } catch (e) { alert("Error"); }
        }
    </script>
</body>
</html>
