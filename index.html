<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>All Terrain Pro | Admin System</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #020617; font-family: -apple-system, system-ui, sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; visibility: hidden; }
        
        #auth-container { position: fixed; inset: 0; z-index: 5000; background: #020617; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: #0f172a; width: 100%; max-width: 400px; padding: 35px; border-radius: 2.5rem; border: 1px solid #1e293b; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        input { background: #1e293b !important; border: 1px solid #334155 !important; color: white !important; width: 100%; padding: 16px; border-radius: 1.2rem; margin-bottom: 12px; outline: none; font-size: 16px; }
        
        .pin-circle { width: 44px; height: 44px; border-radius: 50%; border: 3px solid white; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); }

        .bottom-panel { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(25px); border-radius: 2.5rem 2.5rem 0 0; z-index: 2000; padding: 24px; transform: translateY(100%); transition: 0.5s cubic-bezier(0.33, 1, 0.68, 1); border-top: 1px solid rgba(255,255,255,0.1); padding-bottom: calc(24px + env(safe-area-inset-bottom)); }
        .bottom-panel.open { transform: translateY(0); }

        .status-btn { background: #0f172a; border: 2px solid #334155; border-radius: 1.2rem; padding: 15px; font-size: 1.6rem; transition: 0.2s; }
        .status-btn.active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.2); transform: scale(1.1); }

        .admin-badge { background: #ef4444; color: white; font-size: 9px; padding: 2px 8px; border-radius: 10px; font-weight: 900; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div id="auth-container">
        <div class="auth-card">
            <i class="fa-solid fa-crown text-yellow-500 text-5xl mb-6"></i>
            <h1 id="auth-title" class="text-white text-2xl font-black uppercase tracking-tighter mb-2">All Terrain Pro</h1>
            <p id="admin-notice" class="text-slate-500 text-[10px] mb-6 uppercase font-bold tracking-widest">Panel de Control</p>
            
            <input id="auth-email" type="email" placeholder="Email">
            <input id="auth-pass" type="password" placeholder="Password">
            
            <button onclick="handleAuth()" id="btn-main" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold uppercase tracking-widest mb-4 shadow-lg active:scale-95">Entrar</button>
            <button onclick="toggleAuth()" id="btn-switch" class="text-blue-400 text-xs font-bold uppercase">¿Nuevo? Regístrate aquí</button>
        </div>
    </div>

    <div id="map"></div>

    <div id="ui-controls" style="display:none;">
        <div class="fixed top-6 inset-x-4 z-[1000] flex gap-2">
            <div class="relative flex-1">
                <input id="search" type="text" placeholder="Buscar dirección..." class="w-full bg-white/95 p-4 pl-12 rounded-2xl shadow-2xl text-slate-800 font-bold border-none outline-none">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
            </div>
            <button onclick="logout()" class="bg-slate-900 text-white w-14 rounded-2xl shadow-xl border border-white/10"><i class="fa-solid fa-power-off"></i></button>
        </div>

        <div class="fixed bottom-10 right-6 flex flex-col gap-4 z-[1000]">
            <button id="admin-btn" class="w-14 h-14 bg-red-600 text-white rounded-full shadow-2xl hidden" onclick="verTodo()"><i class="fa-solid fa-eye"></i></button>
            <button class="w-14 h-14 bg-blue-600 text-white rounded-full shadow-2xl" onclick="centerMe()"><i class="fa-solid fa-location-arrow"></i></button>
        </div>

        <div id="panel-prop" class="bottom-panel">
            <button onclick="closeP()" class="absolute -top-12 right-6 bg-slate-800 text-white w-10 h-10 rounded-full border-2 border-slate-600 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            
            <div class="text-center mb-6">
                <div id="admin-tag" class="hidden mb-2"><span class="admin-badge">DUEÑO</span></div>
                <p id="addr" class="text-white font-bold text-lg leading-tight">Ubicación</p>
                <p id="inspector-name" class="text-slate-500 text-[10px] font-black uppercase tracking-widest mt-1">Nuevo Registro</p>
            </div>

            <div class="grid grid-cols-4 gap-3 mb-6">
                <button onclick="setSt('💧','#3b82f6',this)" class="status-btn active">💧</button>
                <button onclick="setSt('✅','#22c55e',this)" class="status-btn">✅</button>
                <button onclick="setSt('❌','#ef4444',this)" class="status-btn">❌</button>
                <button onclick="setSt('⚠️','#f59e0b',this)" class="status-btn">⚠️</button>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-6">
                <div class="bg-slate-900 rounded-2xl p-3 border border-slate-800 text-center">
                    <span class="text-[9px] text-slate-500 font-bold uppercase block mb-1">TDS</span>
                    <input id="tds" type="number" placeholder="0" class="!bg-transparent !border-none !mb-0 text-center text-xl font-black text-white outline-none w-full">
                </div>
                <div class="bg-slate-900 rounded-2xl p-3 border border-slate-800 text-center">
                    <span class="text-[9px] text-slate-500 font-bold uppercase block mb-1">Cloro</span>
                    <input id="cl" type="number" step="0.1" placeholder="0.0" class="!bg-transparent !border-none !mb-0 text-center text-xl font-black text-white outline-none w-full">
                </div>
            </div>

            <div class="flex gap-3">
                <button id="nav-btn" class="flex-1 bg-slate-200 py-4 rounded-2xl font-bold text-slate-800 text-xs uppercase flex items-center justify-center gap-2">
                    <i class="fa-solid fa-route text-blue-600"></i> GPS
                </button>
                <button onclick="save()" class="flex-[1.5] bg-blue-600 py-4 rounded-2xl font-black text-white text-xs uppercase shadow-lg active:scale-95 transition-all">
                    Guardar
                </button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCcX7KNM-w1A-3sgNoFwKxMVO7M7_e1Ab4", authDomain: "all-terrain-8755d.firebaseapp.com", projectId: "all-terrain-8755d", appId: "1:409885375480:web:bb2fc6df313721e195340d" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();

        // TU CORREO EXACTO SIN PUNTOS EXTRAS
        const OWNER_EMAIL = "tonyhades@gmail.com";
        
        let isLog = true, map, marker, curEmoji = "💧", curCol = "#3b82f6", isAdmin = false;

        function toggleAuth() { isLog = !isLog; document.getElementById('auth-title').innerText = isLog ? "All Terrain Pro" : "Crear Cuenta"; }
        async function handleAuth() {
            const e = document.getElementById('auth-email').value, p = document.getElementById('auth-pass').value;
            if(!e || !p) return alert("Llena los datos");
            try { isLog ? await auth.signInWithEmailAndPassword(e,p) : await auth.createUserWithEmailAndPassword(e,p); } catch(err){ alert(err.message); }
        }

        auth.onAuthStateChanged(user => {
            if(user) { 
                isAdmin = (user.email === OWNER_EMAIL);
                if(isAdmin) {
                    document.getElementById('admin-btn').classList.remove('hidden');
                    document.getElementById('admin-tag').classList.remove('hidden');
                }
                document.getElementById('auth-container').style.display='none';
                document.getElementById('map').style.visibility='visible';
                document.getElementById('ui-controls').style.display='block';
                startMap();
            }
        });

        function startMap() {
            if(map) return;
            map = L.map('map', { zoomControl: false }).setView([25.76, -80.19], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            map.on('click', async e => {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${e.latlng.lat}&lon=${e.latlng.lng}`);
                const d = await res.json();
                if(marker) map.removeLayer(marker);
                marker = L.marker(e.latlng).addTo(map);
                updIco();
                document.getElementById('addr').innerText = d.display_name.split(',')[0] + ", " + d.display_name.split(',')[1];
                document.getElementById('nav-btn').onclick = () => window.open(`http://maps.google.com/maps?q=${e.latlng.lat},${e.latlng.lng}`);
                document.getElementById('panel-prop').classList.add('open');
            });
        }

        function setSt(e, c, b) {
            curEmoji = e; curCol = c;
            document.querySelectorAll('.status-btn').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            updIco();
        }

        function updIco() {
            if(!marker) return;
            marker.setIcon(L.divIcon({ className:'', html:`<div class="pin-circle" style="background:${curCol}">${curEmoji}</div>`, iconSize:[44,44], iconAnchor:[22,22] }));
        }

        function centerMe() { map.locate({setView:true, maxZoom:17}); }
        function closeP() { document.getElementById('panel-prop').classList.remove('open'); }
        function logout() { auth.signOut(); location.reload(); }

        async function save() {
            if(!marker) return;
            const data = {
                lat: marker.getLatLng().lat,
                lng: marker.getLatLng().lng,
                tds: document.getElementById('tds').value,
                cl: document.getElementById('cl').value,
                estado: curEmoji,
                color: curCol,
                direccion: document.getElementById('addr').innerText,
                inspector: auth.currentUser.email,
                fecha: firebase.firestore.FieldValue.serverTimestamp()
            };
            await db.collection("inspecciones").add(data);
            alert("✅ Guardado");
            closeP();
            if(isAdmin) verTodo();
        }

        async function verTodo() {
            if(!isAdmin) return;
            const snap = await db.collection("inspecciones").get();
            snap.forEach(doc => {
                const d = doc.data();
                L.marker([d.lat, d.lng]).addTo(map).setIcon(L.divIcon({ 
                    className:'', 
                    html:`<div class="pin-circle" style="background:${d.color}; opacity:0.8; transform:scale(0.8)">${d.estado}</div>`, 
                    iconSize:[44,44], iconAnchor:[22,22] 
                })).on('click', () => {
                    document.getElementById('addr').innerText = d.direccion;
                    document.getElementById('inspector-name').innerText = "Inspector: " + d.inspector;
                    document.getElementById('tds').value = d.tds;
                    document.getElementById('cl').value = d.cl;
                    document.getElementById('panel-prop').classList.add('open');
                });
            });
        }
    </script>
</body>
</html>
