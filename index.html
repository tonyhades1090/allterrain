<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALL TERRAIN PRO</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f1f5f9; font-family: sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; display: none; }
        #auth-container { position: fixed; inset: 0; z-index: 5000; background: #0f172a; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: white; width: 100%; max-width: 380px; padding: 40px; border-radius: 2rem; text-align: center; }
        input, textarea { background: #f8fafc; border: 1px solid #e2e8f0; width: 100%; padding: 14px; border-radius: 1rem; margin-bottom: 10px; outline: none; color: #1e293b; font-weight: 600; }
        
        .bottom-panel { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-radius: 2.5rem 2.5rem 0 0; z-index: 2000; padding: 25px; transform: translateY(100%); transition: 0.4s cubic-bezier(0, 0, 0.2, 1); box-shadow: 0 -10px 30px rgba(0,0,0,0.1); }
        .bottom-panel.open { transform: translateY(0); }
        
        .status-btn { background: #f1f5f9; border: 2px solid transparent; border-radius: 1rem; padding: 12px; font-size: 1.6rem; transition: 0.2s; }
        .status-btn.active { border-color: #3b82f6; background: #eff6ff; transform: scale(1.1); }
        .pin-circle { width: 42px; height: 42px; border-radius: 50%; border: 3px solid white; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: 0.3s; }
    </style>
</head>
<body>

    <div id="auth-container">
        <div class="auth-card">
            <h1 class="text-3xl font-black mb-2 text-slate-900 italic">ALL TERRAIN</h1>
            <p class="text-slate-400 text-xs mb-8 font-bold uppercase tracking-widest">Property Intelligence</p>
            <input id="email" type="email" placeholder="Usuario">
            <input id="pass" type="password" placeholder="Contraseña">
            <button onclick="handleAuth()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold uppercase shadow-lg">Entrar</button>
        </div>
    </div>

    <div id="map"></div>

    <div id="ui-controls" style="display:none;">
        <div class="fixed top-5 inset-x-4 z-[1000] flex gap-2">
            <input id="search-input" type="text" placeholder="Buscar dirección..." class="flex-1 bg-white p-4 rounded-2xl shadow-xl font-bold text-slate-800 outline-none border-none">
            <button onclick="buscarDireccion()" class="bg-blue-600 text-white w-14 rounded-2xl shadow-xl flex items-center justify-center"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <div class="fixed bottom-10 right-6 flex flex-col gap-4 z-[1000]">
            <button id="admin-btn" class="w-14 h-14 bg-red-600 text-white rounded-full shadow-2xl flex items-center justify-center hidden" onclick="verTodo()"><i class="fa-solid fa-eye"></i></button>
            <button class="w-14 h-14 bg-white text-blue-600 rounded-full shadow-2xl flex items-center justify-center" onclick="map.locate({setView:true, maxZoom:19})"><i class="fa-solid fa-location-crosshairs text-xl"></i></button>
        </div>

        <div id="info-panel" class="bottom-panel">
            <div class="flex justify-between items-start mb-4">
                <div class="flex-1">
                    <h2 id="display-addr" class="font-black text-xl text-slate-900 leading-tight">Cargando...</h2>
                    <p class="text-blue-500 font-bold text-[10px] uppercase">Registro de Analista</p>
                </div>
                <button onclick="cerrarPanel()" class="text-slate-300"><i class="fa-solid fa-circle-xmark text-3xl"></i></button>
            </div>

            <div class="grid grid-cols-4 gap-2 my-6">
                <button id="btn-check" onclick="setEmoji('✅','#22c55e',this)" class="status-btn">✅</button>
                <button id="btn-x" onclick="setEmoji('❌','#ef4444',this)" class="status-btn">❌</button>
                <button id="btn-alert" onclick="setEmoji('⚠️','#f59e0b',this)" class="status-btn">⚠️</button>
                <button id="btn-time" onclick="setEmoji('⏳','#64748b',this)" class="status-btn">⏳</button>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <div class="bg-slate-50 p-3 rounded-xl">
                    <label class="text-[9px] font-bold text-slate-400 block mb-1 uppercase">TDS (ppm)</label>
                    <input id="tds" type="number" placeholder="0" class="!bg-transparent !mb-0 !p-0 !border-none !text-xl !font-black !outline-none">
                </div>
                <div class="bg-slate-50 p-3 rounded-xl">
                    <label class="text-[9px] font-bold text-slate-400 block mb-1 uppercase">Cloro</label>
                    <input id="cloro" type="number" step="0.1" placeholder="0.0" class="!bg-transparent !mb-0 !p-0 !border-none !text-xl !font-black !outline-none">
                </div>
            </div>

            <textarea id="notas" placeholder="Notas internas..." class="text-sm h-20 outline-none"></textarea>

            <div class="flex gap-2">
                <button id="btn-del" onclick="eliminar()" class="hidden bg-red-100 text-red-600 px-4 rounded-xl"><i class="fa-solid fa-trash"></i></button>
                <button onclick="guardar()" id="btn-save" class="flex-1 bg-blue-600 text-white py-4 rounded-xl font-black uppercase shadow-lg active:scale-95 transition-all">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCcX7KNM-w1A-3sgNoFwKxMVO7M7_e1Ab4", authDomain: "all-terrain-8755d.firebaseapp.com", projectId: "all-terrain-8755d", appId: "1:409885375480:web:bb2fc6df313721e195340d" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();

        let map, marker, activeEmoji = '✅', activeColor = '#22c55e', currentDocId = null;
        let layerGroup = L.layerGroup();

        async function handleAuth() {
            const e = document.getElementById('email').value, p = document.getElementById('pass').value;
            try { await auth.signInWithEmailAndPassword(e,p); } catch(err){ alert("Error de acceso"); }
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                document.getElementById('auth-container').style.display='none';
                document.getElementById('map').style.display='block';
                document.getElementById('ui-controls').style.display='block';
                if(user.email === "tonyhades@gmail.com") document.getElementById('admin-btn').classList.remove('hidden');
                initMap();
                verTodo(); // Carga automática de registros existentes
            }
        });

        function initMap() {
            if(map) return;
            map = L.map('map', { zoomControl: false }).setView([25.76, -80.19], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 20 }).addTo(map);
            layerGroup.addTo(map);
            map.on('click', e => colocarPin(e.latlng.lat, e.latlng.lng));
        }

        async function colocarPin(lat, lng, docData = null) {
            if(marker) map.removeLayer(marker);
            
            let calle = "Ubicación seleccionada";
            currentDocId = docData ? docData.id : null;

            if(!docData) {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
                const data = await res.json();
                calle = (data.address.house_number || "") + " " + (data.address.road || "Propiedad");
                document.getElementById('tds').value = "";
                document.getElementById('cloro').value = "";
                document.getElementById('notas').value = "";
                document.getElementById('btn-del').classList.add('hidden');
                document.getElementById('btn-save').innerText = "Guardar Registro";
            } else {
                const d = docData.data();
                calle = d.direccion;
                document.getElementById('tds').value = d.tds;
                document.getElementById('cloro').value = d.cloro;
                document.getElementById('notas').value = d.notas;
                activeEmoji = d.estado;
                activeColor = d.color;
                document.getElementById('btn-del').classList.remove('hidden');
                document.getElementById('btn-save').innerText = "Actualizar Registro";
            }

            marker = L.marker([lat, lng]).addTo(map);
            updateIcon();
            document.getElementById('display-addr').innerText = calle;
            document.getElementById('info-panel').classList.add('open');
        }

        async function guardar() {
            const d = {
                lat: marker.getLatLng().lat,
                lng: marker.getLatLng().lng,
                direccion: document.getElementById('display-addr').innerText,
                tds: document.getElementById('tds').value,
                cloro: document.getElementById('cloro').value,
                notas: document.getElementById('notas').value,
                estado: activeEmoji,
                color: activeColor,
                usuario: auth.currentUser.email,
                fecha: new Date()
            };

            if(currentDocId) {
                await db.collection("registros").doc(currentDocId).update(d);
            } else {
                await db.collection("registros").add(d);
            }
            
            cerrarPanel();
            verTodo(); // Refrescar mapa
        }

        async function eliminar() {
            if(currentDocId && confirm("¿Eliminar este pin del mapa?")) {
                await db.collection("registros").doc(currentDocId).delete();
                cerrarPanel();
                verTodo();
            }
        }

        async function verTodo() {
            layerGroup.clearLayers();
            const snap = await db.collection("registros").get();
            snap.forEach(doc => {
                const d = doc.data();
                const m = L.marker([d.lat, d.lng], {
                    icon: L.divIcon({ 
                        className:'', 
                        html:`<div class="pin-circle" style="background:${d.color}">${d.estado}</div>`, 
                        iconSize:[42,42], iconAnchor:[21,21] 
                    })
                }).addTo(layerGroup);
                
                m.on('click', (e) => {
                    L.DomEvent.stopPropagation(e);
                    colocarPin(d.lat, d.lng, doc);
                });
            });
        }

        function setEmoji(e, c, btn) {
            activeEmoji = e; activeColor = c;
            document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if(marker) updateIcon();
        }

        function updateIcon() {
            marker.setIcon(L.divIcon({ className:'', html:`<div class="pin-circle" style="background:${activeColor}">${activeEmoji}</div>`, iconSize:[42,42], iconAnchor:[21,21] }));
        }

        function cerrarPanel() { document.getElementById('info-panel').classList.remove('open'); if(marker) map.removeLayer(marker); currentDocId = null; }

        async function buscarDireccion() {
            const q = document.getElementById('search-input').value;
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}`);
            const data = await res.json();
            if(data.length > 0) {
                map.setView([data[0].lat, data[0].lon], 19);
                colocarPin(data[0].lat, data[0].lon);
            }
        }
    </script>
</body>
</html>
