<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>All Terrain Pro | Dueño</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #020617; font-family: sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; display: none; }
        #auth-container { position: fixed; inset: 0; z-index: 5000; background: #020617; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: #0f172a; width: 100%; max-width: 400px; padding: 35px; border-radius: 2rem; border: 1px solid #1e293b; text-align: center; }
        input { background: #1e293b !important; border: 1px solid #334155 !important; color: white !important; width: 100%; padding: 16px; border-radius: 1rem; margin-bottom: 12px; outline: none; }
        .pin-circle { width: 44px; height: 44px; border-radius: 50%; border: 3px solid white; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; }
        .bottom-panel { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(15, 23, 42, 0.98); border-radius: 2rem 2rem 0 0; z-index: 2000; padding: 25px; transform: translateY(100%); transition: 0.4s ease; border-top: 1px solid rgba(255,255,255,0.1); }
        .bottom-panel.open { transform: translateY(0); }
        .status-btn { background: #0f172a; border: 2px solid #334155; border-radius: 1rem; padding: 12px; font-size: 1.5rem; }
        .status-btn.active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.2); }
    </style>
</head>
<body>

    <div id="auth-container">
        <div class="auth-card">
            <i class="fa-solid fa-crown text-yellow-500 text-5xl mb-6"></i>
            <h1 id="auth-title" class="text-white text-2xl font-bold mb-6">ALL TERRAIN PRO</h1>
            <input id="auth-email" type="email" placeholder="Correo Electrónico">
            <input id="auth-pass" type="password" placeholder="Contraseña">
            <button onclick="handleAuth()" id="btn-main" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold uppercase mb-4">Entrar</button>
            <button onclick="toggleAuthMode()" id="btn-switch" class="text-blue-400 text-xs font-bold uppercase">¿No tienes cuenta? Regístrate</button>
        </div>
    </div>

    <div id="map"></div>

    <div id="ui-controls" style="display:none;">
        <div class="fixed top-6 inset-x-4 z-[1000] flex gap-2">
            <input id="search" type="text" placeholder="Buscar dirección..." class="flex-1 bg-white p-4 rounded-2xl shadow-2xl font-bold outline-none">
            <button onclick="logout()" class="bg-red-600 text-white w-14 rounded-2xl"><i class="fa-solid fa-power-off"></i></button>
        </div>
        <div class="fixed bottom-10 right-6 flex flex-col gap-4 z-[1000]">
            <button id="admin-btn" class="w-14 h-14 bg-red-600 text-white rounded-full hidden" onclick="verTodo()"><i class="fa-solid fa-eye"></i></button>
            <button class="w-14 h-14 bg-blue-600 text-white rounded-full" onclick="centerMe()"><i class="fa-solid fa-location-arrow"></i></button>
        </div>
        <div id="panel-prop" class="bottom-panel text-center">
            <button onclick="closeP()" class="absolute -top-10 right-6 bg-slate-800 text-white w-8 h-8 rounded-full border border-slate-600">X</button>
            <div id="admin-tag" class="hidden mb-2 font-bold text-red-500 text-[10px]">MODO DUEÑO</div>
            <p id="addr" class="text-white font-bold text-lg mb-4">Dirección</p>
            <div class="grid grid-cols-4 gap-2 mb-4">
                <button onclick="setSt('💧','#3b82f6',this)" class="status-btn active">💧</button>
                <button onclick="setSt('✅','#22c55e',this)" class="status-btn">✅</button>
                <button onclick="setSt('❌','#ef4444',this)" class="status-btn">❌</button>
                <button onclick="setSt('⚠️','#f59e0b',this)" class="status-btn">⚠️</button>
            </div>
            <div class="grid grid-cols-2 gap-2 mb-6">
                <input id="tds" type="number" placeholder="TDS" class="text-center font-bold">
                <input id="cl" type="number" step="0.1" placeholder="CL" class="text-center font-bold">
            </div>
            <button onclick="save()" class="w-full bg-blue-600 py-4 rounded-xl font-bold text-white uppercase">Guardar Registro</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCcX7KNM-w1A-3sgNoFwKxMVO7M7_e1Ab4", authDomain: "all-terrain-8755d.firebaseapp.com", projectId: "all-terrain-8755d", appId: "1:409885375480:web:bb2fc6df313721e195340d" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        const OWNER_EMAIL = "tonyhades@gmail.com";
        
        let isLogin = true;

        function toggleAuthMode() {
            isLogin = !isLogin;
            document.getElementById('auth-title').innerText = isLogin ? "ALL TERRAIN PRO" : "CREAR CUENTA";
            document.getElementById('btn-main').innerText = isLogin ? "Entrar" : "Registrarme";
            document.getElementById('btn-switch').innerText = isLogin ? "¿No tienes cuenta? Regístrate" : "¿Ya tienes cuenta? Inicia Sesión";
        }

        async function handleAuth() {
            const email = document.getElementById('auth-email').value;
            const pass = document.getElementById('auth-pass').value;
            if(!email || !pass) return alert("Escribe tu correo y contraseña");

            try {
                if(isLogin) {
                    await auth.signInWithEmailAndPassword(email, pass);
                } else {
                    await auth.createUserWithEmailAndPassword(email, pass);
                    alert("Cuenta creada con éxito");
                }
            } catch (err) { alert("Error: " + err.message); }
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('map').style.display = 'block';
                document.getElementById('ui-controls').style.display = 'block';
                if(user.email === OWNER_EMAIL) {
                    document.getElementById('admin-btn').classList.remove('hidden');
                    document.getElementById('admin-tag').classList.remove('hidden');
                }
                startMap();
            }
        });

        let map, marker, curEmoji = "💧", curCol = "#3b82f6";
        function startMap() {
            if(map) return;
            map = L.map('map', { zoomControl: false }).setView([25.76, -80.19], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            map.on('click', async e => {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${e.latlng.lat}&lon=${e.latlng.lng}`);
                const d = await res.json();
                if(marker) map.removeLayer(marker);
                marker = L.marker(e.latlng).addTo(map);
                updIco();
                document.getElementById('addr').innerText = d.display_name.split(',')[0];
                document.getElementById('panel-prop').classList.add('open');
            });
        }

        function setSt(e, c, btn) {
            curEmoji = e; curCol = c;
            document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updIco();
        }

        function updIco() {
            if(!marker) return;
            marker.setIcon(L.divIcon({ className:'', html:`<div class="pin-circle" style="background:${curCol}">${curEmoji}</div>`, iconSize:[44,44], iconAnchor:[22,22] }));
        }

        function centerMe() { map.locate({setView:true, maxZoom:17}); }
        function closeP() { document.getElementById('panel-prop').classList.remove('open'); }
        function logout() { auth.signOut(); location.reload(); }

        async function save() {
            await db.collection("inspecciones").add({
                tds: document.getElementById('tds').value,
                cl: document.getElementById('cl').value,
                estado: curEmoji,
                color: curCol,
                direccion: document.getElementById('addr').innerText,
                usuario: auth.currentUser.email,
                fecha: new Date()
            });
            alert("Guardado");
            closeP();
        }
    </script>
</body>
</html>
