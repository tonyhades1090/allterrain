<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>One Drop Pro</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/S76pM5N8/one-drop-icon.png">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.min.js"></script>
    <style>
        :root { --blue: #007aff; --green: #34c759; --orange: #ff9500; --red: #ff3b30; --bg: #f2f2f7; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        .lang-switcher { position: absolute; top: 15px; left: 15px; display: flex; gap: 5px; z-index: 1000; }
        .lang-btn { background: white; border: 1px solid #ddd; border-radius: 5px; padding: 3px 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .lang-btn.active { background: var(--blue); color: white; border-color: var(--blue); }
        #auth-screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: 90vh; }
        #app-screen { display: none; max-width: 450px; margin: auto; padding-bottom: 40px; }
        .auth-card { background: white; padding: 30px; border-radius: 25px; width: 100%; max-width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .header-bar { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 15px; gap: 15px; }
        .logout-btn { color: var(--red); font-weight: 700; font-size: 13px; cursor: pointer; border: 1px solid var(--red); padding: 5px 12px; border-radius: 8px; }
        h1.main-title { color: var(--blue); font-weight: 800; margin: 0; letter-spacing: -1px; text-align: center; flex-grow: 1; }
        h2 { font-size: 14px; color: #333; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 15px; text-transform: uppercase; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 11px; color: #666; text-transform: uppercase; }
        input, select, textarea { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #d1d1d6; font-size: 16px; background: #fff; font-family: inherit; }
        textarea { height: 100px; resize: none; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid-3 { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 10px; }
        .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-weight: 700; font-size: 16px; cursor: pointer; text-align: center; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-gps { background: #5856d6; color: white; margin-top: 5px; }
        .btn-gallery { background: #64d2ff; color: #000; font-size: 14px; padding: 10px; margin-top: 10px; }
        #photo-preview { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .photo-item { position: relative; width: 70px; height: 70px; }
        .preview-img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
        .del-photo { position: absolute; top: -5px; right: -5px; background: var(--red); color: white; border-radius: 50%; width: 20px; height: 20px; border: none; cursor: pointer; font-weight: bold; }
        .status-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .status-btn { height: 45px; border-radius: 10px; border: 1px solid #ddd; background: #f9f9f9; font-size: 9px; font-weight: 800; }
        .active-ins { background: var(--green) !important; color: white; }
        .active-pen { background: var(--orange) !important; color: white; }
        .active-no { background: var(--red) !important; color: white; }
        .savings-box { background: #e7f3ff; padding: 15px; border-radius: 15px; text-align: center; margin: 15px 0; }
        .chart-wrap { position: relative; height: 250px; width: 100%; }
        #history-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f2f2f7; z-index: 5000; overflow-y: auto; }
        .filter-bar { display: flex; gap: 5px; padding: 10px; background: white; position: sticky; top: 0; border-bottom: 1px solid #eee; overflow-x: auto; z-index: 101; }
        .filter-chip { padding: 6px 12px; border-radius: 20px; border: 1px solid #ddd; background: #f9f9f9; font-size: 10px; font-weight: 800; white-space: nowrap; }
        .filter-chip.active { background: var(--blue); color: white; border-color: var(--blue); }
        .hist-card { background: white; margin: 10px; padding: 15px; border-radius: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .hist-details { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ccc; font-size: 14px; line-height: 1.5; }
        .edit-btn { background: var(--orange); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="lang-switcher">
    <button class="lang-btn active" id="btn-en" onclick="setLanguage('en')">EN</button>
    <button class="lang-btn" id="btn-es" onclick="setLanguage('es')">ES</button>
</div>

<div id="auth-screen">
    <div class="auth-card">
        <h1>ONE DROP</h1>
        <p id="auth-msg" style="font-size: 12px; color: #666;">Please Sign In</p>
        <input type="email" id="auth-email" placeholder="Email">
        <input type="password" id="auth-pass" placeholder="Password">
        <button class="btn btn-blue" id="btn-main-auth" onclick="handleAuth()">SIGN IN</button>
        <button class="btn" style="background:none; color:var(--blue); font-size:12px; margin-top:10px;" onclick="toggleAuthMode()" id="toggle-auth-btn">No account? Sign Up</button>
    </div>
</div>

<div id="app-screen">
    <div class="header-bar">
        <h1 class="main-title">ONE DROP</h1>
        <div class="logout-btn" onclick="logout()" data-t="logout">LOGOUT</div>
    </div>

    <div class="card">
        <h2 data-t="clientInfo">👤 Client Info</h2>
        <div class="grid-2">
            <div><label data-t="fName">First Name</label><input type="text" id="c-name"></div>
            <div><label data-t="lName">Last Name</label><input type="text" id="c-lastname"></div>
        </div>
        <label data-t="phone">Phone</label><input type="tel" id="c-phone">
        <label data-t="address">Address</label><input type="text" id="c-address">
        <div class="grid-3">
            <div><label data-t="city">City</label><input type="text" id="c-city"></div>
            <div><label data-t="state">ST</label><input type="text" id="c-state" maxlength="2"></div>
            <div><label data-t="zip">Zip</label><input type="number" id="c-zip"></div>
        </div>
        <label data-t="notes">📝 Notes</label>
        <textarea id="c-notes" placeholder="Private notes..."></textarea>
        <button class="btn btn-gps" onclick="goMaps()" data-t="viewMaps">🗺️ VIEW ON MAPS</button>
        <label style="margin-top:15px;" data-t="photos">📸 Photos</label>
        <input type="file" id="photo-input" accept="image/*" multiple style="display:none;" onchange="handlePhotos(this)">
        <button class="btn btn-gallery" onclick="document.getElementById('photo-input').click()" data-t="galleryBtn">📁 OPEN GALLERY</button>
        <div id="photo-preview"></div>
    </div>

    <div class="card">
        <h2 data-t="savingsTitle">📊 Savings Analysis</h2>
        <div class="grid-2">
            <div><label data-t="waterCost">Water/Mo</label><input type="number" id="cost-water" oninput="calculate()"></div>
            <div><label data-t="soapCost">Soap/Mo</label><input type="number" id="cost-soap" oninput="calculate()"></div>
        </div>
        <div class="grid-2">
            <div><label data-t="monthlyFee">Fee ($)</label><input type="number" id="one-fee" value="180" oninput="calculate()"></div>
            <div>
                <label data-t="projection">Years</label>
                <select id="proj-years" onchange="calculate()">
                    <option value="1">1</option><option value="2">2</option><option value="3">3</option>
                    <option value="4">4</option><option value="5" selected>5</option><option value="6">6</option>
                    <option value="7">7</option><option value="8">8</option><option value="9">9</option>
                    <option value="10">10</option>
                </select>
            </div>
        </div>
        <div class="savings-box">
            <span style="font-size:26px; font-weight:800; color:var(--green);" id="net-savings">$0.00</span><br>
            <small id="savings-label" data-t="netSavings">Net Savings</small>
        </div>
        <div class="chart-wrap"><canvas id="savingsChart"></canvas></div>
    </div>

    <div class="card">
        <h2 data-t="techReport">🧪 Tech Report</h2>
        <div class="grid-2">
            <div><label data-t="date">Date</label><input type="date" id="test-date"></div>
            <div><label>TDS (PPM)</label><input type="number" id="tds-val"></div>
        </div>
        <div class="status-group">
            <button class="status-btn" id="st-ins" onclick="setStatus('INSTALLED')" data-t="stInstalled">INSTALLED</button>
            <button class="status-btn" id="st-pen" onclick="setStatus('PENDING')" data-t="stPending">PENDING</button>
            <button class="status-btn" id="st-no" onclick="setStatus('REJECTED')" data-t="stRejected">REJECTED</button>
        </div>
        <div class="grid-2" style="margin-top:25px;">
            <button class="btn btn-blue" id="save-btn" onclick="saveData()" data-t="saveData">SAVE DATA</button>
            <button class="btn" style="background:#8e8e93; color:white;" onclick="abrirHistorial()" data-t="history">HISTORY</button>
        </div>
    </div>
</div>

<div id="history-modal">
    <div style="padding:20px; background:white; border-bottom:1px solid #ddd; display:flex; justify-content:space-between; align-items:center;">
        <h2 style="margin:0; border:none;" data-t="clientHistory">History</h2>
        <button onclick="cerrarHistorial()" style="background:var(--blue); color:white; border:none; padding:8px 15px; border-radius:8px; font-weight:bold;">DONE</button>
    </div>
    <div class="filter-bar">
        <button class="filter-chip active" id="fh-all" onclick="filtrarHistorial('ALL')">ALL</button>
        <button class="filter-chip" id="fh-ins" onclick="filtrarHistorial('INSTALLED')">INSTALLED</button>
        <button class="filter-chip" id="fh-pen" onclick="filtrarHistorial('PENDING')">PENDING</button>
        <button class="filter-chip" id="fh-rej" onclick="filtrarHistorial('REJECTED')">REJECTED</button>
    </div>
    <div id="history-list" style="padding:10px;"></div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAK9cldIvt1JZJ-fB-1J7Z51FLxxzT3oPg", projectId: "landmaster-aquafill" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    
    let chart, currentStatus = "", currentLang = 'en', isSignUp = false, savedPhotos = [];
    let temporalData = []; 

    const translations = {
        en: { logout: "LOGOUT", clientInfo: "Client Info", fName: "First Name", lName: "Last Name", phone: "Phone", address: "Address", city: "City", state: "ST", zip: "Zip", viewMaps: "🗺️ VIEW ON MAPS", photos: "Photos", galleryBtn: "📁 OPEN GALLERY", savingsTitle: "Savings Analysis", waterCost: "Water/Mo", soapCost: "Soap/Mo", monthlyFee: "Fee ($)", projection: "Years", netSavings: "Net Savings", techReport: "Tech Report", date: "Date", stInstalled: "INSTALLED", stPending: "PENDING", stRejected: "REJECTED", saveData: "SAVE DATA", history: "HISTORY", clientHistory: "History", notes: "Notes", edit: "EDIT" },
        es: { logout: "SALIR", clientInfo: "Datos Cliente", fName: "Nombre", lName: "Apellido", phone: "Teléfono", address: "Dirección", city: "Ciudad", state: "Est.", zip: "Zip", viewMaps: "🗺️ VER MAPS", photos: "Fotos", galleryBtn: "📁 ABRIR GALERÍA", savingsTitle: "Análisis Ahorro", waterCost: "Agua/Mes", soapCost: "Jabón/Mes", monthlyFee: "Cuota ($)", projection: "Años", netSavings: "Ahorro Neto", techReport: "Reporte Técnico", date: "Fecha", stInstalled: "INSTALADO", stPending: "PENDIENTE", stRejected: "RECHAZADO", saveData: "GUARDAR", history: "HISTORIAL", clientHistory: "Historial", notes: "Notas", edit: "EDITAR" }
    };

    function setLanguage(l) { 
        currentLang = l;
        document.querySelectorAll('[data-t]').forEach(el => {
            const k = el.getAttribute('data-t');
            if(translations[l][k]) el.innerText = translations[l][k];
        });
        calculate();
    }

    function toggleAuthMode() { 
        isSignUp = !isSignUp; 
        document.getElementById('btn-main-auth').innerText = isSignUp ? "SIGN UP" : "SIGN IN";
        document.getElementById('toggle-auth-btn').innerText = isSignUp ? "Have account? Sign In" : "No account? Sign Up";
    }

    function handleAuth() {
        const email = document.getElementById('auth-email').value;
        const pass = document.getElementById('auth-pass').value;
        if(isSignUp) auth.createUserWithEmailAndPassword(email, pass).catch(e => alert(e.message));
        else auth.signInWithEmailAndPassword(email, pass).catch(e => alert(e.message));
    }

    auth.onAuthStateChanged(user => {
        if (user) { 
            document.getElementById('auth-screen').style.display = 'none'; 
            document.getElementById('app-screen').style.display = 'block';
            document.getElementById('test-date').valueAsDate = new Date();
        } else { 
            document.getElementById('auth-screen').style.display = 'flex'; 
            document.getElementById('app-screen').style.display = 'none'; 
        }
    });

    function setStatus(v) {
        currentStatus = v;
        document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active-ins', 'active-pen', 'active-no'));
        if(v === 'INSTALLED') document.getElementById('st-ins').classList.add('active-ins');
        if(v === 'PENDING') document.getElementById('st-pen').classList.add('active-pen');
        if(v === 'REJECTED') document.getElementById('st-no').classList.add('active-no');
    }

    async function saveData() {
        const user = auth.currentUser;
        if(!user || !currentStatus) return alert(currentLang === 'es' ? "Selecciona un estado" : "Select status");
        const btn = document.getElementById('save-btn');
        btn.disabled = true; btn.innerText = "...";

        const data = {
            userId: user.uid,
            nombre: document.getElementById('c-name').value,
            apellido: document.getElementById('c-lastname').value,
            tel: document.getElementById('c-phone').value,
            dir: document.getElementById('c-address').value,
            city: document.getElementById('c-city').value,
            state: document.getElementById('c-state').value,
            zip: document.getElementById('c-zip').value,
            notas: document.getElementById('c-notes').value,
            costoAgua: document.getElementById('cost-water').value,
            costoJabon: document.getElementById('cost-soap').value,
            ahorro: document.getElementById('net-savings').innerText,
            tds: document.getElementById('tds-val').value,
            fotos: savedPhotos,
            estado: currentStatus,
            fecha: document.getElementById('test-date').value,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            await db.collection("reportes").add(data);
            alert(currentLang === 'es' ? "¡Guardado!" : "Saved!");
            location.reload(); 
        } catch (e) { alert(e.message); btn.disabled = false; btn.innerText = translations[currentLang].saveData; }
    }

    async function filtrarHistorial(filtro) {
        const user = auth.currentUser;
        if(!user) return;
        
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        const chipId = 'fh-' + filtro.toLowerCase().substring(0,3);
        if(document.getElementById(chipId)) document.getElementById(chipId).classList.add('active');

        var list = document.getElementById('history-list'); 
        list.innerHTML = "Loading..."; temporalData = [];
        
        try {
            let q;
            // CAMBIO AQUÍ: Separamos la consulta según el índice
            if(filtro === 'ALL') {
                q = db.collection("reportes")
                      .where("userId", "==", user.uid)
                      .orderBy("timestamp", "desc");
            } else {
                q = db.collection("reportes")
                      .where("userId", "==", user.uid)
                      .where("estado", "==", filtro)
                      .orderBy("timestamp", "desc");
            }
            
            const snap = await q.get();
            list.innerHTML = "";
            if(snap.empty) { list.innerHTML = "<p style='text-align:center;padding:20px;'>No records found.</p>"; return; }

            snap.forEach(doc => {
                const d = doc.data(); d.id = doc.id; temporalData.push(d);
                let imgs = "";
                if(d.fotos) d.fotos.forEach(f => imgs += `<img src="${f}" style="width:40px;height:40px;object-fit:cover;margin:2px;border-radius:5px;">`);
                
                list.innerHTML += `
                <div class="hist-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div onclick="toggleDetalle('${d.id}')" style="flex-grow:1;">
                            <b>${d.nombre} ${d.apellido}</b><br>
                            <small>${d.fecha} | ${d.estado}</small>
                        </div>
                        <div style="display:flex; gap:10px; align-items:center;">
                            <button class="edit-btn" onclick="editarRegistro('${d.id}')">${translations[currentLang].edit}</button>
                            <button onclick="borrarRegistro('${d.id}')" style="background:none; border:none; color:var(--red); font-size:18px; cursor:pointer; padding:5px;">🗑️</button>
                        </div>
                    </div>
                    <div class="hist-details" id="det-${d.id}">
                        📍 ${d.dir}, ${d.city}<br>
                        📝 <b>Notes:</b> ${d.notas || ""}<br>
                        💰 <b>Savings:</b> ${d.ahorro}<br>
                        <div style="margin-top:10px;">${imgs}</div>
                    </div>
                </div>`;
            });
        } catch(e) { 
            list.innerHTML = "Error loading history. Refresh in 1 minute."; 
        }
    }

    function editarRegistro(id) {
        const item = temporalData.find(d => d.id === id);
        if(!item) return;
        document.getElementById('c-name').value = item.nombre || "";
        document.getElementById('c-lastname').value = item.apellido || "";
        document.getElementById('c-phone').value = item.tel || "";
        document.getElementById('c-address').value = item.dir || "";
        document.getElementById('c-city').value = item.city || "";
        document.getElementById('c-state').value = item.state || "";
        document.getElementById('c-zip').value = item.zip || "";
        document.getElementById('c-notes').value = item.notas || "";
        document.getElementById('cost-water').value = item.costoAgua || "";
        document.getElementById('cost-soap').value = item.costoJabon || "";
        document.getElementById('tds-val').value = item.tds || "";
        document.getElementById('test-date').value = item.fecha || "";
        savedPhotos = item.fotos || [];
        renderPhotoPreview();
        setStatus(item.estado); calculate(); cerrarHistorial();
    }

    async function borrarRegistro(id) {
        if(confirm("Delete record permanentely?")) {
            await db.collection("reportes").doc(id).delete();
            filtrarHistorial('ALL');
        }
    }

    function calculate() {
        const years = parseInt(document.getElementById('proj-years').value) || 1;
        const w = (parseFloat(document.getElementById('cost-water').value) || 0) * years * 12;
        const s = (parseFloat(document.getElementById('cost-soap').value) || 0) * years * 12;
        const f = (parseFloat(document.getElementById('one-fee').value) || 0) * years * 12;
        const net = (w + s) - f;
        document.getElementById('net-savings').innerText = '$' + net.toLocaleString(undefined, {minimumFractionDigits: 2});
        var ctx = document.getElementById('savingsChart').getContext('2d');
        if(chart) chart.destroy();
        chart = new Chart(ctx, { type: 'bar', data: { labels: ['Current', 'One Drop'], datasets: [{ data: [w + s, f], backgroundColor: ['#ff3b30', '#007aff'] }] }, options: { responsive: true, maintainAspectRatio: false, legend: { display: false } } });
    }

    function handlePhotos(input) {
        Array.from(input.files).forEach(file => {
            const reader = new FileReader();
            reader.onload = e => { savedPhotos.push(e.target.result); renderPhotoPreview(); };
            reader.readAsDataURL(file);
        });
    }
    function renderPhotoPreview() {
        const preview = document.getElementById('photo-preview'); preview.innerHTML = "";
        savedPhotos.forEach((src, i) => {
            preview.innerHTML += `<div class="photo-item"><img src="${src}" class="preview-img"><button class="del-photo" onclick="savedPhotos.splice(${i},1);renderPhotoPreview()">✕</button></div>`;
        });
    }
    function toggleDetalle(id) { var e = document.getElementById('det-'+id); e.style.display = e.style.display==='block'?'none':'block'; }
    function abrirHistorial() { document.getElementById('history-modal').style.display = "block"; filtrarHistorial('ALL'); }
    function cerrarHistorial() { document.getElementById('history-modal').style.display = "none"; }
    function logout() { auth.signOut(); }
    function goMaps() { window.open('https://www.google.com/maps/search/' + encodeURIComponent(document.getElementById('c-address').value)); }
</script>
</body>
</html>
