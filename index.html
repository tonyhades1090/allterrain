<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>All Terrain Pro | Oficial</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #020617; font-family: sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; display: none; }
        #auth-container { position: fixed; inset: 0; z-index: 5000; background: #020617; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: #0f172a; width: 100%; max-width: 400px; padding: 35px; border-radius: 2rem; border: 1px solid #1e293b; text-align: center; }
        input { background: #1e293b !important; border: 1px solid #334155 !important; color: white !important; width: 100%; padding: 16px; border-radius: 1rem; margin-bottom: 15px; outline: none; }
        .btn-blue { background: #2563eb; color: white; width: 100%; padding: 16px; border-radius: 1rem; font-weight: bold; text-transform: uppercase; }
        .bottom-panel { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(15, 23, 42, 0.98); border-radius: 2.5rem 2.5rem 0 0; z-index: 2000; padding: 25px; transform: translateY(100%); transition: 0.4s; border-top: 1px solid rgba(255,255,255,0.1); }
        .bottom-panel.open { transform: translateY(0); }
    </style>
</head>
<body>

    <div id="auth-container">
        <div class="auth-card" id="card-acceso">
            <i class="fa-solid fa-crown text-yellow-500 text-5xl mb-6"></i>
            <h1 class="text-white text-2xl font-bold mb-6 uppercase">All Terrain Pro</h1>
            
            <input id="email" type="email" placeholder="Correo">
            <input id="pass" type="password" placeholder="Contraseña">
            
            <button onclick="login()" class="btn-blue mb-4">Entrar</button>
            <button onclick="toggleView(true)" class="text-blue-400 text-xs font-bold uppercase">¿No tienes cuenta? Regístrate</button>
        </div>

        <div class="auth-card" id="card-registro" style="display:none;">
            <h1 class="text-white text-2xl font-bold mb-6">CREAR CUENTA</h1>
            <input id="reg-email" type="email" placeholder="Tu Correo">
            <input id="reg-pass" type="password" placeholder="Tu Contraseña">
            <button onclick="registro()" class="btn-blue mb-4">Registrarme Ahora</button>
            <button onclick="toggleView(false)" class="text-slate-400 text-xs font-bold uppercase">Volver al inicio</button>
        </div>
    </div>

    <div id="map"></div>

    <div id="ui-controls" style="display:none;">
        <div class="fixed top-6 inset-x-4 z-[1000] flex gap-2">
            <input id="search" type="text" placeholder="Buscar..." class="flex-1 bg-white p-4 rounded-2xl shadow-2xl font-bold outline-none">
            <button onclick="location.reload()" class="bg-red-600 text-white w-14 rounded-2xl"><i class="fa-solid fa-power-off"></i></button>
        </div>
        <div class="fixed bottom-10 right-6 flex flex-col gap-4 z-[1000]">
            <button id="admin-btn" class="w-14 h-14 bg-red-600 text-white rounded-full hidden"><i class="fa-solid fa-eye"></i></button>
            <button class="w-14 h-14 bg-blue-600 text-white rounded-full" onclick="map.locate({setView:true, maxZoom:17})"><i class="fa-solid fa-location-arrow"></i></button>
        </div>
        <div id="panel" class="bottom-panel text-center">
            <p id="addr" class="text-white font-bold text-lg mb-6">Cargando dirección...</p>
            <button onclick="alert('Guardado')" class="w-full bg-blue-600 py-4 rounded-xl font-bold text-white uppercase">Guardar Registro</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCcX7KNM-w1A-3sgNoFwKxMVO7M7_e1Ab4", authDomain: "all-terrain-8755d.firebaseapp.com", projectId: "all-terrain-8755d", appId: "1:409885375480:web:bb2fc6df313721e195340d" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        function toggleView(isReg) {
            document.getElementById('card-acceso').style.display = isReg ? 'none' : 'block';
            document.getElementById('card-registro').style.display = isReg ? 'block' : 'none';
        }

        async function login() {
            const e = document.getElementById('email').value, p = document.getElementById('pass').value;
            try { await auth.signInWithEmailAndPassword(e, p); } catch(err) { alert(err.message); }
        }

        async function registro() {
            const e = document.getElementById('reg-email').value, p = document.getElementById('reg-pass').value;
            if(!e || p.length < 6) return alert("Email inválido o contraseña muy corta");
            try { await auth.createUserWithEmailAndPassword(e, p); alert("¡Cuenta Creada!"); } catch(err) { alert(err.message); }
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                document.getElementById('auth-container').style.display = 'none';
                document.getElementById('map').style.display = 'block';
                document.getElementById('ui-controls').style.display = 'block';
                if(user.email === "tonyhades@gmail.com") document.getElementById('admin-btn').classList.remove('hidden');
                initMap();
            }
        });

        let map, marker;
        function initMap() {
            if(map) return;
            map = L.map('map', { zoomControl: false }).setView([25.76, -80.19], 13);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            map.on('click', async e => {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${e.latlng.lat}&lon=${e.latlng.lng}`);
                const d = await res.json();
                if(marker) map.removeLayer(marker);
                marker = L.marker(e.latlng).addTo(map);
                document.getElementById('addr').innerText = d.display_name.split(',')[0];
                document.getElementById('panel').classList.add('open');
            });
        }
    </script>
</body>
</html>
