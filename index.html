<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Drop</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --blue: #007aff; --green: #34c759; --orange: #ff9500; --red: #ff3b30; --bg: #f2f2f7; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; padding-bottom: 50px; }
        .container { max-width: 480px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1 { color: var(--blue); text-align: center; letter-spacing: -1px; margin-bottom: 20px; font-size: 28px; }
        h2 { font-size: 16px; margin-top: 0; color: #333; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 15px; text-transform: uppercase; }
        label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 11px; color: #666; }
        
        input, textarea { 
            width: 100%; height: 50px; padding: 12px; margin-bottom: 12px; border-radius: 12px; border: 1px solid #d1d1d6; 
            font-size: 16px; box-sizing: border-box; background-color: #fff; appearance: none;
        }
        textarea { height: 90px; padding-top: 12px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-weight: 700; font-size: 16px; cursor: pointer; margin-bottom: 10px; display: block; text-align: center; text-decoration: none; }
        .btn-main { background: var(--blue); color: white; }
        .btn-sms { background: var(--green); color: white; }
        .btn-gps { background: #5856d6; color: white; }
        .btn-historial { background: #8e8e93; color: white; }
        
        .status-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .status-btn { height: 50px; border-radius: 12px; border: 2px solid #ddd; background: white; font-size: 10px; font-weight: bold; cursor: pointer; }
        .status-btn.active-ins { background: var(--green); color: white; border-color: var(--green); }
        .status-btn.active-pen { background: var(--orange); color: white; border-color: var(--orange); }
        .status-btn.active-no { background: var(--red); color: white; border-color: var(--red); }

        .savings-box { background: #e7f3ff; padding: 15px; border-radius: 15px; text-align: center; margin: 15px 0; border: 1px solid #cce3f5; }
        .val-highlight { font-size: 26px; font-weight: 800; color: var(--green); display: block; }
        
        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        #app-content { display: none; }
        
        #history-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 3000; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .history-item { border-bottom: 1px solid #eee; padding: 15px 0; font-size: 14px; }

        /* Estilo para Recordar/Registrar */
        .auth-footer { text-align: center; margin-top: 10px; font-size: 14px; color: #666; }
        .auth-footer span { color: var(--blue); cursor: pointer; font-weight: bold; }
        .remember-me { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #666; margin-bottom: 15px; cursor: pointer; }
        .remember-me input { width: 18px; height: 18px; margin: 0; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="card" style="width: 90%; max-width: 350px;">
        <h1 id="auth-title">ONE DROP</h1>
        <label>Email</label>
        <input type="email" id="auth-email" placeholder="usuario@onedrop.com">
        <label>Contraseña</label>
        <input type="password" id="auth-pass" placeholder="••••••••">
        
        <label class="remember-me" id="remember-box">
            <input type="checkbox" id="remember-check"> Recordar mi correo
        </label>

        <button class="btn btn-main" id="auth-btn" onclick="handleAuth()">INICIAR SESIÓN</button>
        
        <div class="auth-footer">
            <p id="toggle-text">¿No tienes cuenta? <span onclick="toggleAuthMode()">Regístrate</span></p>
            <p id="reset-link" style="font-size:12px; margin-top:10px;"><span onclick="handleReset()">Recuperar Contraseña</span></p>
        </div>
    </div>
</div>

<div id="history-modal">
    <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2>📋 Historial de Reportes</h2>
        <button onclick="cerrarHistorial()" style="background:var(--red); color:white; border:none; padding:10px; border-radius:10px; font-weight:bold;">CERRAR</button>
    </div>
    <div id="history-list">Cargando...</div>
</div>

<div id="app-content" class="container">
    <div style="display:flex; justify-content: space-between; align-items: center;">
        <h1>ONE DROP</h1>
        <button onclick="logout()" style="background:none; border:none; color:var(--red); font-weight:bold;">SALIR</button>
    </div>

    <div class="card">
        <h2>👤 Datos del Cliente</h2>
        <div class="grid-2">
            <div><label>Nombre</label><input type="text" id="c-name"></div>
            <div><label>Apellido</label><input type="text" id="c-lastname"></div>
        </div>
        <div class="grid-2">
            <div><label>Cumpleaños</label><input type="date" id="c-birthday"></div>
            <div><label>Personas en casa</label><input type="number" id="c-people"></div>
        </div>
        <label>Número de Teléfono</label>
        <input type="tel" id="c-phone">
        <label>Dirección del Cliente</label>
        <textarea id="c-address"></textarea>
        <button class="btn btn-gps" onclick="goMaps()">🗺️ VER RUTA EN MAPS</button>
    </div>

    <div class="card">
        <h2>💰 Comparativa de Gastos</h2>
        <div class="grid-2">
            <div><label>Gasto Agua ($)</label><input type="number" id="cost-water" oninput="calculate()"></div>
            <div><label>Gasto Jabón ($)</label><input type="number" id="cost-soap" oninput="calculate()"></div>
        </div>
        <label>Cuota One Drop ($)</label>
        <input type="number" id="one-fee" value="180" oninput="calculate()">
        <div class="savings-box">
            <span class="val-highlight" id="net-savings">$0.00</span>
        </div>
        <canvas id="savingsChart"></canvas>
    </div>

    <div class="card">
        <h2>🧪 Reporte Técnico</h2>
        <div class="grid-2">
            <div><label>Fecha del Test</label><input type="date" id="test-date"></div>
            <div><label>TDS (PPM)</label><input type="number" id="tds-val"></div>
        </div>
        <label>¿Presenta Cloro?</label>
        <input type="text" id="cloro-val">
        <label>Estado de la Venta</label>
        <div class="status-group">
            <button class="status-btn" id="st-ins" onclick="setStatus('INSTALADO')">INSTALADO</button>
            <button class="status-btn" id="st-pen" onclick="setStatus('PENDIENTE')">PENDIENTE</button>
            <button class="status-btn" id="st-no" onclick="setStatus('NO INTERESADO')">NO INTERESADO</button>
        </div>
        
        <div class="grid-2" style="margin-top:20px;">
            <button class="btn btn-main" onclick="saveData()">📝 GENERAR</button>
            <button class="btn btn-historial" onclick="abrirHistorial()">📋 HISTORIAL</button>
        </div>
        <button class="btn btn-sms" id="sms-btn" style="display:none;" onclick="sendSMS()">📲 ENVIAR SMS</button>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAK9cldIvt1JZJ-fB-1J7Z51FLxxzT3oPg", projectId: "landmaster-aquafill" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const ADMIN_EMAIL = "tonyhades@gmail.com"; 

    let chart, currentStatus = "", currentUser = null, isLoginMode = true;

    // --- CARGAR CORREO RECORDADO ---
    window.onload = () => {
        const savedEmail = localStorage.getItem('onedrop_email');
        if (savedEmail) {
            document.getElementById('auth-email').value = savedEmail;
            document.getElementById('remember-check').checked = true;
        }
    }

    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
        } else {
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('app-content').style.display = 'none';
        }
    });

    function toggleAuthMode() {
        isLoginMode = !isLoginMode;
        document.getElementById('auth-title').innerText = isLoginMode ? "ONE DROP" : "CREAR CUENTA";
        document.getElementById('auth-btn').innerText = isLoginMode ? "INICIAR SESIÓN" : "REGISTRARME";
        document.getElementById('toggle-text').innerHTML = isLoginMode ? 
            '¿No tienes cuenta? <span onclick="toggleAuthMode()">Regístrate</span>' : 
            '¿Ya tienes cuenta? <span onclick="toggleAuthMode()">Inicia Sesión</span>';
        document.getElementById('remember-box').style.display = isLoginMode ? 'flex' : 'none';
        document.getElementById('reset-link').style.display = isLoginMode ? 'block' : 'none';
    }

    async function handleAuth() {
        const e = document.getElementById('auth-email').value;
        const p = document.getElementById('auth-pass').value;
        const remember = document.getElementById('remember-check').checked;

        if (!e || !p) return alert("Completa todos los campos");

        if (remember) localStorage.setItem('onedrop_email', e);
        else localStorage.removeItem('onedrop_email');

        try {
            if (isLoginMode) {
                await auth.signInWithEmailAndPassword(e, p);
            } else {
                await auth.createUserWithEmailAndPassword(e, p);
                alert("¡Cuenta creada con éxito!");
            }
        } catch(err) { alert("Error: " + err.message); }
    }

    function logout() { auth.signOut(); }
    function handleReset() {
        const email = document.getElementById('auth-email').value;
        if (!email) return alert("Escribe tu email");
        auth.sendPasswordResetEmail(email).then(() => alert("Enlace enviado."));
    }

    // --- LÓGICA DE LA APP (MANTENIDA) ---
    function setStatus(v) {
        currentStatus = v;
        document.getElementById('st-ins').className = 'status-btn' + (v === 'INSTALADO' ? ' active-ins' : '');
        document.getElementById('st-pen').className = 'status-btn' + (v === 'PENDIENTE' ? ' active-pen' : '');
        document.getElementById('st-no').className = 'status-btn' + (v === 'NO INTERESADO' ? ' active-no' : '');
    }

    async function saveData() {
        if(!currentStatus) return alert("Selecciona un estado");
        const data = {
            vendedorId: currentUser.uid,
            vendedorEmail: currentUser.email,
            cliente: document.getElementById('c-name').value + " " + document.getElementById('c-lastname').value,
            tel: document.getElementById('c-phone').value,
            tds: document.getElementById('tds-val').value,
            estado: currentStatus,
            fecha: document.getElementById('test-date').value,
            ahorro: document.getElementById('net-savings').innerText,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };
        await db.collection("reportes").add(data);
        alert("✅ Reporte Guardado.");
        
        const ics = `BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:Seguimiento: ${data.cliente}\nDTSTART:${data.fecha.replace(/-/g,'')}T120000\nEND:VEVENT\nEND:VCALENDAR`;
        const blob = new Blob([ics], { type: 'text/calendar' });
        const link = document.createElement('a');
        link.href = window.URL.createObjectURL(blob);
        link.download = "cita.ics";
        link.click();
        document.getElementById('sms-btn').style.display = 'block';
    }

    async function abrirHistorial() {
        document.getElementById('history-modal').style.display = 'block';
        const listDiv = document.getElementById('history-list');
        listDiv.innerHTML = "Cargando...";
        let query = db.collection("reportes").orderBy("timestamp", "desc");
        if (currentUser.email !== ADMIN_EMAIL) query = query.where("vendedorId", "==", currentUser.uid);
        const snapshot = await query.get();
        listDiv.innerHTML = "";
        snapshot.forEach(doc => {
            const d = doc.data();
            listDiv.innerHTML += `<div class="history-item"><b>${d.cliente}</b> - ${d.estado}<br><small>${d.fecha} | ${d.vendedorEmail}</small></div>`;
        });
    }

    function cerrarHistorial() { document.getElementById('history-modal').style.display = 'none'; }
    function calculate() {
        const w = parseFloat(document.getElementById('cost-water').value) || 0;
        const s = parseFloat(document.getElementById('cost-soap').value) || 0;
        const f = parseFloat(document.getElementById('one-fee').value) || 0;
        const net = (w+s)*12 - (f*12);
        document.getElementById('net-savings').innerText = `$${net.toLocaleString()}`;
        const ctx = document.getElementById('savingsChart').getContext('2d');
        if(chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'bar',
            data: { labels: ['Actual', 'One Drop'], datasets: [{ data: [(w+s)*12, f*12], backgroundColor: ['#ff3b30', '#007aff'] }] },
            options: { plugins: { legend: { display: false } } }
        });
    }

    function goMaps() { window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(document.getElementById('c-address').value)}`, '_blank'); }
    function sendSMS() {
        const phone = document.getElementById('c-phone').value;
        const msg = `ONE DROP - Reporte: TDS ${document.getElementById('tds-val').value} PPM. Ahorro Anual: ${document.getElementById('net-savings').innerText}`;
        window.location.href = `sms:${phone}?body=${encodeURIComponent(msg)}`;
    }
    document.getElementById('test-date').valueAsDate = new Date();
    calculate();
</script>
</body>
</html>
