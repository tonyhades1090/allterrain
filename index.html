<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>One Drop</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --blue: #007aff; --green: #34c759; --orange: #ff9500; --red: #ff3b30; --bg: #f2f2f7; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; padding-bottom: 50px; color: #000; }
        .container { max-width: 450px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; }
        
        h1 { color: var(--blue); text-align: center; letter-spacing: -1px; margin: 10px 0 20px 0; font-size: 28px; font-weight: 800; }
        h2 { font-size: 15px; margin-top: 0; color: #333; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 11px; color: #666; text-transform: uppercase; }
        input, textarea { 
            width: 100%; height: 48px; padding: 12px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #d1d1d6; 
            font-size: 16px; background-color: #fff; appearance: none;
        }
        textarea { height: 80px; resize: none; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-weight: 700; font-size: 16px; cursor: pointer; display: block; text-align: center; transition: 0.2s; }
        .btn-main { background: var(--blue); color: white; }
        .btn-historial { background: #8e8e93; color: white; }
        .btn-gps { background: #5856d6; color: white; margin-top: 5px; }
        .btn-sms { background: var(--green); color: white; margin-top: 15px; }
        
        /* SWITCH ESTILO IOS */
        .switch-box { display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 12px; border-radius: 12px; border: 1px solid #d1d1d6; margin-bottom: 20px; }
        .switch { position: relative; display: inline-block; width: 46px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 30px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--blue); }
        input:checked + .slider:before { transform: translateX(20px); }

        /* STATUS BOTONES */
        .status-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 5px; }
        .status-btn { height: 45px; border-radius: 10px; border: 1px solid #ddd; background: #f9f9f9; font-size: 9px; font-weight: 800; cursor: pointer; color: #666; }
        .status-btn.active-ins { background: var(--green); color: white; border-color: var(--green); }
        .status-btn.active-pen { background: var(--orange); color: white; border-color: var(--orange); }
        .status-btn.active-no { background: var(--red); color: white; border-color: var(--red); }

        /* HISTORIAL MODAL & SWIPE */
        #history-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f2f2f7; z-index: 3000; overflow-y: auto; }
        .hist-item-wrapper { position: relative; background: var(--red); margin-bottom: 1px; overflow: hidden; }
        .hist-item-content { background: white; padding: 15px 20px; position: relative; z-index: 2; transition: transform 0.2s ease-out; }
        .hist-del-btn { position: absolute; right: 0; top: 0; height: 100%; width: 80px; background: var(--red); color: white; border: none; font-weight: bold; z-index: 1; }

        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 2000; display: flex; align-items: center; justify-content: center; }
        #app-content { display: none; }
        .savings-box { background: #e7f3ff; padding: 15px; border-radius: 15px; text-align: center; margin: 15px 0; border: 1px solid #cce3f5; }
        .val-highlight { font-size: 26px; font-weight: 800; color: var(--green); display: block; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="card" style="width: 90%; max-width: 340px;">
        <h1>ONE DROP</h1>
        <label>Email</label>
        <input type="email" id="auth-email" placeholder="usuario@onedrop.com">
        <label>Contraseña</label>
        <input type="password" id="auth-pass" placeholder="••••••••">
        <div class="switch-box" onclick="document.getElementById('remember-check').click()">
            <span style="font-size:14px; font-weight:600;">Recordar mi correo</span>
            <label class="switch"><input type="checkbox" id="remember-check" onclick="event.stopPropagation()"><span class="slider"></span></label>
        </div>
        <button class="btn btn-main" id="auth-btn" onclick="handleAuth()">INICIAR SESIÓN</button>
        <div style="text-align:center; font-size:13px; margin-top:20px; color:#666;">
            ¿No tienes cuenta? <span style="color:var(--blue); font-weight:bold;" onclick="toggleAuthMode()" id="toggle-link">Regístrate</span>
            <br><br>
            <span style="color:var(--blue); font-size:11px;" onclick="handleReset()">Recuperar Contraseña</span>
        </div>
    </div>
</div>

<div id="history-modal">
    <div style="padding:20px; background:white; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #ddd; position:sticky; top:0; z-index:10;">
        <h2 style="margin:0; border:none;">Historial</h2>
        <button onclick="cerrarHistorial()" style="background:var(--blue); color:white; border:none; padding:8px 15px; border-radius:8px; font-weight:bold;">LISTO</button>
    </div>
    <div id="history-list"></div>
</div>

<div id="app-content" class="container">
    <div style="display:flex; justify-content: space-between; align-items: center;">
        <h1 style="margin: 10px 0;">ONE DROP</h1>
        <button onclick="logout()" style="background:none; border:none; color:var(--red); font-weight:bold; font-size:12px;">CERRAR SESIÓN</button>
    </div>

    <div class="card">
        <h2>👤 Datos del Cliente</h2>
        <div class="grid-2">
            <div><label>Nombre</label><input type="text" id="c-name"></div>
            <div><label>Apellido</label><input type="text" id="c-lastname"></div>
        </div>
        <div class="grid-2">
            <div><label>Nacimiento</label><input type="date" id="c-birthday"></div>
            <div><label>Personas</label><input type="number" id="c-people"></div>
        </div>
        <label>Teléfono</label><input type="tel" id="c-phone">
        <label>Dirección</label><textarea id="c-address"></textarea>
        <button class="btn btn-gps" onclick="goMaps()">🗺️ RUTA EN MAPS</button>
    </div>

    <div class="card">
        <h2>💰 Ahorro Estimado</h2>
        <div class="grid-2">
            <div><label>Gasto Agua</label><input type="number" id="cost-water" oninput="calculate()"></div>
            <div><label>Gasto Jabón</label><input type="number" id="cost-soap" oninput="calculate()"></div>
        </div>
        <label>Cuota mensual OD ($)</label><input type="number" id="one-fee" value="180" oninput="calculate()">
        <div class="savings-box"><span class="val-highlight" id="net-savings">$0.00</span><small>Ahorro neto anual</small></div>
        <canvas id="savingsChart" style="max-height:150px;"></canvas>
    </div>

    <div class="card">
        <h2>🧪 Reporte Técnico</h2>
        <div class="grid-2">
            <div><label>Fecha Test</label><input type="date" id="test-date"></div>
            <div><label>TDS (PPM)</label><input type="number" id="tds-val"></div>
        </div>
        <label>Presencia de Cloro</label><input type="text" id="cloro-val">
        <label>Estado de Venta</label>
        <div class="status-group">
            <button class="status-btn" id="st-ins" onclick="setStatus('INSTALADO')">INSTALADO</button>
            <button class="status-btn" id="st-pen" onclick="setStatus('PENDIENTE')">PENDIENTE</button>
            <button class="status-btn" id="st-no" onclick="setStatus('NO PASÓ')">NO PASÓ</button>
        </div>
        <div class="grid-2" style="margin-top:25px;">
            <button class="btn btn-main" onclick="saveData()">📝 GUARDAR</button>
            <button class="btn btn-historial" onclick="abrirHistorial()">📋 HISTORIAL</button>
        </div>
        <button class="btn btn-sms" id="sms-btn" style="display:none;" onclick="sendSMS()">📲 ENVIAR REPORTE SMS</button>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAK9cldIvt1JZJ-fB-1J7Z51FLxxzT3oPg", projectId: "landmaster-aquafill" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const ADMIN_EMAIL = "tonyhades@gmail.com";

    let chart, currentStatus = "", currentUser = null, isLoginMode = true;

    // --- CARGA INICIAL ---
    window.onload = () => {
        const saved = localStorage.getItem('onedrop_email');
        if (saved) { document.getElementById('auth-email').value = saved; document.getElementById('remember-check').checked = true; }
        document.getElementById('test-date').valueAsDate = new Date();
        calculate();
    }

    auth.onAuthStateChanged(user => {
        if (user) { currentUser = user; document.getElementById('auth-screen').style.display = 'none'; document.getElementById('app-content').style.display = 'block'; }
        else { document.getElementById('auth-screen').style.display = 'flex'; document.getElementById('app-content').style.display = 'none'; }
    });

    async function handleAuth() {
        const e = document.getElementById('auth-email').value, p = document.getElementById('auth-pass').value;
        if (!e || !p) return alert("Completa los datos");
        if (document.getElementById('remember-check').checked) localStorage.setItem('onedrop_email', e);
        else localStorage.removeItem('onedrop_email');
        try {
            if (isLoginMode) await auth.signInWithEmailAndPassword(e, p);
            else { await auth.createUserWithEmailAndPassword(e, p); alert("¡Cuenta creada!"); }
        } catch(err) { alert(err.message); }
    }

    function toggleAuthMode() {
        isLoginMode = !isLoginMode;
        document.getElementById('auth-btn').innerText = isLoginMode ? "INICIAR SESIÓN" : "CREAR CUENTA";
        document.getElementById('toggle-link').innerText = isLoginMode ? "Regístrate" : "Inicia Sesión";
    }

    function logout() { auth.signOut(); }
    function handleReset() {
        const e = document.getElementById('auth-email').value;
        if(!e) return alert("Ingresa tu email");
        auth.sendPasswordResetEmail(e).then(() => alert("Correo enviado"));
    }

    function setStatus(v) {
        currentStatus = v;
        document.getElementById('st-ins').className = 'status-btn' + (v === 'INSTALADO' ? ' active-ins' : '');
        document.getElementById('st-pen').className = 'status-btn' + (v === 'PENDIENTE' ? ' active-pen' : '');
        document.getElementById('st-no').className = 'status-btn' + (v === 'NO PASÓ' ? ' active-no' : '');
    }

    async function saveData() {
        if(!currentStatus) return alert("Selecciona un estado");
        const data = {
            vendedorId: currentUser.uid, vendedorEmail: currentUser.email,
            cliente: document.getElementById('c-name').value + " " + document.getElementById('c-lastname').value,
            tel: document.getElementById('c-phone').value, tds: document.getElementById('tds-val').value,
            estado: currentStatus, fecha: document.getElementById('test-date').value,
            ahorro: document.getElementById('net-savings').innerText, timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };
        await db.collection("reportes").add(data);
        alert("✅ Guardado en historial");
        document.getElementById('sms-btn').style.display = "block";
    }

    // --- HISTORIAL CON SWIPE CORREGIDO ---
    async function abrirHistorial() {
        document.getElementById('history-modal').style.display = "block";
        const list = document.getElementById('history-list');
        list.innerHTML = "<p style='padding:20px'>Cargando...</p>";
        let q = db.collection("reportes").orderBy("timestamp", "desc");
        if(currentUser.email !== ADMIN_EMAIL) q = q.where("vendedorId", "==", currentUser.uid);
        const snap = await q.get();
        list.innerHTML = "";
        snap.forEach(doc => {
            const d = doc.data(), id = doc.id;
            list.innerHTML += `
                <div class="hist-item-wrapper" id="wrap-${id}">
                    <button class="hist-del-btn" onclick="borrar('${id}')">BORRAR</button>
                    <div class="hist-item-content" ontouchstart="ts(event,'${id}')" ontouchmove="tm(event,'${id}')" ontouchend="te(event,'${id}')">
                        <div style="display:flex; justify-content:space-between;">
                            <b style="color:var(--blue);">${d.cliente}</b>
                            <span style="font-size:11px; color:#888;">${d.fecha}</span>
                        </div>
                        <div style="font-size:12px; margin-top:5px; color:#444;">
                            Estado: <b>${d.estado}</b> | Vendedor: ${d.vendedorEmail.split('@')[0]}
                        </div>
                    </div>
                </div>`;
        });
    }

    let sx = 0, currId = "";
    function ts(e, id) { sx = e.touches[0].clientX; currId = id; }
    function tm(e, id) {
        let move = sx - e.touches[0].clientX;
        if (move > 0 && move < 100) e.currentTarget.style.transform = `translateX(-${move}px)`;
    }
    function te(e, id) {
        let final = sx - e.changedTouches[0].clientX;
        e.currentTarget.style.transform = final > 60 ? "translateX(-80px)" : "translateX(0)";
    }

    async function borrar(id) {
        if(confirm("¿Borrar registro?")) {
            await db.collection("reportes").doc(id).delete();
            document.getElementById(`wrap-${id}`).remove();
        } else document.querySelector(`#wrap-${id} .hist-item-content`).style.transform = "translateX(0)";
    }

    function cerrarHistorial() { document.getElementById('history-modal').style.display = "none"; }

    function calculate() {
        const w = parseFloat(document.getElementById('cost-water').value) || 0, s = parseFloat(document.getElementById('cost-soap').value) || 0, f = parseFloat(document.getElementById('one-fee').value) || 0;
        const net = (w+s)*12 - (f*12);
        document.getElementById('net-savings').innerText = `$${net.toLocaleString()}`;
        const ctx = document.getElementById('savingsChart').getContext('2d');
        if(chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'bar',
            data: { labels: ['Actual', 'One Drop'], datasets: [{ data: [(w+s)*12, f*12], backgroundColor: [varColor('--red'), varColor('--blue')] }] },
            options: { indexAxis: 'y', plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { grid: { display: false } } } }
        });
    }
    function varColor(name) { return getComputedStyle(document.documentElement).getPropertyValue(name); }
    function goMaps() { window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(document.getElementById('c-address').value)}`, '_blank'); }
    function sendSMS() {
        const p = document.getElementById('c-phone').value, m = `ONE DROP: TDS ${document.getElementById('tds-val').value} PPM. Ahorro Anual: ${document.getElementById('net-savings').innerText}`;
        window.location.href = `sms:${p}?body=${encodeURIComponent(m)}`;
    }
</script>
</body>
</html>
