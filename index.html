<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEO-MASTER PRO</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; }
        #map { height: 100vh; width: 100vw; z-index: 1; }

        /* Barra de Búsqueda Flotante Estilo Google */
        .search-container {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; display: flex; width: 90%; max-width: 500px;
            background: white; border-radius: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            padding: 5px 15px; align-items: center;
        }
        #search-input {
            border: none; width: 100%; padding: 12px; font-size: 16px; outline: none; border-radius: 25px;
        }
        .search-btn { background: none; border: none; cursor: pointer; font-size: 20px; color: #4285F4; }

        /* Botones de Control Laterales */
        .side-controls {
            position: absolute; bottom: 30px; right: 20px; z-index: 1000;
            display: flex; flex-direction: column; gap: 15px;
        }
        .control-btn {
            width: 55px; height: 55px; border-radius: 50%; background: white;
            border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            cursor: pointer; font-size: 24px; display: flex; align-items: center; justify-content: center;
        }
        .active-filter { border: 3px solid #4CAF50; }

        /* Popup de Propiedad Estilo Moderno */
        .property-popup { font-size: 14px; min-width: 200px; }
        .property-popup select, .property-popup textarea {
            width: 100%; margin-top: 10px; border-radius: 5px; border: 1px solid #ccc; padding: 5px;
        }
        .save-btn {
            background: #4285F4; color: white; border: none; padding: 8px;
            width: 100%; margin-top: 10px; cursor: pointer; border-radius: 5px; font-weight: bold;
        }
        .delete-btn { background: #ea4335; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="Busca una dirección o propiedad...">
        <button class="search-btn" onclick="executeSearch()">🔍</button>
    </div>

    <div class="side-controls">
        <button class="control-btn" title="Mi Ubicación" onclick="goToMyLocation()">📍</button>
        <button class="control-btn" id="filter-btn" title="Mostrar/Ocultar Marcados" onclick="toggleFilter()">🏷️</button>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>

    <script>
        // 1. INICIALIZACIÓN DEL MAPA
        const map = L.map('map', { zoomControl: false }).setView([40.4167, -3.7033], 15);
        
        // Capa Híbrida Satélite (Para ver límites de propiedades reales)
        const satelliteLayer = L.tileLayer('https://{s}.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 20, subdomains:['mt0','mt1','mt2','mt3']
        }).addTo(map);

        let savedProperties = JSON.parse(localStorage.getItem('properties')) || {};
        let markersGroup = L.layerGroup().addTo(map);
        let currentMarker = null;
        let showAll = true;

        // 2. FUNCIÓN DE BÚSQUEDA
        const geocoder = L.Control.Geocoder.nominatim();
        function executeSearch() {
            const query = document.getElementById('search-input').value;
            geocoder.geocode(query, (results) => {
                if (results.length > 0) {
                    const res = results[0];
                    map.setView(res.center, 19);
                    L.popup().setLatLng(res.center).setContent("Propiedad encontrada").openOn(map);
                }
            });
        }

        // 3. MI UBICACIÓN
        function goToMyLocation() {
            map.locate({setView: true, maxZoom: 18});
        }

        // 4. GESTIÓN DE PROPIEDADES (CLIC EN MAPA)
        map.on('click', function(e) {
            openPropertyPopup(e.latlng);
        });

        function openPropertyPopup(latlng, existingId = null) {
            const id = existingId || `${latlng.lat},${latlng.lng}`;
            const data = savedProperties[id] || { icon: '📍', note: '', water: 'No definida' };

            const content = `
                <div class="property-popup">
                    <strong>Editar Propiedad</strong><br>
                    Icono: <select id="pop-icon">
                        <option value="📍" ${data.icon === '📍' ? 'selected' : ''}>📍 Estándar</option>
                        <option value="🏠" ${data.icon === '🏠' ? 'selected' : ''}>🏠 Casa</option>
                        <option value="🏗️" ${data.icon === '🏗️' ? 'selected' : ''}>🏗️ Construcción</option>
                        <option value="💧" ${data.icon === '💧' ? 'selected' : ''}>💧 Agua</option>
                        <option value="none">❌ Quitar Icono</option>
                    </select><br>
                    Tipo de Agua: <input type="text" id="pop-water" value="${data.water}"><br>
                    Notas: <textarea id="pop-note" rows="3">${data.note}</textarea>
                    <button class="save-btn" onclick="saveProperty('${id}', ${latlng.lat}, ${latlng.lng})">GUARDAR CAMBIOS</button>
                    ${existingId ? `<button class="save-btn delete-btn" onclick="deleteProperty('${id}')">ELIMINAR TODO</button>` : ''}
                </div>
            `;
            L.popup().setLatLng(latlng).setContent(content).openOn(map);
        }

        // 5. GUARDAR Y REEMPLAZAR (Petición clave)
        function saveProperty(id, lat, lng) {
            const icon = document.getElementById('pop-icon').value;
            const note = document.getElementById('pop-note').value;
            const water = document.getElementById('pop-water').value;

            if (icon === 'none') {
                deleteProperty(id);
                return;
            }

            savedProperties[id] = { lat, lng, icon, note, water };
            localStorage.setItem('properties', JSON.stringify(savedProperties));
            renderMarkers();
            map.closePopup();
        }

        function deleteProperty(id) {
            delete savedProperties[id];
            localStorage.setItem('properties', JSON.stringify(savedProperties));
            renderMarkers();
            map.closePopup();
        }

        // 6. RENDERIZADO SMOOTH
        function renderMarkers() {
            markersGroup.clearLayers();
            if (!showAll) return;

            for (let id in savedProperties) {
                const p = savedProperties[id];
                const marker = L.marker([p.lat, p.lng], {
                    icon: L.divIcon({
                        html: `<div style="font-size: 24px;">${p.icon}</div>`,
                        className: 'custom-div-icon'
                    })
                });
                marker.on('click', (e) => {
                    L.DomEvent.stopPropagation(e);
                    openPropertyPopup(L.latLng(p.lat, p.lng), id);
                });
                markersGroup.addLayer(marker);
            }
        }

        function toggleFilter() {
            showAll = !showAll;
            document.getElementById('filter-btn').classList.toggle('active-filter');
            renderMarkers();
        }

        // Cargar datos iniciales
        renderMarkers();
    </script>
</body>
</html>
