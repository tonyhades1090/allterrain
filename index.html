<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquafeel Solutions: Contrato Digital</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --blue: #003366; --accent: #007aff; --green: #34c759; --bg: #f2f2f7; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; padding-bottom: 80px; }
        .container { max-width: 500px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2 { color: var(--blue); border-bottom: 2px solid var(--accent); padding-bottom: 5px; }
        label { display: block; font-weight: bold; margin: 10px 0 5px; font-size: 13px; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 15px; }
        .btn { width: 100%; padding: 15px; border-radius: 10px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; display: block; text-align: center; text-decoration: none; }
        .btn-main { background: var(--blue); color: white; }
        .btn-sms { background: var(--green); color: white; }
        .btn-orange { background: #ff9500; color: white; }
        #doc-preview { background: #fff; border: 1px solid #000; padding: 15px; font-family: monospace; font-size: 12px; display: none; margin-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align:center; color:var(--blue);">AQUA FEEL SOLUTIONS</h1>
    
    <a href="https://www.cognitoforms.com/AquafeelSolutions/" target="_blank" class="btn btn-orange">📝 ABRIR COGNITO FORMS</a>

    <div class="card">
        <h2>Contrato / Work Order</h2>
        <label>Nombre del Comprador</label>
        <input type="text" id="buyer-name" placeholder="Buyer 1">
        <label>Teléfono Celular</label>
        <input type="tel" id="buyer-phone" placeholder="Cel Number">
        <label>Dirección Completa</label>
        <input type="text" id="buyer-addr" placeholder="Address, City, Zip">
        
        <label>Sistema de Purificación</label>
        <select id="system-model">
            <option value="Aquafeel System 5-Stage">Aquafeel System (5-Stage RO)</option>
            <option value="City Water Purification">City Water System</option>
        </select>
        
        <label>Precio de Venta ($)</label>
        <input type="number" id="cash-price" value="7990">
        
        <label>Cuota Mensual Negociada ($)</label>
        <input type="number" id="monthly-fee" value="180" oninput="runEconomy()">
    </div>

    <div class="card">
        <h2>Análisis de Ahorro</h2>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div>
                <label>Gasto Agua ($)</label>
                <input type="number" id="spend-water" value="80" oninput="runEconomy()">
            </div>
            <div>
                <label>Gasto Jabón ($)</label>
                <input type="number" id="spend-soap" value="40" oninput="runEconomy()">
            </div>
        </div>
        <div style="background:#e7f3ff; padding:10px; border-radius:8px; margin-top:10px; text-align:center;">
            <small>AHORRO ANUAL ESTIMADO:</small><br>
            <strong id="annual-save" style="font-size:22px; color:var(--green);">$0.00</strong>
        </div>
        <canvas id="savingsChart" style="margin-top:15px;"></canvas>
    </div>

    <div class="card">
        <h2>Test de Calidad</h2>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <input type="number" id="tds-val" placeholder="TDS">
            <input type="number" id="cl-val" placeholder="Cloro">
        </div>
        <button class="btn" style="background:#666; color:white;" onclick="document.getElementById('cam').click()">📷 FOTO DEL TEST</button>
        <input type="file" id="cam" capture="camera" accept="image/*" style="display:none" onchange="preview(this)">
        <img id="img-p" style="width:100%; border-radius:10px; margin-top:10px; display:none;">
    </div>

    <div class="card">
        <button class="btn btn-main" onclick="generateSummary()">📄 GENERAR DOCUMENTO DIGITAL</button>
        <div id="doc-preview"></div>
        <button class="btn btn-sms" onclick="sendSMS()">📲 ENVIAR CONTRATO POR SMS</button>
    </div>
</div>

<script>
    let chart;
    const firebaseConfig = { apiKey: "AIzaSyAK9cldIvt1JZJ-fB-1J7Z51FLxxzT3oPg", projectId: "landmaster-aquafill" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function runEconomy() {
        const water = parseFloat(document.getElementById('spend-water').value) || 0;
        const soap = parseFloat(document.getElementById('spend-soap').value) || 0;
        const fee = parseFloat(document.getElementById('monthly-fee').value) || 0;
        const yearlySave = ((water + soap) * 12) - (fee * 12);
        document.getElementById('annual-save').innerText = `$${yearlySave.toLocaleString()}`;
        updateChart((water+soap)*12, fee*12);
    }

    function updateChart(curr, aqua) {
        const ctx = document.getElementById('savingsChart').getContext('2d');
        if(chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'bar',
            data: { labels: ['Gasto Actual', 'Aquafeel'], datasets: [{ data: [curr, aqua], backgroundColor: ['#ff3b30', '#003366'] }] },
            options: { plugins: { legend: { display: false } } }
        });
    }

    function preview(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => { document.getElementById('img-p').src = e.target.result; document.getElementById('img-p').style.display = 'block'; };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function generateSummary() {
        const name = document.getElementById('buyer-name').value;
        const addr = document.getElementById('buyer-addr').value;
        const price = document.getElementById('cash-price').value;
        const tds = document.getElementById('tds-val').value;
        
        const summary = `*** AQUAFEEL SOLUTIONS CONTRACT ***\n` +
                        `CLIENTE: ${name}\n` +
                        `DIRECCION: ${addr}\n` +
                        `SISTEMA: ${document.getElementById('system-model').value}\n` +
                        `PRECIO TOTAL: $${price}\n` +
                        `TDS TEST: ${tds} PPM\n` +
                        `----------------------------------\n` +
                        `DERECHO A CANCELAR: Usted puede cancelar esta\n` +
                        `transaccion dentro de los proximos 3 dias habiles.`;
        
        document.getElementById('doc-preview').innerText = summary;
        document.getElementById('doc-preview').style.display = 'block';
    }

    function sendSMS() {
        const phone = document.getElementById('buyer-phone').value;
        const text = document.getElementById('doc-preview').innerText;
        if(!phone || !text) { alert("Genere el documento y asegurese de tener el telefono."); return; }
        window.location.href = `sms:${phone}?body=${encodeURIComponent(text)}`;
    }

    runEconomy();
</script>
</body>
</html>
