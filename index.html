<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>One Drop Pro</title>

    <link rel="icon" type="image/png" href="https://i.ibb.co/S76pM5N8/one-drop-icon.png">
    <link rel="apple-touch-icon" href="https://i.ibb.co/S76pM5N8/one-drop-icon.png">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.min.js"></script>

    <style>
        :root { --blue: #007aff; --green: #34c759; --orange: #ff9500; --red: #ff3b30; --bg: #f2f2f7; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        
        .lang-switcher { position: absolute; top: 15px; left: 15px; display: flex; gap: 5px; z-index: 1000; }
        .lang-btn { background: white; border: 1px solid #ddd; border-radius: 5px; padding: 5px 10px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .lang-btn.active { background: var(--blue); color: white; border-color: var(--blue); }

        #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; }
        #app-screen { display: none; max-width: 450px; margin: auto; padding-bottom: 40px; }

        .auth-card { background: white; padding: 30px; border-radius: 25px; width: 100%; max-width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; }
        
        h1.main-title { color: var(--blue); font-weight: 800; margin: 0; text-align: center; flex-grow: 1; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 11px; color: #666; text-transform: uppercase; }
        input, select { width: 100%; height: 48px; padding: 12px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #d1d1d6; font-size: 16px; background: #fff; }
        
        .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-weight: 700; font-size: 16px; cursor: pointer; margin-bottom: 10px; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-link { background: none; color: var(--blue); font-size: 13px; margin: 0; padding: 5px; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid-3 { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 10px; }
        
        .preview-img { width: 70px; height: 70px; object-fit: cover; border-radius: 10px; margin: 5px; border: 1px solid #ddd; }
        .savings-box { background: #e7f3ff; padding: 15px; border-radius: 15px; text-align: center; margin: 15px 0; }
        
        #history-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f2f2f7; z-index: 5000; overflow-y: auto; }
    </style>
</head>
<body>

<div class="lang-switcher">
    <button class="lang-btn active" id="btn-en" onclick="setLanguage('en')">EN</button>
    <button class="lang-btn" id="btn-es" onclick="setLanguage('es')">ES</button>
</div>

<div id="auth-screen">
    <div class="auth-card">
        <h1 style="color:var(--blue); margin-bottom:20px;">ONE DROP</h1>
        <input type="email" id="auth-email" placeholder="Email">
        <input type="password" id="auth-pass" placeholder="Password">
        
        <button class="btn btn-blue" id="btn-main-auth" onclick="handleAuth()" data-t="loginBtn">SIGN IN</button>
        
        <div id="auth-footer">
            <button class="btn btn-link" onclick="toggleAuthMode()" id="toggle-text" data-t="noAccount">No account? Sign Up</button><br>
            <button class="btn btn-link" onclick="forgotPassword()" data-t="forgotPass">Forgot Password?</button>
        </div>
    </div>
</div>

<div id="app-screen">
    <div style="display:flex; align-items:center; margin-bottom:20px;">
        <h1 class="main-title">ONE DROP</h1>
        <button onclick="logout()" style="border:1px solid red; color:red; background:none; padding:5px 10px; border-radius:8px; font-weight:bold;" data-t="logout">LOGOUT</button>
    </div>

    <div class="card">
        <h2 style="font-size:14px;" data-t="clientInfo">👤 Client Info</h2>
        <div class="grid-2">
            <div><label data-t="fName">First Name</label><input type="text" id="c-name"></div>
            <div><label data-t="lName">Last Name</label><input type="text" id="c-lastname"></div>
        </div>
        <label data-t="phone">Phone</label><input type="tel" id="c-phone">
        <label data-t="address">Address</label><input type="text" id="c-address">
        <div class="grid-3">
            <div><label data-t="city">City</label><input type="text" id="c-city"></div>
            <div><label data-t="state">State</label><input type="text" id="c-state" maxlength="2"></div>
            <div><label data-t="zip">Zip</label><input type="number" id="c-zip"></div>
        </div>
        <label>📸 <span data-t="photos">Photos</span></label>
        <input type="file" id="photo-input" accept="image/*" multiple style="display:none;" onchange="handlePhotos(this)">
        <button class="btn" style="background:#64d2ff; color:black; font-size:14px;" onclick="document.getElementById('photo-input').click()" data-t="galleryBtn">📁 OPEN GALLERY</button>
        <div id="photo-preview"></div>
    </div>

    <div class="card">
        <h2 style="font-size:14px;" data-t="savingsTitle">📊 Savings</h2>
        <div class="grid-2">
            <div><label data-t="waterCost">Water Cost</label><input type="number" id="cost-water" oninput="calculate()"></div>
            <div><label data-t="soapCost">Soap Cost</label><input type="number" id="cost-soap" oninput="calculate()"></div>
        </div>
        <div class="grid-2">
            <div><label data-t="monthlyFee">Fee</label><input type="number" id="one-fee" value="180" oninput="calculate()"></div>
            <div>
                <label data-t="projection">Years</label>
                <select id="proj-years" onchange="calculate()">
                    <option value="1">1</option><option value="5" selected>5</option><option value="10">10</option>
                </select>
            </div>
        </div>
        <div class="savings-box">
            <span style="font-size:26px; font-weight:800; color:var(--green);" id="net-savings">$0.00</span><br>
            <small id="savings-label" data-t="netSavings">Net Savings</small>
        </div>
    </div>

    <button class="btn btn-blue" onclick="saveData()" data-t="saveData">SAVE DATA</button>
    <button class="btn" style="background:#8e8e93; color:white;" onclick="abrirHistorial()" data-t="history">HISTORY</button>
</div>

<div id="history-modal">
    <div style="padding:20px; background:white; display:flex; justify-content:space-between; align-items:center;">
        <h2 data-t="history">History</h2>
        <button onclick="cerrarHistorial()" style="background:var(--blue); color:white; border:none; padding:8px 15px; border-radius:8px;">DONE</button>
    </div>
    <div id="history-list" style="padding:10px;"></div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAK9cldIvt1JZJ-fB-1J7Z51FLxxzT3oPg", projectId: "landmaster-aquafill" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let isSignUp = false;
    let currentLang = 'en';
    let savedPhotos = [];

    const translations = {
        en: { 
            loginBtn: "SIGN IN", signUpBtn: "SIGN UP", noAccount: "No account? Sign Up", hasAccount: "Have account? Sign In",
            forgotPass: "Forgot Password?", logout: "LOGOUT", clientInfo: "Client Info", fName: "First Name", lName: "Last Name",
            phone: "Phone", address: "Address", city: "City", state: "State", zip: "Zip", photos: "Photos",
            galleryBtn: "📁 OPEN GALLERY", savingsTitle: "Savings Analysis", waterCost: "Water / Mo",
            soapCost: "Soap / Mo", monthlyFee: "Monthly Fee", projection: "Years", netSavings: "Net Savings",
            saveData: "SAVE DATA", history: "HISTORY", resetSent: "Reset email sent!"
        },
        es: { 
            loginBtn: "INGRESAR", signUpBtn: "REGISTRARSE", noAccount: "¿No tienes cuenta? Regístrate", hasAccount: "¿Ya tienes cuenta? Ingresa",
            forgotPass: "¿Olvidaste tu contraseña?", logout: "SALIR", clientInfo: "Datos del Cliente", fName: "Nombre", lName: "Apellido",
            phone: "Teléfono", address: "Dirección", city: "Ciudad", state: "Estado", zip: "Zip", photos: "Fotos",
            galleryBtn: "📁 ABRIR GALERÍA", savingsTitle: "Análisis de Ahorro", waterCost: "Agua / Mes",
            soapCost: "Jabón / Mes", monthlyFee: "Cuota Mensual", projection: "Años", netSavings: "Ahorro Neto",
            saveData: "GUARDAR DATOS", history: "HISTORIAL", resetSent: "¡Correo enviado!"
        }
    };

    // --- LÓGICA DE IDIOMA ---
    function setLanguage(l) {
        currentLang = l;
        document.getElementById('btn-en').classList.toggle('active', l==='en');
        document.getElementById('btn-es').classList.toggle('active', l==='es');
        
        document.querySelectorAll('[data-t]').forEach(el => {
            const key = el.getAttribute('data-t');
            if(translations[l][key]) {
                if(el.tagName === "INPUT") el.placeholder = translations[l][key];
                else el.innerText = translations[l][key];
            }
        });
        updateAuthLabels();
    }

    function updateAuthLabels() {
        const btn = document.getElementById('btn-main-auth');
        const toggle = document.getElementById('toggle-text');
        if(!isSignUp) {
            btn.innerText = translations[currentLang].loginBtn;
            toggle.innerText = translations[currentLang].noAccount;
        } else {
            btn.innerText = translations[currentLang].signUpBtn;
            toggle.innerText = translations[currentLang].hasAccount;
        }
    }

    // --- LÓGICA DE AUTENTICACIÓN ---
    function toggleAuthMode() {
        isSignUp = !isSignUp;
        updateAuthLabels();
    }

    function handleAuth() {
        const email = document.getElementById('auth-email').value;
        const pass = document.getElementById('auth-pass').value;
        if(!email || !pass) return alert("Fill all fields");

        if(isSignUp) {
            auth.createUserWithEmailAndPassword(email, pass).catch(e => alert(e.message));
        } else {
            auth.signInWithEmailAndPassword(email, pass).catch(e => alert(e.message));
        }
    }

    function forgotPassword() {
        const email = document.getElementById('auth-email').value;
        if(!email) return alert("Enter email first");
        auth.sendPasswordResetEmail(email).then(() => alert(translations[currentLang].resetSent));
    }

    auth.onAuthStateChanged(user => {
        if(user) {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
        } else {
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('app-screen').style.display = 'none';
        }
    });

    function logout() { auth.signOut(); }

    // --- LÓGICA DE FOTOS Y CÁLCULOS ---
    function handlePhotos(input) {
        const preview = document.getElementById('photo-preview');
        preview.innerHTML = "";
        savedPhotos = [];
        Array.from(input.files).forEach(file => {
            const reader = new FileReader();
            reader.onload = e => {
                const img = document.createElement('img');
                img.src = e.target.result; img.className = 'preview-img';
                preview.appendChild(img);
                savedPhotos.push(e.target.result);
            };
            reader.readAsDataURL(file);
        });
    }

    function calculate() {
        const years = parseInt(document.getElementById('proj-years').value);
        const w = (parseFloat(document.getElementById('cost-water').value) || 0) * 12 * years;
        const s = (parseFloat(document.getElementById('cost-soap').value) || 0) * 12 * years;
        const f = (parseFloat(document.getElementById('one-fee').value) || 0) * 12 * years;
        document.getElementById('net-savings').innerText = '$' + (w + s - f).toLocaleString();
    }

    async function saveData() {
        await db.collection("reportes").add({
            nombre: document.getElementById('c-name').value,
            apellido: document.getElementById('c-lastname').value,
            fotos: savedPhotos,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert("Saved!");
        location.reload();
    }

    function abrirHistorial() {
        document.getElementById('history-modal').style.display = "block";
        db.collection("reportes").orderBy("timestamp", "desc").get().then(snap => {
            const list = document.getElementById('history-list');
            list.innerHTML = "";
            snap.forEach(doc => {
                const d = doc.data();
                list.innerHTML += `<div class="card"><b>${d.nombre}</b><br><div id="imgs-${doc.id}"></div></div>`;
                if(d.fotos) d.fotos.forEach(f => {
                    const img = document.createElement('img'); img.src = f; img.className = 'preview-img';
                    document.getElementById(`imgs-${doc.id}`).appendChild(img);
                });
            });
        });
    }
    function cerrarHistorial() { document.getElementById('history-modal').style.display = "none"; }
</script>
</body>
</html>
