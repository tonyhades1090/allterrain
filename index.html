<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aqua Fill Pro: Sales & Economy</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --blue: #0052cc; --green: #28a745; --gray: #8e8e93; --red: #ff3b30; }
        body { font-family: -apple-system, sans-serif; background: #f5f5f7; color: #1c1c1e; margin: 0; padding: 15px; padding-bottom: 100px; }
        .container { max-width: 480px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1, h2 { color: var(--blue); text-align: center; margin-bottom: 10px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 13px; color: var(--blue); }
        input, select, textarea { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #d1d1d6; font-size: 16px; box-sizing: border-box; background: #fafafa; }
        .savings-box { background: #e7f3ff; padding: 15px; border-radius: 15px; text-align: center; margin: 15px 0; border: 1px solid #b3d7ff; }
        .savings-box h3 { margin: 5px 0; color: var(--green); font-size: 30px; }
        .btn { width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn-main { background: var(--blue); color: white; }
        .btn-photo { background: #5856d6; color: white; margin-bottom: 15px; }
        .btn-outline { background: transparent; border: 2px solid var(--blue); color: var(--blue); margin-top: 10px; }
        #photo-preview { width: 100%; border-radius: 12px; display: none; margin-bottom: 15px; border: 2px solid var(--blue); }
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 15px; border-top: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="container">
    <h1>AQUA FILL PRO</h1>

    <div class="card">
        <h2>Calculador de Ahorro</h2>
        <label>Gasto mensual Agua Embotellada ($)</label>
        <input type="number" id="cost-water" placeholder="Ej: 80" oninput="runEconomy()">
        
        <label>Gasto mensual Jabones/Limpieza ($)</label>
        <input type="number" id="cost-soap" placeholder="Ej: 50" oninput="runEconomy()">
        
        <div class="savings-box">
            <span style="font-size: 13px; font-weight: bold; color: #555;">AHORRO TOTAL ESTIMADO (ANUAL)</span>
            <h3 id="annual-savings">$0.00</h3>
        </div>
        <canvas id="savingsChart"></canvas>
    </div>

    <div class="card">
        <h2>Reporte de Calidad TDS</h2>
        <label>TDS Grifo (Agua Dura)</label>
        <input type="number" id="tds-raw" placeholder="PPM Entrada">
        <label>TDS Aqua Fill (Agua Pura)</label>
        <input type="number" id="tds-filtered" value="15">
        
        <button class="btn btn-photo" onclick="document.getElementById('camera-input').click()">📷 TOMAR FOTO DEL TEST</button>
        <input type="file" id="camera-input" accept="image/*" capture="camera" style="display:none" onchange="previewPhoto(this)">
        <img id="photo-preview" src="">

        <button class="btn btn-outline" onclick="sendWhatsApp()">ENVIAR REPORTE AL CLIENTE</button>
    </div>

    <div class="card">
        <h2>Perfil del Cliente</h2>
        <input type="text" id="c-name" placeholder="Nombre completo">
        <input type="tel" id="c-phone" placeholder="WhatsApp">
        <input type="number" id="c-people" placeholder="Personas en el hogar">
        <label>Cumpleaños</label>
        <input type="date" id="c-bday">
        
        <label>Estatus de Venta</label>
        <select id="c-status" onchange="checkStatus()">
            <option value="pendiente">Pendiente</option>
            <option value="instalado">✅ Instalado</option>
            <option value="no-instalado">❌ No Instalado</option>
        </select>
        
        <div id="reason-box" style="display:none;">
            <label>¿Por qué no se instaló?</label>
            <textarea id="c-reason" placeholder="Escriba el motivo..."></textarea>
        </div>

        <button class="btn btn-main" onclick="saveAll()">GUARDAR TODO EN SISTEMA</button>
    </div>
</div>

<div class="nav-bar">
    <div style="color:var(--blue)">🏠<br>Venta</div>
    <div style="color:var(--gray)">👥<br>Clientes</div>
    <div style="color:var(--gray)">📊<br>Metas</div>
</div>

<script>
    // Configuración Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyAK9cldIvt1JZJ-fB-1J7Z51FLxxzT3oPg",
        projectId: "landmaster-aquafill",
        storageBucket: "landmaster-aquafill.appspot.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    let chart;

    function runEconomy() {
        const water = parseFloat(document.getElementById('cost-water').value) || 0;
        const soap = parseFloat(document.getElementById('cost-soap').value) || 0;
        const monthlyTotal = water + soap;
        const annualSavings = monthlyTotal * 12;
        
        document.getElementById('annual-savings').innerText = `$${annualSavings.toLocaleString()}`;
        updateChart(water, soap);
    }

    function updateChart(water, soap) {
        const ctx = document.getElementById('savingsChart').getContext('2d');
        if(chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Agua', 'Jabón', 'Ahorro Aqua Fill'],
                datasets: [{
                    data: [water, soap, (water + soap) * 0.7], // Estimación de ahorro del 70%
                    backgroundColor: ['#007aff', '#5856d6', '#28a745']
                }]
            },
            options: { plugins: { legend: { position: 'bottom' } } }
        });
    }

    function previewPhoto(input) {
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = e => {
                const img = document.getElementById('photo-preview');
                img.src = e.target.result;
                img.style.display = 'block';
            };
            reader.readAsDataURL(input.files[0]);
        }
    }

    function checkStatus() {
        const status = document.getElementById('c-status').value;
        document.getElementById('reason-box').style.display = (status === 'no-instalado') ? 'block' : 'none';
    }

    function sendWhatsApp() {
        const name = document.getElementById('c-name').value || "Cliente";
        const water = document.getElementById('cost-water').value || 0;
        const soap = document.getElementById('cost-soap').value || 0;
        const total = (parseFloat(water) + parseFloat(soap)) * 12;
        const tds = document.getElementById('tds-raw').value || "---";

        const text = `*REPORTE DE SALUD Y ECONOMÍA - AQUA FILL*%0A%0A` +
                     `Hola *${name}*, este es el resumen de su visita:%0A%0A` +
                     `🧪 *Calidad de Agua:* ${tds} PPM (Agua Dura)%0A` +
                     `💧 *Pureza Aqua Fill:* 15 PPM%0A%0A` +
                     `💰 *Análisis de Ahorro:*%0A` +
                     `- Gasto en Agua y Jabones: $${(parseFloat(water)+parseFloat(soap))} /mes%0A` +
                     `- *AHORRO ANUAL ESTIMADO: $${total}*%0A%0A` +
                     `Un sistema Aqua Fill se paga solo con su ahorro actual.`;
        
        window.open(`https://wa.me/${document.getElementById('c-phone').value}?text=${text}`);
    }

    async function saveAll() {
        const data = {
            nombre: document.getElementById('c-name').value,
            tel: document.getElementById('c-phone').value,
            status: document.getElementById('c-status').value,
            motivo: document.getElementById('c-reason').value,
            ahorro: document.getElementById('annual-savings').innerText,
            tds: document.getElementById('tds-raw').value,
            fecha: new Date().toISOString()
        };

        try {
            await db.collection("ventas").add(data);
            alert("¡Datos guardados con éxito en la nube!");
            location.reload();
        } catch(e) { alert("Error al guardar: " + e.message); }
    }
</script>
</body>
</html>
