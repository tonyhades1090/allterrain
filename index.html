<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>All Terrain Pro</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #020617; position: fixed; width: 100%; }
        #map-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://user-images.githubusercontent.com/10001/fake-map.jpg'); background-size: cover; background-position: center; }
        
        #fab { position: fixed; bottom: 30px; right: 20px; width: 60px; height: 60px; background: #2563eb; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.4); z-index: 90; }

        /* Panel Corregido */
        #side-panel { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: rgba(15, 23, 42, 0.98); backdrop-filter: blur(20px); 
            border-radius: 2rem 2rem 0 0; z-index: 1000; 
            padding: 20px; padding-bottom: 40px;
            border-top: 1px solid rgba(255,255,255,0.1);
            transform: translateY(100%); 
            transition: transform 0.4s cubic-bezier(0.33, 1, 0.68, 1);
        }
        #side-panel.open { transform: translateY(0); }

        .handle-bar { width: 40px; height: 5px; background: #475569; border-radius: 10px; margin: 0 auto 15px auto; }
        .status-btn { background: #1e293b; border-radius: 1rem; padding: 12px; border: 2px solid transparent; font-size: 1.4rem; }
        .status-btn.active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.2); }
        input, textarea { background: #0f172a !important; border: 1px solid #334155 !important; color: white !important; outline: none; }
    </style>
</head>
<body>

    <div id="map-bg"></div>

    <div class="fixed top-6 inset-x-4 z-[50]">
        <div class="flex gap-2">
            <div class="relative flex-1">
                <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                <input id="searchInput" type="text" placeholder="Search address..." class="w-full bg-slate-900/95 text-white p-4 pl-11 rounded-2xl border border-white/10 shadow-xl text-sm outline-none">
            </div>
            <button class="bg-blue-600 text-white px-4 rounded-2xl shadow-lg active:scale-90"><i class="fa-solid fa-arrow-right"></i></button>
            <select id="lang" onchange="cambiarIdioma()" class="bg-slate-800 text-white px-2 rounded-2xl text-[10px] font-bold border border-white/10 outline-none">
                <option value="en">EN</option>
                <option value="es">ES</option>
            </select>
        </div>
    </div>

    <div id="fab" onclick="abrirPanel()"><i class="fa-solid fa-droplet text-white text-xl"></i></div>

    <div id="side-panel">
        <div class="handle-bar" id="drag-handle"></div>
        
        <div class="flex justify-between items-center mb-4 px-2">
            <h2 id="txt-title" class="text-blue-400 font-black uppercase tracking-widest text-[10px]">Field Analysis</h2>
            <button onclick="cerrarPanel()" class="text-slate-500"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>

        <div class="grid grid-cols-2 gap-3 mb-4">
            <div>
                <label id="txt-tds" class="text-[9px] text-slate-500 font-bold uppercase block mb-1 text-center">TDS (PPM)</label>
                <input id="tds" type="number" placeholder="000" class="w-full p-3 rounded-xl text-lg font-bold text-center">
            </div>
            <div>
                <label id="txt-cloro" class="text-[9px] text-slate-500 font-bold uppercase block mb-1 text-center">Chlorine</label>
                <input id="cloro" type="number" step="0.1" placeholder="0.0" class="w-full p-3 rounded-xl text-lg font-bold text-center">
            </div>
        </div>

        <div class="grid grid-cols-4 gap-2 mb-4">
            <button onclick="setStatus('💧', this)" class="status-btn active">💧</button>
            <button onclick="setStatus('✅', this)" class="status-btn">✅</button>
            <button onclick="setStatus('❌', this)" class="status-btn">❌</button>
            <button onclick="setStatus('⚠️', this)" class="status-btn">⚠️</button>
        </div>

        <textarea id="notas" class="w-full p-3 rounded-xl text-sm h-20 mb-4 outline-none" placeholder="Notes..."></textarea>

        <button onclick="saveData()" id="save-btn" class="w-full bg-blue-600 py-4 rounded-xl font-black text-white uppercase tracking-widest text-sm shadow-lg active:scale-95 transition-all">
            Save Inspection
        </button>
    </div>

    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyCcX7KNM-w1A-3sgNoFwKxMVO7M7_e1Ab4",
          authDomain: "all-terrain-8755d.firebaseapp.com",
          projectId: "all-terrain-8755d",
          storageBucket: "all-terrain-8755d.firebasestorage.app",
          messagingSenderId: "409885375480",
          appId: "1:409885375480:web:bb2fc6df313721e195340d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentEmoji = "💧";
        const panel = document.getElementById('side-panel');

        function abrirPanel() { panel.classList.add('open'); }
        function cerrarPanel() { panel.classList.remove('open'); }

        // Gesto de cierre simplificado para evitar que se salga de pantalla
        let touchStartY = 0;
        panel.addEventListener('touchstart', (e) => { touchStartY = e.touches[0].clientY; }, {passive: true});
        panel.addEventListener('touchmove', (e) => {
            let touchMoveY = e.touches[0].clientY;
            if (touchMoveY - touchStartY > 80) { cerrarPanel(); }
        }, {passive: true});

        function setStatus(emoji, btn) {
            currentEmoji = emoji;
            document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function cambiarIdioma() {
            const l = document.getElementById('lang').value;
            const t = {
                es: { title: "Análisis de Campo", tds: "TDS (PPM)", cloro: "Cloro (MG/L)", save: "Guardar Reporte", search: "Buscar...", notes: "Notas..." },
                en: { title: "Field Analysis", tds: "TDS (PPM)", cloro: "Chlorine", save: "Save Inspection", search: "Search address...", notes: "Notes..." }
            };
            document.getElementById('txt-title').innerText = t[l].title;
            document.getElementById('txt-tds').innerText = t[l].tds;
            document.getElementById('txt-cloro').innerText = t[l].cloro;
            document.getElementById('save-btn').innerText = t[l].save;
            document.getElementById('searchInput').placeholder = t[l].search;
            document.getElementById('notas').placeholder = t[l].notes;
        }

        async function saveData() {
            const data = {
                tds: document.getElementById('tds').value,
                cloro: document.getElementById('cloro').value,
                notas: document.getElementById('notas').value,
                estado: currentEmoji,
                fecha: firebase.firestore.FieldValue.serverTimestamp()
            };
            if(!data.tds || !data.cloro) return alert("Missing data");
            try {
                await db.collection("analisis").add(data);
                alert("✅ Saved!");
                cerrarPanel();
            } catch (e) { alert("Error"); }
        }
    </script>
</body>
</html>
