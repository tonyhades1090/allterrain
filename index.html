<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>All Terrain Pro</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #020617; color: white; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .status-btn { transition: all 0.2s; border: 2px solid transparent; }
        .status-btn.active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.2); transform: scale(1.1); }
        input::placeholder { color: #64748b; }
    </style>
</head>
<body>

    <div class="p-4 space-y-4 fixed top-0 inset-x-0 z-50 bg-slate-950/80 backdrop-blur-md">
        <div class="flex justify-between items-center">
            <h1 class="text-xl font-black italic text-blue-500 tracking-tighter">ALL TERRAIN</h1>
            <select id="lang" class="bg-slate-800 text-white text-[10px] p-2 rounded-xl border-none outline-none">
                <option value="es">ESPAÑOL</option>
                <option value="en">ENGLISH</option>
                <option value="fr">FRANÇAIS</option>
                <option value="de">DEUTSCH</option>
                <option value="it">ITALIANO</option>
                <option value="pt">PORTUGUÊS</option>
                <option value="ru">РУССКИЙ</option>
                <option value="ar">العربية</option>
                <option value="zh">中文</option>
                <option value="ja">日本語</option>
            </select>
        </div>
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
            <input type="text" placeholder="Buscar casa o cliente..." class="w-full bg-slate-900 p-4 pl-12 rounded-2xl border border-slate-800 focus:border-blue-500 outline-none transition-all">
        </div>
    </div>

    <div class="mt-40 p-4 pb-32">
        <div class="glass p-6 rounded-[2.5rem] shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-blue-400 font-bold tracking-widest uppercase text-sm">Nueva Inspección</h2>
                <span id="house-tag" class="bg-blue-600/20 text-blue-400 px-3 py-1 rounded-full text-xs font-bold">#---</span>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="space-y-2">
                    <label class="text-[10px] text-slate-500 ml-2 font-bold uppercase">TDS (PPM)</label>
                    <input id="tds" type="number" placeholder="000" class="w-full bg-slate-900 p-5 rounded-3xl text-center text-2xl font-black text-white">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] text-slate-500 ml-2 font-bold uppercase">Cloro (MG/L)</label>
                    <input id="cloro" type="number" step="0.1" placeholder="0.0" class="w-full bg-slate-900 p-5 rounded-3xl text-center text-2xl font-black text-white">
                </div>
            </div>

            <label class="text-[10px] text-slate-500 ml-2 font-bold uppercase mb-2 block">Estado del Sistema</label>
            <div class="grid grid-cols-4 gap-3 mb-6">
                <button onclick="setStatus('💧', this)" class="status-btn bg-slate-900 p-4 rounded-2xl text-2xl">💧</button>
                <button onclick="setStatus('✅', this)" class="status-btn bg-slate-900 p-4 rounded-2xl text-2xl">✅</button>
                <button onclick="setStatus('❌', this)" class="status-btn bg-slate-900 p-4 rounded-2xl text-2xl">❌</button>
                <button onclick="setStatus('⚠️', this)" class="status-btn bg-slate-900 p-4 rounded-2xl text-2xl">⚠️</button>
            </div>

            <label class="text-[10px] text-slate-500 ml-2 font-bold uppercase mb-2 block">Observaciones</label>
            <textarea id="notas" class="w-full bg-slate-900 p-4 rounded-2xl h-28 text-sm outline-none border border-slate-800 mb-6" placeholder="Escribe detalles aquí..."></textarea>

            <button onclick="guardarTodo()" id="main-btn" class="w-full bg-blue-600 py-5 rounded-[2rem] font-black text-white tracking-[0.2em] shadow-[0_0_20px_rgba(59,130,246,0.5)] active:scale-95 transition-all">
                FINALIZAR REPORTE
            </button>
        </div>
    </div>

    <script>
        // Configuración Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyCcX7KNM-w1A-3sgNoFwKxMVO7M7_e1Ab4",
          authDomain: "all-terrain-8755d.firebaseapp.com",
          projectId: "all-terrain-8755d",
          storageBucket: "all-terrain-8755d.firebasestorage.app",
          messagingSenderId: "409885375480",
          appId: "1:409885375480:web:bb2fc6df313721e195340d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentStatus = "💧";
        document.getElementById('house-tag').innerText = "#" + Math.floor(Math.random()*9000 + 1000);

        function setStatus(emoji, el) {
            currentStatus = emoji;
            document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
        }

        async function guardarTodo() {
            const btn = document.getElementById('main-btn');
            const data = {
                tds: document.getElementById('tds').value,
                cloro: document.getElementById('cloro').value,
                notas: document.getElementById('notas').value,
                estado: currentStatus,
                idioma: document.getElementById('lang').value,
                casa: document.getElementById('house-tag').innerText,
                fecha: firebase.firestore.FieldValue.serverTimestamp()
            };

            if(!data.tds || !data.cloro) return alert("Por favor completa los niveles de TDS y Cloro");

            btn.innerText = "PROCESANDO...";
            btn.disabled = true;

            try {
                await db.collection("analisis").add(data);
                alert("🚀 REPORTE ENVIADO CON ÉXITO");
                location.reload(); 
            } catch (e) {
                alert("Error de conexión: " + e.message);
                btn.disabled = false;
                btn.innerText = "FINALIZAR REPORTE";
            }
        }
    </script>
</body>
</html>
