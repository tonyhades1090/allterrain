<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LandMaster Pro - Aquafill</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css' rel='stylesheet' />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, sans-serif; background: #000; overflow: hidden; }
        #login-screen { position: fixed; inset: 0; background: white; z-index: 5000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { width: 100%; max-width: 380px; text-align: center; }
        input, select, textarea { width: 100%; padding: 15px; margin: 8px 0; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; font-size: 16px; }
        .btn-main { width: 100%; padding: 16px; background: #1a73e8; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-link { color: #1a73e8; background: none; border: none; cursor: pointer; margin-top: 15px; font-size: 14px; }
        
        #map { height: 100vh; width: 100vw; position: absolute; }
        .search-bar { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; width: 90%; max-width: 500px; background: white; border-radius: 30px; display: flex; padding: 5px 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .side-controls { position: absolute; bottom: 30px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 15px; }
        .btn-map { width: 60px; height: 60px; border-radius: 50%; background: white; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-size: 26px; display: flex; align-items: center; justify-content: center; }

        /* MODAL DE DATOS */
        #modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal-card { background: white; width: 90%; max-width: 400px; padding: 20px; border-radius: 20px; position: relative; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h1 style="color:#1a73e8">LandMaster</h1>
            <div id="auth-title" style="margin-bottom: 20px; font-weight: bold;">Iniciar Sesión</div>
            <input type="email" id="email" placeholder="Correo electrónico">
            <input type="password" id="password" placeholder="Contraseña">
            <button class="btn-main" id="main-auth-btn" onclick="handleAuth()">ENTRAR</button>
            <button class="btn-link" id="toggle-auth" onclick="toggleAuthMode()">No tengo cuenta, registrarme</button>
            <button class="btn-link" onclick="resetPassword()">¿Olvidaste tu contraseña?</button>
        </div>
    </div>

    <div id="app-ui" style="display:none;">
        <div class="search-bar">
            <input type="text" id="search-input" style="border:none; flex:1; outline:none;" placeholder="Buscar dirección...">
            <button onclick="doSearch()" style="background:none; border:none; font-size:20px;">🔍</button>
        </div>
        <div class="side-controls">
            <button class="btn-map" onclick="goToMe()">🎯</button>
            <button class="btn-map" id="vis-btn" onclick="toggleVis()">👁️</button>
            <button class="btn-map" onclick="logout()">🚪</button>
        </div>
    </div>

    <div id="modal-overlay">
        <div class="modal-card">
            <h3 id="modal-title">Detalles Aquafill</h3>
            <label style="font-size: 12px; color: #666;">Icono de Estado</label>
            <select id="f-icon">
                <option value="💧">💧 Gota de agua</option>
                <option value="❌">❌ X roja</option>
                <option value="✅">✅ Checkmark</option>
                <option value="⌚">⌚ Reloj</option>
                <option value="none">Quitar Marcador</option>
            </select>
            <input type="number" id="f-tds" placeholder="TDS (PPM)">
            <input type="number" id="f-cloro" placeholder="Cloro (mg/L)">
            <input type="text" id="f-hardness" placeholder="Dureza del agua">
            <textarea id="f-note" placeholder="Notas adicionales..." rows="3"></textarea>
            <button class="btn-main" onclick="saveData()">GUARDAR</button>
            <button class="btn-link" style="color:red" onclick="closeModal()">Cancelar</button>
        </div>
    </div>

    <div id="map"></div>

<script>
    // CONFIGURACIÓN FIREBASE (Tus datos reales)
    const firebaseConfig = {
        apiKey: "AIzaSyAK9cldIvt1JZJ-fB-1J7Z51FLxxzT3oPg",
        authDomain: "landmaster-aquafill.firebaseapp.com",
        projectId: "landmaster-aquafill",
        storageBucket: "landmaster-aquafill.firebasestorage.app",
        messagingSenderId: "917998011849",
        appId: "1:917998011849:web:3e6eca20719d342fac1418"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    let map;
    let isLoginMode = true;
    let storage = JSON.parse(localStorage.getItem('aquafill_data')) || {};
    let mapMarkers = [];
    let isVisible = true;
    let currentId = null;
    let currentCoords = null;

    // --- LOGICA DE AUTENTICACIÓN REAL ---
    function toggleAuthMode() {
        isLoginMode = !isLoginMode;
        document.getElementById('auth-title').innerText = isLoginMode ? 'Iniciar Sesión' : 'Crear Cuenta';
        document.getElementById('main-auth-btn').innerText = isLoginMode ? 'ENTRAR' : 'REGISTRARME';
        document.getElementById('toggle-auth').innerText = isLoginMode ? 'No tengo cuenta, registrarme' : 'Ya tengo cuenta, entrar';
    }

    async function handleAuth() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        if(!email || !pass) return alert("Completa los campos");

        try {
            if(isLoginMode) {
                await auth.signInWithEmailAndPassword(email, pass);
            } else {
                await auth.createUserWithEmailAndPassword(email, pass);
                alert("Cuenta creada exitosamente");
            }
        } catch (e) { alert(e.message); }
    }

    function resetPassword() {
        const email = document.getElementById('email').value;
        if(!email) return alert("Escribe tu correo para enviarte el link");
        auth.sendPasswordResetEmail(email).then(() => alert("Email enviado para restablecer clave"));
    }

    auth.onAuthStateChanged(user => {
        if(user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-ui').style.display = 'block';
            initMap();
        } else {
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('app-ui').style.display = 'none';
        }
    });

    function logout() { auth.signOut(); location.reload(); }

    // --- LOGICA DEL MAPA ---
    function initMap() {
        map = new maplibregl.Map({
            container: 'map',
            style: {
                "version": 8,
                "sources": { "google-hybrid": { "type": "raster", "tiles": ["https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}"], "tileSize": 256 }},
                "layers": [{"id": "h", "type": "raster", "source": "google-hybrid"}]
            },
            center: [-80.1918, 25.7617], zoom: 18, pitch: 0, bearing: 0
        });

        map.on('click', (e) => openModal(e.lngLat));
        map.on('load', renderMarkers);
    }

    function openModal(lngLat, id = null) {
        currentCoords = lngLat;
        currentId = id || `${lngLat.lng.toFixed(6)}|${lngLat.lat.toFixed(6)}`;
        const d = storage[currentId] || {icon:'💧', tds:'', cloro:'', hardness:'', note:''};
        
        document.getElementById('f-icon').value = d.icon;
        document.getElementById('f-tds').value = d.tds;
        document.getElementById('f-cloro').value = d.cloro;
        document.getElementById('f-hardness').value = d.hardness;
        document.getElementById('f-note').value = d.note;
        
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }

    function saveData() {
        const icon = document.getElementById('f-icon').value;
        if(icon === 'none') { delete storage[currentId]; }
        else {
            storage[currentId] = {
                lng: currentCoords.lng, lat: currentCoords.lat, icon,
                tds: document.getElementById('f-tds').value,
                cloro: document.getElementById('f-cloro').value,
                hardness: document.getElementById('f-hardness').value,
                note: document.getElementById('f-note').value
            };
        }
        localStorage.setItem('aquafill_data', JSON.stringify(storage));
        renderMarkers();
        closeModal();
    }

    function renderMarkers() {
        mapMarkers.forEach(m => m.remove());
        mapMarkers = [];
        if(!isVisible) return;
        Object.keys(storage).forEach(id => {
            const p = storage[id];
            const el = document.createElement('div');
            el.innerHTML = p.icon; el.style.fontSize = '35px'; el.style.cursor='pointer';
            const m = new maplibregl.Marker({element: el}).setLngLat([p.lng, p.lat]).addTo(map);
            el.onclick = (e) => { e.stopPropagation(); openModal({lng:p.lng, lat:p.lat}, id); };
            mapMarkers.push(m);
        });
    }

    function goToMe() {
        navigator.geolocation.getCurrentPosition(p => {
            map.flyTo({ center: [p.coords.longitude, p.coords.latitude], zoom: 19, pitch: 0 });
        });
    }

    function toggleVis() {
        isVisible = !isVisible;
        document.getElementById('vis-btn').style.background = isVisible ? 'white' : '#e8f0fe';
        renderMarkers();
    }

    async function doSearch() {
        const q = document.getElementById('search-input').value;
        const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}`);
        const d = await r.json();
        if(d[0]) map.flyTo({ center: [d[0].lon, d[0].lat], zoom: 19, pitch:0 });
    }
</script>
</body>
</html>
