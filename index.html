<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LandMaster Pro - Aquafill</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css' rel='stylesheet' />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, sans-serif; background: #000; overflow: hidden; }
        #login-screen { position: fixed; inset: 0; background: white; z-index: 5000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-card { width: 100%; max-width: 380px; text-align: center; }
        input, select, textarea { width: 100%; padding: 15px; margin: 8px 0; border: 1px solid #ddd; border-radius: 12px; box-sizing: border-box; font-size: 16px; }
        .btn-main { width: 100%; padding: 16px; background: #1a73e8; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-link { color: #1a73e8; background: none; border: none; cursor: pointer; margin-top: 15px; font-size: 14px; }
        #map { height: 100vh; width: 100vw; position: absolute; }
        .side-controls { position: absolute; bottom: 30px; right: 20px; z-index: 1000; display: flex; flex-direction: column; gap: 15px; }
        .btn-map { width: 60px; height: 60px; border-radius: 50%; background: white; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-size: 26px; display: flex; align-items: center; justify-content: center; }
        #modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 2000; display: none; align-items: center; justify-content: center; }
        .modal-card { background: white; width: 90%; max-width: 400px; padding: 20px; border-radius: 20px; }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-card">
            <h1 style="color:#1a73e8">LandMaster</h1>
            <div id="auth-title" style="margin-bottom: 20px; font-weight: bold;">Iniciar Sesión</div>
            <input type="email" id="email" placeholder="Correo electrónico">
            <input type="password" id="password" placeholder="Contraseña">
            <button class="btn-main" onclick="handleAuth()">ENTRAR</button>
            <button class="btn-link" onclick="toggleAuthMode()">No tengo cuenta, registrarme</button>
            <button class="btn-link" onclick="resetPassword()">¿Olvidaste tu contraseña?</button>
        </div>
    </div>
    <div id="app-ui" style="display:none;">
        <div class="side-controls">
            <button class="btn-map" onclick="goToMe()">🎯</button>
            <button class="btn-map" onclick="logout()">🚪</button>
        </div>
    </div>
    <div id="modal-overlay">
        <div class="modal-card">
            <h3>Datos Aquafill</h3>
            <select id="f-icon">
                <option value="💧">💧 Gota</option>
                <option value="❌">❌ X roja</option>
                <option value="✅">✅ Check</option>
                <option value="none">Quitar</option>
            </select>
            <input type="number" id="f-tds" placeholder="TDS">
            <input type="number" id="f-cloro" placeholder="Cloro">
            <textarea id="f-note" placeholder="Notas..."></textarea>
            <button class="btn-main" onclick="saveData()">GUARDAR</button>
            <button class="btn-link" onclick="closeModal()">Cancelar</button>
        </div>
    </div>
    <div id="map"></div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAK9cldIvt1JZJ-fB-1J7Z51FLxxzT3oPg",
        authDomain: "landmaster-aquafill.firebaseapp.com",
        projectId: "landmaster-aquafill",
        storageBucket: "landmaster-aquafill.firebasestorage.app",
        messagingSenderId: "917998011849",
        appId: "1:917998011849:web:3e6eca20719d342fac1418"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const admins = ["tonyhades@gmail.com"];

    let map, isLoginMode = true, storage = {}, mapMarkers = [];

    auth.onAuthStateChanged(user => {
        if(user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-ui').style.display = 'block';
            if (admins.includes(user.email)) showAdminButton();
            initMap();
        }
    });

    function showAdminButton() {
        const btn = document.createElement('button');
        btn.className = 'btn-map'; btn.innerHTML = '👤';
        btn.onclick = () => alert("Panel Admin: Aquí verás a tus técnicos próximamente.");
        document.querySelector('.side-controls').appendChild(btn);
    }

    function initMap() {
        map = new maplibregl.Map({
            container: 'map',
            style: { "version": 8, "sources": { "gh": { "type": "raster", "tiles": ["https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}"], "tileSize": 256 }}, "layers": [{"id":"h","type":"raster","source":"gh"}] },
            center: [-80.1918, 25.7617], zoom: 18
        });
        map.on('click', e => openModal(e.lngLat));
        db.collection("marcadores").onSnapshot(snap => {
            storage = {}; snap.forEach(doc => storage[doc.id] = doc.data());
            renderMarkers();
        });
    }

    function openModal(lngLat, id = null) {
        currentCoords = lngLat;
        currentId = id || `${lngLat.lng.toFixed(6)}|${lngLat.lat.toFixed(6)}`;
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    function saveData() {
        const data = {
            lng: currentCoords.lng, lat: currentCoords.lat,
            icon: document.getElementById('f-icon').value,
            tds: document.getElementById('f-tds').value,
            cloro: document.getElementById('f-cloro').value,
            note: document.getElementById('f-note').value
        };
        if(data.icon === 'none') db.collection("marcadores").doc(currentId).delete();
        else db.collection("marcadores").doc(currentId).set(data);
        closeModal();
    }

    function renderMarkers() {
        mapMarkers.forEach(m => m.remove());
        Object.keys(storage).forEach(id => {
            const p = storage[id];
            const el = document.createElement('div');
            el.innerHTML = p.icon; el.style.fontSize = '30px';
            const m = new maplibregl.Marker({element:el}).setLngLat([p.lng, p.lat]).addTo(map);
            el.onclick = (e) => { e.stopPropagation(); openModal({lng:p.lng, lat:p.lat}, id); };
            mapMarkers.push(m);
        });
    }

    async function handleAuth() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        try {
            if(isLoginMode) await auth.signInWithEmailAndPassword(email, pass);
            else await auth.createUserWithEmailAndPassword(email, pass);
        } catch(e) { alert(e.message); }
    }

    function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
    function logout() { auth.signOut(); location.reload(); }
</script>
</body>
</html>
