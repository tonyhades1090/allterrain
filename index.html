<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>One Drop</title>

    <link rel="icon" type="image/png" href="https://i.ibb.co/S76pM5N8/one-drop-icon.png">
    <link rel="apple-touch-icon" href="https://i.ibb.co/S76pM5N8/one-drop-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.min.js"></script>

    <style>
        :root { --blue: #007aff; --green: #34c759; --orange: #ff9500; --red: #ff3b30; --bg: #f2f2f7; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        
        .lang-switcher { position: absolute; top: 15px; left: 15px; display: flex; gap: 5px; z-index: 1000; }
        .lang-btn { background: white; border: 1px solid #ddd; border-radius: 5px; padding: 3px 8px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .lang-btn.active { background: var(--blue); color: white; border-color: var(--blue); }

        #auth-screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: 90vh; }
        #app-screen { display: none; max-width: 450px; margin: auto; padding-bottom: 40px; }

        .auth-card { background: white; padding: 30px; border-radius: 25px; width: 100%; max-width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; }
        
        .header-bar { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 15px; gap: 15px; }
        .logout-btn { color: var(--red); font-weight: 700; font-size: 13px; cursor: pointer; border: 1px solid var(--red); padding: 5px 12px; border-radius: 8px; }

        h1.main-title { color: var(--blue); font-weight: 800; margin: 0; letter-spacing: -1px; text-align: center; flex-grow: 1; }
        h2 { font-size: 14px; color: #333; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 15px; text-transform: uppercase; }
        
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 11px; color: #666; text-transform: uppercase; }
        input, textarea, select { width: 100%; height: 48px; padding: 12px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #d1d1d6; font-size: 16px; background: #fff; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid-3 { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 10px; }
        .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-weight: 700; font-size: 16px; cursor: pointer; display: block; text-align: center; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-gps { background: #5856d6; color: white; margin-top: 5px; }
        .btn-gallery { background: #64d2ff; color: #000; margin-top: 10px; font-size: 14px; padding: 10px; }
        
        /* Estilo para las fotos */
        #photo-preview { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .preview-img { width: 80px; height: 80px; object-fit: cover; border-radius: 10px; border: 2px solid var(--blue); }

        .status-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .status-btn { height: 45px; border-radius: 10px; border: 1px solid #ddd; background: #f9f9f9; font-size: 9px; font-weight: 800; }
        .active-ins { background: var(--green) !important; color: white; }
        .active-pen { background: var(--orange) !important; color: white; }
        .active-no { background: var(--red) !important; color: white; }

        .savings-box { background: #e7f3ff; padding: 15px; border-radius: 15px; text-align: center; margin: 15px 0; }
        .chart-wrap { position: relative; height: 250px; width: 100%; }

        #history-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f2f2f7; z-index: 5000; overflow-y: auto; }
        .hist-card { background: white; margin: 10px; padding: 15px; border-radius: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .hist-details { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ccc; font-size: 14px; line-height: 1.6; color: #333; }
        .hist-tag { font-weight: bold; color: #666; font-size: 11px; text-transform: uppercase; }
        .edit-btn { background: var(--orange); color: white; border: none; padding: 5px 10px; border-radius: 5px; font-size: 11px; font-weight: bold; cursor: pointer; margin-right: 10px; }
    </style>
</head>
<body>

<div class="lang-switcher">
    <button class="lang-btn active" id="btn-en" onclick="setLanguage('en')">EN</button>
    <button class="lang-btn" id="btn-es" onclick="setLanguage('es')">ES</button>
</div>

<div id="auth-screen">
    <div class="auth-card">
        <h1>ONE DROP</h1>
        <input type="email" id="auth-email" placeholder="Email" autocomplete="off">
        <input type="password" id="auth-pass" placeholder="Password" autocomplete="off">
        <button class="btn btn-blue" id="btn-action" onclick="handleAuth()">SIGN IN</button>
    </div>
</div>

<div id="app-screen">
    <div class="header-bar">
        <h1 class="main-title">ONE DROP</h1>
        <div class="logout-btn" onclick="logout()" data-t="logout">LOGOUT</div>
    </div>

    <div class="card">
        <h2 data-t="clientInfo">👤 Client Info</h2>
        <div class="grid-2">
            <div><label data-t="fName">First Name</label><input type="text" id="c-name"></div>
            <div><label data-t="lName">Last Name</label><input type="text" id="c-lastname"></div>
        </div>
        <label data-t="phone">Phone</label><input type="tel" id="c-phone">
        <label data-t="address">Address</label><input type="text" id="c-address">
        <div class="grid-3">
            <div><label data-t="city">City</label><input type="text" id="c-city"></div>
            <div><label data-t="state">State</label><input type="text" id="c-state" maxlength="2"></div>
            <div><label data-t="zip">Zip</label><input type="number" id="c-zip"></div>
        </div>
        
        <label>📸 Photos / Gallery</label>
        <input type="file" id="photo-input" accept="image/*" multiple style="display:none;" onchange="handlePhotos(this)">
        <button class="btn btn-gallery" onclick="document.getElementById('photo-input').click()">📁 OPEN GALLERY</button>
        <div id="photo-preview"></div>
    </div>

    <div class="card">
        <h2 data-t="savingsTitle">📊 Savings Analysis</h2>
        <div class="grid-2">
            <div><label data-t="waterCost">Water Cost</label><input type="number" id="cost-water" oninput="calculate()"></div>
            <div><label data-t="soapCost">Soap Cost</label><input type="number" id="cost-soap" oninput="calculate()"></div>
        </div>
        <div class="grid-2">
            <div><label data-t="monthlyFee">Monthly Fee</label><input type="number" id="one-fee" value="180" oninput="calculate()"></div>
            <div>
                <label data-t="projection">Years</label>
                <select id="proj-years" onchange="calculate()">
                    <option value="1">1</option><option value="5" selected>5</option><option value="10">10</option>
                </select>
            </div>
        </div>
        <div class="savings-box">
            <span style="font-size:26px; font-weight:800; color:var(--green);" id="net-savings">$0.00</span><br>
            <small id="savings-label" data-t="netSavings">Net Savings</small>
        </div>
        <div class="chart-wrap"><canvas id="savingsChart"></canvas></div>
    </div>

    <div class="card">
        <h2 data-t="techReport">🧪 Tech Report</h2>
        <div class="grid-2">
            <div><label data-t="date">Date</label><input type="date" id="test-date"></div>
            <div><label>TDS</label><input type="number" id="tds-val"></div>
        </div>
        <div class="status-group">
            <button class="status-btn" id="st-ins" onclick="setStatus('INSTALLED')" data-t="stInstalled">INSTALLED</button>
            <button class="status-btn" id="st-pen" onclick="setStatus('PENDING')" data-t="stPending">PENDING</button>
            <button class="status-btn" id="st-no" onclick="setStatus('REJECTED')" data-t="stRejected">REJECTED</button>
        </div>
        <div class="grid-2" style="margin-top:20px;">
            <button class="btn btn-blue" onclick="saveData()" data-t="saveData">SAVE</button>
            <button class="btn" style="background:#8e8e93; color:white;" onclick="abrirHistorial()" data-t="history">HISTORY</button>
        </div>
    </div>
</div>

<div id="history-modal">
    <div style="padding:20px; background:white; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #ddd; position:sticky; top:0; z-index:100;">
        <h2 style="margin:0; border:none;" data-t="clientHistory">History</h2>
        <button onclick="cerrarHistorial()" style="background:var(--blue); color:white; border:none; padding:8px 15px; border-radius:8px; font-weight:bold;">DONE</button>
    </div>
    <div id="history-list" style="padding:10px;"></div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAK9cldIvt1JZJ-fB-1J7Z51FLxxzT3oPg", projectId: "landmaster-aquafill" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    
    let chart, currentStatus = "", currentLang = 'en', savedPhotos = [];

    const translations = {
        en: { logout: "LOGOUT", clientInfo: "👤 Client Info", fName: "First Name", lName: "Last Name", phone: "Phone", address: "Address", city: "City", state: "ST", zip: "Zip", savingsTitle: "📊 Savings Analysis", waterCost: "Water / Mo", soapCost: "Soap / Mo", monthlyFee: "Fee", projection: "Years", netSavings: "Net Savings", techReport: "🧪 Tech Report", date: "Date", stInstalled: "INSTALLED", stPending: "PENDING", stRejected: "REJECTED", saveData: "SAVE", history: "HISTORY", clientHistory: "History" },
        es: { logout: "SALIR", clientInfo: "👤 Datos Cliente", fName: "Nombre", lName: "Apellido", phone: "Teléfono", address: "Dirección", city: "Ciudad", state: "Est.", zip: "Zip", savingsTitle: "📊 Análisis Ahorro", waterCost: "Agua / Mes", soapCost: "Jabón / Mes", monthlyFee: "Cuota", projection: "Años", netSavings: "Ahorro Neto", techReport: "🧪 Reporte Técnico", date: "Fecha", stInstalled: "INSTALADO", stPending: "PENDIENTE", stRejected: "RECHAZADO", saveData: "GUARDAR", history: "HISTORIAL", clientHistory: "Historial" }
    };

    // FUNCIÓN PARA MANEJAR FOTOS
    function handlePhotos(input) {
        const files = input.files;
        const preview = document.getElementById('photo-preview');
        preview.innerHTML = "";
        savedPhotos = [];

        for(let file of files) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = document.createElement('img');
                img.src = e.target.result;
                img.className = 'preview-img';
                preview.appendChild(img);
                // Guardamos la versión reducida de la imagen
                savedPhotos.push(e.target.result);
            }
            // Comprimimos un poco para no saturar la base de datos
            reader.readAsDataURL(file);
        }
    }

    function calculate() {
        const years = parseInt(document.getElementById('proj-years').value) || 1;
        const totalMonths = years * 12;
        const w = (parseFloat(document.getElementById('cost-water').value) || 0) * totalMonths;
        const s = (parseFloat(document.getElementById('cost-soap').value) || 0) * totalMonths;
        const f = (parseFloat(document.getElementById('one-fee').value) || 0) * totalMonths;
        const net = (w + s) - f;
        document.getElementById('net-savings').innerText = '$' + net.toLocaleString(undefined, {minimumFractionDigits: 2});
        var ctx = document.getElementById('savingsChart').getContext('2d');
        if(chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Current', 'One Drop'],
                datasets: [{ data: [w + s, f], backgroundColor: ['#ff3b30', '#007aff'] }]
            },
            options: { responsive: true, maintainAspectRatio: false, legend: { display: false } }
        });
    }

    async function saveData() {
        if(!currentStatus) return alert("Select status");
        await db.collection("reportes").add({
            nombre: document.getElementById('c-name').value,
            apellido: document.getElementById('c-lastname').value,
            tel: document.getElementById('c-phone').value,
            dir: document.getElementById('c-address').value,
            city: document.getElementById('c-city').value,
            state: document.getElementById('c-state').value,
            zip: document.getElementById('c-zip').value,
            estado: currentStatus,
            fotos: savedPhotos, // AQUÍ SE GUARDAN LAS FOTOS
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert("Saved with photos!");
        location.reload(); 
    }

    auth.onAuthStateChanged(user => {
        if (user) { document.getElementById('auth-screen').style.display = 'none'; document.getElementById('app-screen').style.display = 'block'; calculate(); }
        else { document.getElementById('auth-screen').style.display = 'flex'; document.getElementById('app-screen').style.display = 'none'; }
    });

    function handleAuth() {
        var e = document.getElementById('auth-email').value, p = document.getElementById('auth-pass').value;
        auth.signInWithEmailAndPassword(e, p).catch(() => auth.createUserWithEmailAndPassword(e, p));
    }

    function setStatus(v) {
        currentStatus = v;
        document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active-ins', 'active-pen', 'active-no'));
        if(v === 'INSTALLED') document.getElementById('st-ins').classList.add('active-ins');
        if(v === 'PENDING') document.getElementById('st-pen').classList.add('active-pen');
        if(v === 'REJECTED') document.getElementById('st-no').classList.add('active-no');
    }

    function abrirHistorial() { 
        document.getElementById('history-modal').style.display = "block";
        db.collection("reportes").orderBy("timestamp", "desc").get().then(snap => {
            let list = document.getElementById('history-list');
            list.innerHTML = "";
            snap.forEach(doc => {
                let d = doc.data();
                let photoHtml = "";
                if(d.fotos && d.fotos.length > 0) {
                    d.fotos.forEach(f => { photoHtml += `<img src="${f}" style="width:50px; height:50px; margin:5px; border-radius:5px;">`; });
                }
                list.innerHTML += `<div class="hist-card">
                    <b>${d.nombre} ${d.apellido}</b><br>${d.dir}<br>
                    <div style="margin-top:10px;">${photoHtml}</div>
                </div>`;
            });
        });
    }

    function cerrarHistorial() { document.getElementById('history-modal').style.display = "none"; }
    function logout() { auth.signOut(); }
    function setLanguage(l) { 
        currentLang = l;
        document.querySelectorAll('[data-t]').forEach(el => {
            const k = el.getAttribute('data-t');
            if(translations[l][k]) el.innerText = translations[l][k];
        });
    }
</script>
</body>
</html>
