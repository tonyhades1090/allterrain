<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>One Drop</title>

    <link rel="icon" type="image/png" href="https://i.ibb.co/S76pM5N8/one-drop-icon.png">
    <link rel="apple-touch-icon" href="https://i.ibb.co/S76pM5N8/one-drop-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { --blue: #007aff; --green: #34c759; --orange: #ff9500; --red: #ff3b30; --bg: #f2f2f7; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        
        /* PANTALLAS */
        #login-screen { display: none; flex-direction: column; align-items: center; justify-content: center; height: 90vh; }
        #app-screen { display: none; max-width: 450px; margin: auto; }

        .login-card { background: white; padding: 30px; border-radius: 25px; width: 100%; max-width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .logout-btn { color: var(--red); font-weight: 700; font-size: 13px; cursor: pointer; border: 1px solid var(--red); padding: 5px 12px; border-radius: 8px; }

        h1 { color: var(--blue); font-weight: 800; margin: 0; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 11px; color: #666; text-transform: uppercase; }
        input, textarea { width: 100%; height: 48px; padding: 12px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #d1d1d6; font-size: 16px; background: #fff; }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-weight: 700; font-size: 16px; cursor: pointer; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-gray { background: #8e8e93; color: white; }
        
        .status-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .status-btn { height: 45px; border-radius: 10px; border: 1px solid #ddd; background: #f9f9f9; font-size: 9px; font-weight: 800; }
        .active-ins { background: var(--green) !important; color: white; }
        .active-pen { background: var(--orange) !important; color: white; }
        .active-no { background: var(--red) !important; color: white; }

        #history-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f2f2f7; z-index: 5000; overflow-y: auto; }
        .hist-card { background: white; margin: 10px; padding: 15px; border-radius: 15px; }
        .hist-details { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #ccc; font-size: 13px; }
    </style>
</head>
<body>

<div id="login-screen">
    <div class="login-card">
        <img src="https://i.ibb.co/S76pM5N8/one-drop-icon.png" width="80" style="border-radius:15px; margin-bottom:15px;">
        <h1 style="margin-bottom:20px;">ONE DROP</h1>
        <input type="email" id="login-email" placeholder="Email">
        <input type="password" id="login-pass" placeholder="Password">
        <button class="btn btn-blue" onclick="login()">LOGIN</button>
    </div>
</div>

<div id="app-screen">
    <div class="header-bar">
        <h1>ONE DROP</h1>
        <div class="logout-btn" onclick="logout()">LOGOUT</div>
    </div>

    <div class="card">
        <h2>👤 Client Info</h2>
        <div class="grid-2">
            <input type="text" id="c-name" placeholder="Name">
            <input type="text" id="c-lastname" placeholder="Last Name">
        </div>
        <input type="tel" id="c-phone" placeholder="Phone">
        <textarea id="c-address" placeholder="Address"></textarea>
    </div>

    <div class="card">
        <h2>💰 Savings</h2>
        <div class="grid-2">
            <div><label>Water</label><input type="number" id="cost-water" oninput="calculate()"></div>
            <div><label>Soap</label><input type="number" id="cost-soap" oninput="calculate()"></div>
        </div>
        <div style="text-align:center; padding:15px; background:#e7f3ff; border-radius:15px; margin-bottom:10px;">
            <span style="font-size:24px; font-weight:800; color:var(--green);" id="net-savings">$0.00</span>
        </div>
        <canvas id="savingsChart"></canvas>
    </div>

    <div class="card">
        <h2>🧪 Report</h2>
        <div class="grid-2">
            <div><label>Date</label><input type="date" id="test-date"></div>
            <input type="number" id="tds-val" placeholder="TDS">
        </div>
        <div class="status-group">
            <button class="status-btn" id="st-ins" onclick="setStatus('INSTALLED')">INSTALLED</button>
            <button class="status-btn" id="st-pen" onclick="setStatus('PENDING')">PENDING</button>
            <button class="status-btn" id="st-no" onclick="setStatus('REJECTED')">REJECTED</button>
        </div>
        <div class="grid-2" style="margin-top:20px;">
            <button class="btn btn-blue" onclick="saveData()">SAVE</button>
            <button class="btn btn-gray" onclick="abrirHistorial()">HISTORY</button>
        </div>
    </div>
</div>

<div id="history-modal">
    <div style="padding:20px; background:white; display:flex; justify-content:space-between; align-items:center;">
        <h2 style="margin:0;">History</h2>
        <button onclick="cerrarHistorial()" style="background:var(--blue); color:white; border:none; padding:8px 15px; border-radius:8px;">DONE</button>
    </div>
    <div id="history-list"></div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAK9cldIvt1JZJ-fB-1J7Z51FLxxzT3oPg", projectId: "landmaster-aquafill" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    let chart, currentStatus = "";

    // ESTA ES LA PARTE QUE HACÍA FALTA:
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'block';
        } else {
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('app-screen').style.display = 'none';
        }
    });

    function login() {
        auth.signInWithEmailAndPassword(document.getElementById('login-email').value, document.getElementById('login-pass').value)
            .catch(e => alert("Error: " + e.message));
    }

    function logout() { auth.signOut(); }

    function setStatus(v) {
        currentStatus = v;
        document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active-ins', 'active-pen', 'active-no'));
        if(v === 'INSTALLED') document.getElementById('st-ins').classList.add('active-ins');
        if(v === 'PENDING') document.getElementById('st-pen').classList.add('active-pen');
        if(v === 'REJECTED') document.getElementById('st-no').classList.add('active-no');
    }

    async function saveData() {
        if(!currentStatus) return alert("Select status");
        await db.collection("reportes").add({
            nombre: document.getElementById('c-name').value,
            apellido: document.getElementById('c-lastname').value,
            tel: document.getElementById('c-phone').value,
            dir: document.getElementById('c-address').value,
            tds: document.getElementById('tds-val').value,
            ahorro: document.getElementById('net-savings').innerText,
            estado: currentStatus,
            fecha: document.getElementById('test-date').value,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert("Saved!");
    }

    async function abrirHistorial() {
        document.getElementById('history-modal').style.display = "block";
        const snap = await db.collection("reportes").orderBy("timestamp", "desc").get();
        const list = document.getElementById('history-list');
        list.innerHTML = "";
        snap.forEach(doc => {
            const d = doc.data();
            list.innerHTML += `
                <div class="hist-card" id="card-${doc.id}">
                    <div onclick="toggleDetalle('${doc.id}')" style="flex-grow:1;">
                        <b>${d.nombre} ${d.apellido}</b><br><small>${d.fecha} | ${d.estado}</small>
                        <div class="hist-details" id="det-${doc.id}">
                            Tel: ${d.tel}<br>Dir: ${d.dir}<br>TDS: ${d.tds}<br>Savings: ${d.ahorro}
                        </div>
                    </div>
                    <button style="border:none; color:red; background:none; font-size:20px;" onclick="borrarRegistro('${doc.id}')">✕</button>
                </div>`;
        });
    }

    function toggleDetalle(id) {
        const el = document.getElementById('det-' + id);
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }

    async function borrarRegistro(id) {
        if(confirm("Delete?")) {
            await db.collection("reportes").doc(id).delete();
            document.getElementById('card-'+id).remove();
        }
    }

    function cerrarHistorial() { document.getElementById('history-modal').style.display = "none"; }

    function calculate() {
        const w = (parseFloat(document.getElementById('cost-water').value) || 0) * 12;
        const s = (parseFloat(document.getElementById('cost-soap').value) || 0) * 12;
        const f = 180 * 12;
        const net = (w+s) - f;
        document.getElementById('net-savings').innerText = `$${net.toLocaleString()}`;
        const ctx = document.getElementById('savingsChart').getContext('2d');
        if(chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'bar',
            data: { labels: ['Current', 'One Drop'], datasets: [{ data: [w+s, f], backgroundColor: ['#ff3b30', '#007aff'] }] },
            options: { plugins: { legend: { display: false } } }
        });
    }
    document.getElementById('test-date').valueAsDate = new Date();
</script>
</body>
</html>
