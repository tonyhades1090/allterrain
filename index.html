<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Drop</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --blue: #007aff; --green: #34c759; --orange: #ff9500; --red: #ff3b30; --bg: #f2f2f7; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; padding-bottom: 50px; }
        .container { max-width: 480px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1 { color: var(--blue); text-align: center; letter-spacing: -1px; margin-bottom: 20px; font-size: 28px; }
        h2 { font-size: 16px; margin-top: 0; color: #333; border-bottom: 1px solid #eee; padding-bottom: 8px; margin-bottom: 15px; text-transform: uppercase; }
        label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 11px; color: #666; }
        
        /* Ajuste de Proporción Crítico */
        input, textarea, select { 
            width: 100%; 
            height: 50px; /* Altura uniforme para evitar desproporción */
            padding: 12px; 
            margin-bottom: 12px; 
            border-radius: 12px; 
            border: 1px solid #d1d1d6; 
            font-size: 16px; 
            box-sizing: border-box; 
            background-color: #fff;
            appearance: none; /* Quita estilos raros de iOS */
            -webkit-appearance: none;
        }
        
        /* Para que el calendario se vea igual de alto */
        input[type="date"] {
            display: flex;
            align-items: center;
        }

        textarea { height: 90px; padding-top: 12px; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-weight: 700; font-size: 16px; cursor: pointer; margin-bottom: 10px; display: block; text-align: center; text-decoration: none; }
        .btn-main { background: var(--blue); color: white; }
        .btn-sms { background: var(--green); color: white; }
        .btn-gps { background: #5856d6; color: white; }
        
        .status-group { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 5px; }
        .status-btn { height: 50px; border-radius: 12px; border: 2px solid #ddd; background: white; font-size: 10px; font-weight: bold; cursor: pointer; }
        .status-btn.active-ins { background: var(--green); color: white; border-color: var(--green); }
        .status-btn.active-pen { background: var(--orange); color: white; border-color: var(--orange); }
        .status-btn.active-no { background: var(--red); color: white; border-color: var(--red); }

        .savings-box { background: #e7f3ff; padding: 15px; border-radius: 15px; text-align: center; margin: 15px 0; border: 1px solid #cce3f5; }
        .val-highlight { font-size: 26px; font-weight: 800; color: var(--green); display: block; }
        #report-preview { background: #f8f9fa; padding: 15px; border-radius: 12px; font-family: monospace; font-size: 12px; display: none; margin-top: 15px; white-space: pre-wrap; border: 1px solid #eee; }
    </style>
</head>
<body>

<div class="container">
    <h1>ONE DROP</h1>

    <div class="card">
        <h2>👤 Datos del Cliente</h2>
        <div class="grid-2">
            <div>
                <label>Nombre</label>
                <input type="text" id="c-name" placeholder="Ej: Juan">
            </div>
            <div>
                <label>Apellido</label>
                <input type="text" id="c-lastname" placeholder="Ej: Pérez">
            </div>
        </div>
        <div class="grid-2">
            <div>
                <label>Cumpleaños</label>
                <input type="date" id="c-birthday">
            </div>
            <div>
                <label>Personas en casa</label>
                <input type="number" id="c-people" placeholder="Cantidad">
            </div>
        </div>
        <label>Número de Teléfono</label>
        <input type="tel" id="c-phone" placeholder="804-000-0000">
        
        <label>Dirección del Cliente</label>
        <textarea id="c-address" placeholder="Calle, Ciudad, Estado, Zip"></textarea>
        <button class="btn btn-gps" onclick="goMaps()">🗺️ VER RUTA EN MAPS</button>
    </div>

    <div class="card">
        <h2>💰 Comparativa de Gastos</h2>
        <div class="grid-2">
            <div>
                <label>Gasto Agua ($)</label>
                <input type="number" id="cost-water" placeholder="Mes" oninput="calculate()">
            </div>
            <div>
                <label>Gasto Jabón ($)</label>
                <input type="number" id="cost-soap" placeholder="Mes" oninput="calculate()">
            </div>
        </div>
        <label>Cuota One Drop ($)</label>
        <input type="number" id="one-fee" value="180" oninput="calculate()">
        
        <div class="savings-box">
            <span style="font-size: 11px; color: #555;">AHORRO PROYECTADO AL AÑO:</span>
            <span class="val-highlight" id="net-savings">$0.00</span>
        </div>
        <canvas id="savingsChart"></canvas>
    </div>

    <div class="card">
        <h2>🧪 Reporte Técnico</h2>
        <div class="grid-2">
            <div>
                <label>Fecha del Test</label>
                <input type="date" id="test-date">
            </div>
            <div>
                <label>TDS (PPM)</label>
                <input type="number" id="tds-val" placeholder="000">
            </div>
        </div>
        
        <label>¿Presenta Cloro?</label>
        <input type="text" id="cloro-val" placeholder="SÍ / NO o Nivel">

        <label style="margin-top: 10px;">Estado de la Venta</label>
        <div class="status-group">
            <button class="status-btn" id="st-ins" onclick="setStatus('INSTALADO')">INSTALADO</button>
            <button class="status-btn" id="st-pen" onclick="setStatus('PENDIENTE')">PENDIENTE</button>
            <button class="status-btn" id="st-no" onclick="setStatus('NO INTERESADO')">NO INTERESADO</button>
        </div>
        
        <button class="btn btn-main" style="margin-top:20px;" onclick="generateReport()">📝 GENERAR REPORTE</button>
        <div id="report-preview"></div>
        <button class="btn btn-sms" id="sms-btn" style="display:none;" onclick="sendSMS()">📲 ENVIAR POR SMS</button>
    </div>
</div>

<script>
    let chart;
    let currentStatus = "";

    document.getElementById('test-date').valueAsDate = new Date();

    function setStatus(val) {
        currentStatus = val;
        document.getElementById('st-ins').className = 'status-btn' + (val === 'INSTALADO' ? ' active-ins' : '');
        document.getElementById('st-pen').className = 'status-btn' + (val === 'PENDIENTE' ? ' active-pen' : '');
        document.getElementById('st-no').className = 'status-btn' + (val === 'NO INTERESADO' ? ' active-no' : '');
    }

    function goMaps() {
        const addr = document.getElementById('c-address').value;
        if(!addr) return alert("Ingrese la dirección");
        window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(addr)}`, '_blank');
    }

    function calculate() {
        const water = parseFloat(document.getElementById('cost-water').value) || 0;
        const soap = parseFloat(document.getElementById('cost-soap').value) || 0;
        const fee = parseFloat(document.getElementById('one-fee').value) || 0;
        const totalCurrentYear = (water + soap) * 12;
        const totalOneDropYear = fee * 12;
        const net = totalCurrentYear - totalOneDropYear;
        document.getElementById('net-savings').innerText = `$${net.toLocaleString()}`;
        
        const ctx = document.getElementById('savingsChart').getContext('2d');
        if(chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'bar',
            data: { 
                labels: ['Actual', 'One Drop'], 
                datasets: [{ data: [totalCurrentYear, totalOneDropYear], backgroundColor: ['#ff3b30', '#007aff'] }] 
            },
            options: { plugins: { legend: { display: false } } }
        });
    }

    function generateReport() {
        const name = document.getElementById('c-name').value;
        const lastname = document.getElementById('c-lastname').value;
        const phone = document.getElementById('c-phone').value;
        const tds = document.getElementById('tds-val').value;
        const cloro = document.getElementById('cloro-val').value;
        const save = document.getElementById('net-savings').innerText;
        const date = document.getElementById('test-date').value;
        
        if(!currentStatus) return alert("Seleccione un estado de venta");

        const msg = `ONE DROP - REPORTE\nFecha: ${date}\nCliente: ${name} ${lastname}\nTel: ${phone}\nTDS: ${tds} PPM\nCloro: ${cloro}\nEstado: ${currentStatus}\nAhorro Anual: ${save}\n\n(Favor de adjuntar la foto del test)`;
        
        document.getElementById('report-preview').innerText = msg;
        document.getElementById('report-preview').style.display = 'block';
        document.getElementById('sms-btn').style.display = 'block';
        navigator.clipboard.writeText(msg);
        alert("Reporte copiado.");
    }

    function sendSMS() {
        const phone = document.getElementById('c-phone').value;
        const text = document.getElementById('report-preview').innerText;
        if(!phone) return alert("Ingrese el teléfono del cliente");
        window.location.href = `sms:${phone}?body=${encodeURIComponent(text)}`;
    }

    calculate();
</script>
</body>
</html>
