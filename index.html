<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALL TERRAIN SYSTEM</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #f1f5f9; font-family: sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; z-index: 1; display: none; }
        #auth-container { position: fixed; inset: 0; z-index: 5000; background: #0f172a; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: white; width: 100%; max-width: 380px; padding: 40px; border-radius: 2rem; text-align: center; }
        input, textarea { background: #f8fafc; border: 1px solid #e2e8f0; width: 100%; padding: 14px; border-radius: 1rem; margin-bottom: 10px; outline: none; color: #1e293b; font-weight: 600; }
        
        .bottom-panel { position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-radius: 2.5rem 2.5rem 0 0; z-index: 2000; padding: 25px; transform: translateY(100%); transition: 0.4s cubic-bezier(0, 0, 0.2, 1); box-shadow: 0 -10px 30px rgba(0,0,0,0.1); }
        .bottom-panel.open { transform: translateY(0); }
        
        .status-btn { background: #f1f5f9; border: 2px solid transparent; border-radius: 1rem; padding: 12px; font-size: 1.6rem; transition: 0.2s; }
        .status-btn.active { border-color: #3b82f6; background: #eff6ff; transform: scale(1.1); }
        .pin-circle { width: 42px; height: 42px; border-radius: 50%; border: 3px solid white; display: flex; align-items: center; justify-content: center; color: white; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div id="auth-container">
        <div class="auth-card">
            <h1 class="text-3xl font-black mb-2 text-slate-900">ALL TERRAIN</h1>
            <p class="text-slate-400 text-sm mb-8 font-bold uppercase tracking-widest">Property Intelligence</p>
            <input id="email" type="email" placeholder="Usuario">
            <input id="pass" type="password" placeholder="Contraseña">
            <button onclick="handleAuth()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold uppercase shadow-lg shadow-blue-200">Entrar al Mapa</button>
        </div>
    </div>

    <div id="map"></div>

    <div id="ui-controls" style="display:none;">
        <div class="fixed top-5 inset-x-4 z-[1000] flex gap-2">
            <input id="search-input" type="text" placeholder="Buscar dirección..." class="flex-1 bg-white p-4 rounded-2xl shadow-xl font-bold text-slate-800 outline-none border-none">
            <button onclick="buscarDireccion()" class="bg-blue-600 text-white w-14 rounded-2xl shadow-xl flex items-center justify-center"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <button id="admin-btn" class="fixed bottom-32 right-6 w-14 h-14 bg-red-600 text-white rounded-full shadow-2xl hidden z-[1000]" onclick="verTodo()"><i class="fa-solid fa-eye text-xl"></i></button>
        <button class="fixed bottom-10 right-6 w-14 h-14 bg-white text-blue-600 rounded-full shadow-2xl z-[1000] flex items-center justify-center" onclick="map.locate({setView:true, maxZoom:19})"><i class="fa-solid fa-crosshairs text-xl"></i></button>

        <div id="info-panel" class="bottom-panel">
            <div class="flex justify-between items-start mb-2">
                <div>
                    <h2 id="display-addr" class="font-black text-xl text-slate-900 leading-tight">Dirección</h2>
                    <p class="text-blue-500 font-bold text-[10px] uppercase tracking-tighter">Ficha de Propiedad</p>
                </div>
                <button onclick="cerrarPanel()" class="text-slate-300"><i class="fa-solid fa-circle-xmark text-3xl"></i></button>
            </div>

            <div class="grid grid-cols-4 gap-2 my-6">
                <button onclick="setEmoji('✅','#22c55e',this)" class="status-btn active">✅</button>
                <button onclick="setEmoji('❌','#ef4444',this)" class="status-btn">❌</button>
                <button onclick="setEmoji('⚠️','#f59e0b',this)" class="status-btn">⚠️</button>
                <button onclick="setEmoji('⏳','#64748b',this)" class="status-btn">⏳</button>
            </div>

            <div class="grid grid-cols-2 gap-3 mb-4">
                <div class="bg-slate-50 p-3 rounded-xl">
                    <label class="text-[9px] font-bold text-slate-400 block mb-1">TDS</label>
                    <input id="tds" type="number" placeholder="0" class="!bg-transparent !mb-0 !p-0 !border-none !text-xl !font-black">
                </div>
                <div class="bg-slate-50 p-3 rounded-xl">
                    <label class="text-[9px] font-bold text-slate-400 block mb-1">CLORO</label>
                    <input id="cloro" type="number" step="0.1" placeholder="0.0" class="!bg-transparent !mb-0 !p-0 !border-none !text-xl !font-black">
                </div>
            </div>

            <textarea id="notas" placeholder="Notas sobre el dueño o la casa..." class="text-sm h-20"></textarea>

            <button onclick="guardar()" class="w-full bg-blue-600 py-4 rounded-xl font-black text-white uppercase shadow-lg active:scale-95 transition-all">Guardar en Base de Datos</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCcX7KNM-w1A-3sgNoFwKxMVO7M7_e1Ab4", authDomain: "all-terrain-8755d.firebaseapp.com", projectId: "all-terrain-8755d", appId: "1:409885375480:web:bb2fc6df313721e195340d" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();

        let map, marker, activeEmoji = '✅', activeColor = '#22c55e';

        async function handleAuth() {
            const e = document.getElementById('email').value, p = document.getElementById('pass').value;
            try { await auth.signInWithEmailAndPassword(e,p); } catch(err){ alert("Error: Acceso denegado"); }
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                document.getElementById('auth-container').style.display='none';
                document.getElementById('map').style.display='block';
                document.getElementById('ui-controls').style.display='block';
                if(user.email === "tonyhades@gmail.com") document.getElementById('admin-btn').classList.remove('hidden');
                initMap();
            }
        });

        function initMap() {
            if(map) return;
            map = L.map('map', { zoomControl: false }).setView([25.76, -80.19], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 20 }).addTo(map);
            map.on('click', e => colocarPin(e.latlng.lat, e.latlng.lng));
        }

        async function colocarPin(lat, lng) {
            const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&addressdetails=1`);
            const data = await res.json();
            const calle = (data.address.house_number || "") + " " + (data.address.road || "Propiedad");
            
            if(marker) map.removeLayer(marker);
            marker = L.marker([lat, lng]).addTo(map);
            updateIcon();
            
            document.getElementById('display-addr').innerText = calle;
            document.getElementById('info-panel').classList.add('open');
            
            // Intentar cargar datos si ya existen
            const query = await db.collection("registros").where("direccion", "==", calle).get();
            if(!query.empty) {
                const d = query.docs[0].data();
                document.getElementById('tds').value = d.tds || "";
                document.getElementById('cloro').value = d.cloro || "";
                document.getElementById('notas').value = d.notas || "";
            } else {
                document.getElementById('tds').value = "";
                document.getElementById('cloro').value = "";
                document.getElementById('notas').value = "";
            }
        }

        async function buscarDireccion() {
            const q = document.getElementById('search-input').value;
            if(!q) return;
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${q}`);
            const data = await res.json();
            if(data.length > 0) {
                map.setView([data[0].lat, data[0].lon], 19);
                colocarPin(data[0].lat, data[0].lon);
            }
        }

        function setEmoji(e, c, btn) {
            activeEmoji = e; activeColor = c;
            document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            updateIcon();
        }

        function updateIcon() {
            if(!marker) return;
            marker.setIcon(L.divIcon({ className:'', html:`<div class="pin-circle" style="background:${activeColor}">${activeEmoji}</div>`, iconSize:[42,42], iconAnchor:[21,21] }));
        }

        function cerrarPanel() { document.getElementById('info-panel').classList.remove('open'); if(marker) map.removeLayer(marker); }

        async function guardar() {
            const d = {
                lat: marker.getLatLng().lat,
                lng: marker.getLatLng().lng,
                direccion: document.getElementById('display-addr').innerText,
                tds: document.getElementById('tds').value,
                cloro: document.getElementById('cloro').value,
                notas: document.getElementById('notas').value,
                estado: activeEmoji,
                color: activeColor,
                usuario: auth.currentUser.email,
                fecha: new Date()
            };
            await db.collection("registros").add(d);
            alert("Propiedad Guardada");
            cerrarPanel();
        }

        async function verTodo() {
            const snap = await db.collection("registros").get();
            snap.forEach(doc => {
                const d = doc.data();
                L.marker([d.lat, d.lng]).addTo(map).setIcon(L.divIcon({ 
                    className:'', 
                    html:`<div class="pin-circle" style="background:${d.color}; transform:scale(0.85)">${d.estado}</div>`, 
                    iconSize:[42,42], iconAnchor:[21,21] 
                })).on('click', () => {
                    document.getElementById('display-addr').innerText = d.direccion;
                    document.getElementById('tds').value = d.tds;
                    document.getElementById('cloro').value = d.cloro;
                    document.getElementById('notas').value = d.notas;
                    document.getElementById('info-panel').classList.add('open');
                });
            });
        }
    </script>
</body>
</html>
